<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>שלושה בשורה</title>
<link rel="stylesheet" href="../shared/fonts/fonts.css">   <!-- local font, no internet needed (screens standard ס8) -->
<style>
    /* no size jump on refresh: the start panel waits for FL.screen (screen.js adds .fl-ready), at most 3 s (Golan 23.10) */
    html:not(.fl-ready) #start > * { visibility: hidden; animation: flShow 0s 3s forwards; }
    @keyframes flShow { to { visibility: visible; } }
  /* Same look, buttons and sizes as the car and gates game (voice/race-gates-voice), so the child feels it is one game. */
  :root {
    --sky: #bfe6ff;
    --ink: #1d2a3a;
    --card: #ffffffee;
    --accent: #ff8a3d;
    --accent-ink: #ffffff;
    --good: #2bb673;
    --muted: #5b6b7f;
  }
  /* single deliberate look (daylight world): same colours in light and dark */
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--sky);
    font-family: "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud[hidden] { display: none; }

  .round-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: 30px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 #c45f1d;
  }
  .round-btn:active { box-shadow: 0 1px 0 #c45f1d; }

  .stars {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px;
    background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 26px; font-weight: 800;
    box-shadow: 0 4px 16px #0002;
  }

  .gear {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink);
    box-shadow: 0 4px 16px #0002;
  }
  /* buttons in a column at the top left: door, settings (as in the car game; no pause button, Golan 16.10) */
  .hud .gear, .overlay-gear { top: calc(max(12px, env(safe-area-inset-top)) + 76px); }
  /* settings gear on every screen, a bigger, darker grey icon (Golan, 15.10) */
  .gear-ico { width: 1.45em; height: 1.45em; display: block; color: #5b6573; }
  .overlay-gear { position: absolute; left: 16px; z-index: 30; }
  .start-gear { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; }
  /* exit door, ajar, opening toward the left edge; "יציאה" tip on mouse hover (as in the car game, Golan 15.10) */
  .door-ico { width: 1em; height: 1em; display: block; }
  .door-btn { z-index: 30; }
  .door-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #2b2f3a; color: #fff; font: 700 18px "Noto Sans Hebrew", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease .25s; }
  @media (hover: hover) { .door-btn:hover::after { opacity: 1; } }
  .door-btn { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink); box-shadow: 0 4px 16px #0002; font-size: 40px; }
  /* balloon picker (instead of the car picker) */
  .cars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .cars button { border: 3px solid #d5dde6; border-radius: 18px; background: #eaf6ff; padding: 4px; cursor: pointer; aspect-ratio: 1; }
  .cars button svg { width: 100%; height: 100%; display: block; }
  .cars button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .cars button:active { transform: scale(.96); }
  .cars button.flash { animation: carFlash 1s ease-in-out; }   /* slower highlight (Golan, 16.10) */
  /* the chosen balloon grows at once, slowly, while the praise plays (as in the car game, Golan 15.10; slower 16.10) */
  #balloons button.chosen { position: relative; z-index: 2; transform: scale(1.3); border-color: var(--accent); background: #fff3ea;
    transition: transform 1.8s ease-out, box-shadow 1.8s ease-out; box-shadow: 0 8px 24px #0003; }
  @keyframes carFlash { 50% { transform: scale(1.18); border-color: #ffb27a; } }
  /* green continue button with space before the arrow (as in the car game, Golan 15.10) */


  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; background: #bfe6ffcc; z-index: 20; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  /* X in the top-right corner of settings (Golan 16.10, all games): stays in view while the panel scrolls; the scroll bar is on the left (RTL) */
  .settings { --xs: max(var(--tap-s, 48px), calc(56 * var(--u, 1px))); }
  .x-close { position: sticky; top: 0; z-index: 3; display: block; margin: 0 0 calc(-1 * var(--xs)) auto; margin-inline: 0 auto;
    width: var(--xs); height: var(--xs); border: 0; border-radius: 50%; background: #eef2f7; color: #2b2f3a;
    font: 800 calc(var(--xs) * .5) system-ui, sans-serif; line-height: 1; cursor: pointer; box-shadow: 0 2px 6px #0002; }
  .x-close:active { transform: scale(.94); }
  .panel {
    background: #fff; border-radius: 28px; padding: 28px 24px; max-width: 520px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px #0003;
  }
  .panel h1 { margin: 0 0 8px; font-size: 34px; }
  .panel p { margin: 6px 0 18px; font-size: 19px; color: var(--muted); }
  .swap-ask { background: #fff3ea; border-radius: 20px; padding: 10px 12px 14px; margin: 0 0 16px; }
  .swap-ask p { color: var(--ink); font-weight: 800; font-size: 24px; margin: 4px 0 10px; }
  .big-btn.small { font-size: 22px; padding: 10px 26px; min-height: 56px; }
  .big-btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #d5dde6; border: 2px solid #d5dde6; }
  .big-btn {
    border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
    font: 800 30px "Noto Sans Hebrew", system-ui, sans-serif; padding: 18px 44px; min-height: 76px;
    box-shadow: 0 5px 0 #c45f1d;
  }
  .big-btn:active { box-shadow: 0 2px 0 #c45f1d; }
  .big-btn:disabled { opacity: .6; }
  .start-row { display: flex; gap: 14px; justify-content: center; align-items: center; }
  #start .start-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; margin: 0 -12px; }
  #start #go { grid-column: 2; white-space: nowrap; } #start #hear { grid-column: 3; justify-self: end; }
  .spk { padding: 0; width: 84px; min-width: 84px; height: 84px; font-size: 42px; }
  #start #hear { width: 64px; min-width: 64px; height: 64px; min-height: 0; font-size: 30px; }
  .go-btn { background: #34b36b; box-shadow: 0 5px 0 #1f8048; }
  #closeSettings { background: #34b36b; box-shadow: 0 5px 0 #1f8048; } #closeSettings:active { box-shadow: 0 2px 0 #1f8048; }   /* Golan 22.10: back to the game = starts it again, green */
  .go-btn:active { box-shadow: 0 2px 0 #1f8048; }
  .go-btn.pressed { animation: goPress .9s ease-in-out; box-shadow: 0 0 0 6px #34b36b33, 0 3px 0 #1f8048; }
  @media (hover: hover) and (pointer: fine) {
    .big-btn, .round-btn, .cars button, .seg button, .letters:not(.shared) button { transition: transform .15s ease, filter .15s ease; }
    .big-btn:hover, .round-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .cars button:hover, .seg button:hover, .letters:not(.shared) button:hover:not(:disabled) { transform: translateY(-2px); border-color: #ffb27a; }
  }

  .settings { text-align: right; }
  .settings h2 { margin: 0 0 12px; font-size: 26px; text-align: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
  .seg { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; max-width: 100%; }
  .row { flex-wrap: wrap; row-gap: 8px; justify-content: flex-start; }
  .row > span:first-child { flex-basis: 100%; font-weight: 700; }   /* Golan 16.10: title on its own first line, then the options, then the explanation */
  /* settings rows (Golan 16.10, all games): title on the right of the buttons (or above them if they do not fit), the explanation on its own full line below */
  .row-note { flex-basis: 100%; display: block; font-size: 14px; line-height: 1.45; color: var(--muted); font-weight: 400; }
  .row.stack { flex-wrap: wrap; }
  .row.stack .seg { flex-shrink: 1; flex-wrap: wrap; }
  /* settings = a fixed header (X + title) over a scrolling body, as in the detective game (screens standard 4א) */
  .settings { max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
  .set-head { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .set-head .x-close { position: static; margin: 0; flex: 0 0 auto; }
  .settings .set-head h2 { flex: 1 1 auto; margin: 0; padding-inline: 0 calc(var(--xs) + 6px); }   /* the title stays centred on the window */
  .set-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  html[data-screen~="phone"] .settings .set-head h2 { padding-inline-end: 0; font-size: 22px; }   /* a narrow phone: the title keeps one line */
  .seg button {
    min-width: 76px; min-height: 52px; border-radius: 14px; border: 2px solid #d5dde6; background: #fff;
    font: 700 17px "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters-row { align-items: flex-start; }
  .letters-row > span { display: flex; flex-direction: column; gap: 4px; }
  .letters-row small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .letters.shared, #parentTable { display: block; max-width: none; width: 100%; }   /* both tables the same width, so they look the same */
  .letters { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 372px; margin: 0; }   /* Golan 16.10: 3 rows of 8 (tiles the size of the parent table) on every screen, like the parent table */
  .letters:not(.shared) button { width: auto; height: auto; aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 8px; border: 2px solid #d5dde6; background: #fff; cursor: pointer;
    font: 800 clamp(16px,3.2vw,24px) "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); }
  .letters:not(.shared) button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters:not(.shared) button:disabled { opacity: .3; cursor: default; }
  #parentTable { margin: 6px 0 8px; }
  .diag { direction: ltr; text-align: left; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  /* 3-2-1 countdown, as in the car game */
  .count { position: absolute; left: 50%; top: 42%; width: 0; height: 0; pointer-events: none; z-index: 40; }
  .count span { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
    display: grid; place-items: center; font-size: 110px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0003;
    box-shadow: 0 0 0 4px #3dff7f88, 0 0 24px #3dff7f, 0 0 54px #00e05a, 0 8px 30px #0003; animation: countPop .95s ease-out forwards; }
  @keyframes countPop { 0% { transform: scale(.4); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  /* ===== screens standard (screens/screens-standard.md): every size and place from FL.screen variables =====
     --u = one pixel of a 1280x720 board (720x1280 standing); --tap-s / --tap / --tap-play / --gap = finger floors in mm;
     --edge-* = safe area or 12 design px. No width breakpoints: only standing (portrait) or lying (landscape). */
  html[data-screen] {
    --s: max(calc(72 * var(--u)), var(--tap-s));      /* door, settings */
    --b: max(calc(84 * var(--u)), var(--tap));        /* the child's main buttons: the speakers */
    --g: max(calc(14 * var(--u)), var(--gap));        /* space between buttons */
  }
  html[data-screen] .round-btn { width: var(--s); height: var(--s); font-size: calc(var(--s) * .45); }
  html[data-screen] .door-btn { font-size: calc(var(--s) * .6); }
  html[data-screen] .door-btn, html[data-screen] .start-gear { top: var(--edge-t); left: var(--edge-l); }
  html[data-screen] .hud .gear, html[data-screen] .overlay-gear { top: calc(var(--edge-t) + var(--s) + var(--g)); left: var(--edge-l); }
  html[data-screen] .stars { top: var(--edge-t); right: var(--edge-r); font-size: max(calc(32 * var(--u)), 20px); padding: calc(8 * var(--u)) calc(18 * var(--u)); }
  html[data-screen] .overlay { padding: var(--edge-t) var(--edge-r) var(--edge-b) var(--edge-l); }
  html[data-screen] .panel { max-width: max(calc(640 * var(--u)), min(520px, 100%)); max-height: 100%; overflow-y: auto; padding: max(calc(28 * var(--u)), 14px) max(calc(24 * var(--u)), 14px); }
  html[data-screen] .panel h1 { font-size: max(calc(44 * var(--u)), 24px); }
  html[data-screen] .panel p { font-size: max(calc(24 * var(--u)), 17px); }
  html[data-screen] .big-btn { font-size: max(calc(36 * var(--u)), 22px); min-height: var(--tap); padding: calc(16 * var(--u)) calc(44 * var(--u)); }
  html[data-screen] .big-btn.small { font-size: max(calc(26 * var(--u)), 18px); min-height: var(--tap-s); padding: calc(10 * var(--u)) calc(26 * var(--u)); }
  html[data-screen] #start .start-row { gap: calc(24 * var(--u)); }
  /* start speaker: a circle as tall as the start button, the icon centred inside it (as in detective, Golan 16.10, all games) */
  html[data-screen] #start { --h: max(calc(76 * var(--u)), var(--tap)); }
  html[data-screen] #start #go { min-height: var(--h); height: var(--h); padding-block: 0; }
  html[data-screen] #start #hear { width: var(--h); min-width: var(--h); height: var(--h); min-height: 0; padding: 0;
    border-radius: 50%; display: grid; place-items: center; line-height: 1; overflow: hidden; font-size: calc(var(--h) * .47); }
  html[data-screen] .count span { width: calc(220 * var(--u)); height: calc(220 * var(--u)); left: calc(-110 * var(--u)); top: calc(-110 * var(--u)); font-size: calc(130 * var(--u)); }
  /* settings are for the parent: may go down to 9 mm buttons and 14px text (standard sec. 3) */
  html[data-screen] .seg button { min-width: max(calc(76 * var(--u)), 50px); min-height: max(calc(52 * var(--u)), calc(var(--tap-s) * .9)); font-size: max(calc(17 * var(--u)), 15px); padding: 0 calc(8 * var(--u)); }
  html[data-screen] .seg { gap: max(calc(6 * var(--u)), 5px); }
  /* balloon picker = the detective layout in every game (Golan 16.10, detective/balloon-picker-spec.md): a white card, 3 x 3 equal tiles on every screen */
  html[data-screen] #pick .panel { width: min(100%, max(calc(520 * var(--u)), 340px)); max-width: none; border-radius: max(calc(28 * var(--u)), 18px); }
  html[data-screen] .cars { grid-template-columns: repeat(3, 1fr); gap: 10px; margin-inline: auto;   /* never taller than the window: on a short PC window the tiles shrink */
    width: min(100%, calc(100dvh - var(--edge-t) - var(--edge-b) - 2 * max(calc(28 * var(--u)), 14px) - 1.4 * max(calc(34 * var(--u)), 24px) - 40px)); }
  html[data-screen] .cars button { padding: 6px; display: grid; place-items: center; }
  html[data-screen] .cars button svg { width: 94%; height: 94%; }
  /* end window = the shared FL.learner.endPanel (screens-standard 4א, all games); only the swap question is ours */
  #end .swap-ask { width: 100%; box-sizing: border-box; margin: 0; }
  @media (max-height: 520px) {
    #end .fl-end:has(#swapAsk:not([hidden])) .fl-end-note { display: none; }   /* a low screen: the swap question (it needs an answer) hides the day note */
    #end .swap-ask { padding: 6px 12px 8px; }
    #end .swap-ask p { font-size: 20px; margin: 2px 0 6px; }
  }
  html[data-screen~="landscape"] #pick { padding-inline: calc(max(var(--edge-l), var(--edge-r)) + var(--s) + 8 * var(--u)); }
  #settings .panel.settings { height: 100%; }   /* the settings window is always the same size (Golan 19.10, all games + hub) */
  #helpCard { position: fixed; left: var(--edge-l, 12px); bottom: var(--edge-b, 12px); width: max(calc(84 * var(--u, 1px)), 64px); aspect-ratio: 3 / 4; border-radius: 18%;   /* Golan 29.10 20:22: bigger */
    border: 3px solid #7c5cff; background: linear-gradient(#ffffff, #efeaff); box-shadow: 0 4px 0 #5a3fd1, 0 6px 14px #0003; color: #5a3fd1; cursor: pointer; padding: 0;
    font: 900 max(calc(56 * var(--u, 1px)), 42px) "Noto Sans Hebrew", system-ui, sans-serif; display: grid; place-items: center; z-index: 8; }
  #helpCard:active { box-shadow: 0 1px 0 #5a3fd1; }
  #demoStart { display: none; }   /* Golan 30.10: the "?" card in the game replaces the button in the start window (as the other sound games) */
  /* the demo hand and the "איך משחקים?" buttons, as in the sound wheel */
  .demo-hand { position: fixed; z-index: 47; width: max(calc(90 * var(--u, 1px)), 64px); pointer-events: none; display: none; transform: translate(-30%, -8%); filter: drop-shadow(0 4px 8px #0004); }
  .demo-hand.show { display: block; }
  .demo-hand svg { display: block; width: 100%; height: auto; }
  .demo-btn { margin-top: 12px; }
  /* ===== שְׁלוֹשָׁה בְּשׁוּרָה (Golan 8.11): a 3x3 board, the child's sound against the computer's sound ===== */
  html, body { background: linear-gradient(#bfe6ff, #e6f6ff); }
  :root { --kid: #f76707; --kid-bg: #fff1e3; --kid-rim: #ffc38f; --pc: #7048e8; --pc-bg: #f1ecff; --pc-rim: #c6b6ff; }
  #board { position: fixed; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    width: var(--bs, 300px); height: var(--bs, 300px); gap: calc(var(--bs, 300px) * .035); padding: calc(var(--bs, 300px) * .045);
    background: #dcecfb; border-radius: calc(var(--bs, 300px) * .08); box-shadow: 0 8px 26px #0002, inset 0 0 0 3px #ffffffaa; z-index: 2; }
  #board[hidden], .chip[hidden] { display: none; }
  /* Golan 11.11: the child's sound can also be dragged from its card onto the board */
  #chipK.turn { cursor: grab; touch-action: none; }
  .ttt-ghost { position: fixed; z-index: 30; pointer-events: none; display: grid; place-items: center; border-radius: 18%; background: var(--kid-bg); color: var(--kid); font-weight: 800; box-shadow: 0 8px 22px #0003; transform: translate(-50%, -50%) scale(1.05); }
  .ttt-fly { position: fixed; z-index: 30; pointer-events: none; display: grid; place-items: center; border-radius: 18%; background: var(--pc-bg); color: var(--pc); font-weight: 800; box-shadow: 0 8px 22px #0003; transform: translate(-50%, -50%); }
  .cell.drop { background: #fff1de; box-shadow: 0 0 0 4px var(--kid-rim) inset; }
  .cell { position: relative; border: 0; padding: 0; border-radius: 18%; background: #fff; cursor: pointer; box-shadow: 0 calc(var(--bs, 300px) * .012) 0 #b9cde3;
    display: grid; place-items: center; font: 800 calc(var(--bs, 300px) * .17)/1 "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .cell.k { background: var(--kid-bg); color: var(--kid); box-shadow: 0 calc(var(--bs, 300px) * .012) 0 var(--kid-rim); cursor: default; }
  .cell.c { background: var(--pc-bg); color: var(--pc); box-shadow: 0 calc(var(--bs, 300px) * .012) 0 var(--pc-rim); cursor: default; }
  .cell .syl { display: block; transform: translateY(-6%); animation: tttPop .45s cubic-bezier(.3, 1.6, .5, 1) both; pointer-events: none; }
  @keyframes tttPop { 0% { transform: translateY(-6%) scale(.2); opacity: 0; } 100% { transform: translateY(-6%) scale(1); opacity: 1; } }
  @media (hover: hover) and (pointer: fine) { #board.open .cell:not(.k):not(.c):hover { background: #fff8ef; box-shadow: 0 calc(var(--bs, 300px) * .012) 0 var(--kid-rim); } }
  #board.open .cell:not(.k):not(.c):active { transform: scale(.96); }
  /* three in a row: the line glows, the other squares fade a little */
  .cell.win { animation: tttWin 1.1s ease-in-out infinite; z-index: 1; }
  @keyframes tttWin { 50% { box-shadow: 0 0 0 calc(var(--bs, 300px) * .014) #FFC400, 0 0 calc(var(--bs, 300px) * .09) #FFD54F; filter: brightness(1.06); } }
  #board.over .cell:not(.win) { opacity: .5; transition: opacity .5s; }
  #winLine { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
  #winLine line { stroke: #FFC400; stroke-linecap: round; filter: drop-shadow(0 0 6px #FFE082); stroke-dasharray: 1; stroke-dashoffset: 1; animation: tttLine .6s ease-out forwards; }
  @keyframes tttLine { to { stroke-dashoffset: 0; } }
  .tstar { position: absolute; left: 50%; top: 50%; translate: -50% -50%; line-height: 0; z-index: 4; pointer-events: none; animation: tttPop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  /* the two players beside the board: the child (its companion) and the computer, each with its sound in its own colour */
  .chip { position: fixed; z-index: 2; width: var(--cw, 100px); padding: calc(var(--cw, 100px) * .08) 0 calc(var(--cw, 100px) * .06); box-sizing: border-box;
    border-radius: calc(var(--cw, 100px) * .2); background: #fff; display: flex; flex-direction: column; align-items: center; gap: calc(var(--cw, 100px) * .02);
    box-shadow: 0 5px 16px #0002; border: calc(var(--cw, 100px) * .035) solid var(--rim); transition: transform .3s; }
  .chip.k { --rim: var(--kid-rim); --col: var(--kid); }
  .chip.c { --rim: var(--pc-rim); --col: var(--pc); }
  .chip .av { width: 62%; aspect-ratio: 1; display: grid; place-items: center; }
  .chip .av svg { width: 100%; height: 100%; display: block; }
  .chip .syl { font: 800 calc(var(--cw, 100px) * .42)/1.25 "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif; color: var(--col); min-height: 1.25em; }
  .chip .syl.in { animation: tttPop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  .chip.turn { border-color: var(--col); animation: tttTurn 1.5s ease-in-out infinite; }
  @keyframes tttTurn { 50% { transform: scale(1.06); box-shadow: 0 0 0 calc(var(--cw, 100px) * .05) color-mix(in srgb, var(--col) 30%, transparent), 0 5px 16px #0002; } }
  /* the sound picker before every match: 3 big buttons, each a syllable (Golan 8.11) */
  #sndPick .panel { width: auto; max-width: none; }
  .snds { display: flex; gap: max(calc(26 * var(--u, 1px)), 14px); justify-content: center; margin-top: max(calc(12 * var(--u, 1px)), 6px); }
  .snds button { --z: min(26vw, calc(100dvh - 190px), max(calc(190 * var(--u, 1px)), 110px)); width: var(--z); height: var(--z); border-radius: 24%; cursor: pointer;
    border: calc(var(--z) * .035) solid var(--kid-rim); background: var(--kid-bg); color: var(--kid); box-shadow: 0 calc(var(--z) * .04) 0 var(--kid-rim);
    font: 800 calc(var(--z) * .5)/1 "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif; display: grid; place-items: center; padding: 0; }
  .snds button span { transform: translateY(-6%); pointer-events: none; }
  .snds button:active { transform: scale(.96); }
  .snds button.flash { animation: carFlash 1s ease-in-out; }
  .snds button.chosen { transform: scale(1.16); border-color: var(--kid); box-shadow: 0 8px 24px #0003; transition: transform 1.2s ease-out; position: relative; z-index: 2; }
  .snds button.off { opacity: .35; transition: opacity .6s; }
  @media (hover: hover) and (pointer: fine) { .snds button:hover:not(.off) { border-color: var(--kid); } }
  /* the level slider (FL.learner.cardSlider, as the memory games): our own small board icon in place of the card deck */
  .fl-cs.ttt-lv .fl-cs-ico { display: none; }
  .fl-cs.ttt-lv .ttt-ico { width: 84%; height: auto; margin-bottom: 2px; filter: drop-shadow(0 1px 2px #0004); }
  .fl-cs.ttt-lv .fl-cs-tr { height: min(var(--fl-csh, 170px), 24vh); }   /* 3 steps only: a shorter track, so it fits a low phone */
</style>

<script>
(() => {
  "use strict";
  // שְׁלוֹשָׁה בְּשׁוּרָה (Golan 8.11): tic-tac-toe against the computer on the sound island. Before every match the
  // child picks one of 3 sounds not picked yet; the computer gets another sound that is not alike. The two syllables are the
  // X and the O of the match. Play only: no learner answers are recorded. The shell is the sound memory game's.
  const $ = (id) => document.getElementById(id);
  const GAME = "soundttt";

  // ---------- settings (kept per device, wrapped because storage can be blocked) ----------
  const settings = { voice: "on", letters: [], balloon: null };
  try { Object.assign(settings, JSON.parse(localStorage.getItem("fl-soundttt-settings") || "{}")); } catch (e) {}
  settings.lettersMode = "auto";
  const saveSettings = () => { try { localStorage.setItem("fl-soundttt-settings", JSON.stringify(settings)); } catch (e) {} };

  const LRN = (window.FL && window.FL.learner) || null;
  const kid = () => (LRN ? LRN.profile() : null);
  const gt = (pl, m, f) => { const g = kid() && kid().gender; return g === "m" ? m : g === "f" ? f : pl; };
  function genderTexts() {
    $("startText").textContent = gt("בּוֹחֲרִים צְלִיל וּמְנַסִּים לָשִׂים שְׁלוֹשָׁה בְּשׁוּרָה", "בְּחַר צְלִיל וְנַסֵּה לָשִׂים שְׁלוֹשָׁה בְּשׁוּרָה", "בַּחֲרִי צְלִיל וְנַסִּי לָשִׂים שְׁלוֹשָׁה בְּשׁוּרָה");
    $("pickTitle").textContent = gt("בּוֹחֲרִים כַּדּוּר פּוֹרֵחַ", "בְּחַר כַּדּוּר פּוֹרֵחַ", "בַּחֲרִי כַּדּוּר פּוֹרֵחַ");
    $("sndTitle").textContent = gt("בּוֹחֲרִים צְלִיל", "בְּחַר צְלִיל", "בַּחֲרִי צְלִיל");
  }

  // ---------- the sounds: FL.learner.SOUND_SYL (14), with the sound wheel's syllable clips ----------
  const SOUNDS = { "ב": { syl: "בַּ", s: "syl_ba" }, "ג": { syl: "גָּ", s: "syl_ga" }, "נ": { syl: "נָ", s: "syl_na" },
    "ט": { syl: "טַ", s: "syl_ta_tet" }, "י": { syl: "יַ", s: "syl_ya" }, "כ": { syl: "כַּ", s: "syl_ka" },
    "א": { syl: "אַ", s: "syl_a" }, "ח": { syl: "חָ", s: "syl_cha" },
    "צ": { syl: "צָ", s: "syl_tsa" }, "ר": { syl: "רָ", s: "syl_ra" }, "ת": { syl: "תָּ", s: "syl_ta" },
    "מ": { syl: "מַ", s: "syl_ma" }, "ע": { syl: "עַ", s: "syl_a_ayin" }, "פ": { syl: "פַּ", s: "syl_pa" } };
  const SYL = (LRN && LRN.SOUND_SYL) || {};
  for (const l in SYL) if (SOUNDS[l]) SOUNDS[l].syl = SYL[l];
  const SOUND_L = (Object.keys(SYL).length ? Object.keys(SYL) : Object.keys(SOUNDS)).filter((l) => SOUNDS[l]);
  // sounds that sound alike never meet in one match (the sound games' ALIKE rule)
  const ALIKE = [["ט", "ת"], ["כ", "ק"], ["א", "ע", "ה"], ["ח", "כ"], ["ס", "ש"], ["ב", "ו"]];
  const alike = (a, b) => ALIKE.some((g) => g.includes(a) && g.includes(b));
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rnd = (a) => a[Math.floor(Math.random() * a.length)];
  if (LRN && LRN.setGame) LRN.setGame(GAME, { autoCount: () => SOUND_L.length });

  // ---------- the child's own game level (Golan 8.11): 1..3 per child, NOT the island level ----------
  // up after 3 wins in the last 4 matches, down after 3 losses in a row; a hand pick on the slider lasts until the game is reopened

  function endDemoMarks() { if (window.FL && FL.demoFrame) FL.demoFrame(false); if (window.FL && FL.demoArrow) FL.demoArrow(null); hideHand(); state.demo = false; demoAfter = null; }
  function runDemo(done) {
    epoch++; stopVoice(); state.demo = true; state.mode = "demo";
    // the match's own sounds, or בַּ and מַ before the first match
    demoBack = { kidL: state.kidL, pcL: state.pcL };
    if (!state.kidL) { state.kidL = "ב"; state.pcL = "מ"; }
    if (window.FL && FL.demoFrame) FL.demoFrame(true, () => { epoch++; stopVoice(); hideHand(); if (window.FL && FL.demoArrow) FL.demoArrow(null); if (demoAfter) { const f = demoAfter; demoAfter = null; f(); } });
    demoAfter = () => { hideHand(); const fin = () => { endDemoMarks(); if (demoBack && demoBack.kidL) { state.kidL = demoBack.kidL; state.pcL = demoBack.pcL; } if (done) done(); }; if (window.FL && FL.demoOut) FL.demoOut(fin); else fin(); };
    clearBoard(); setChips(); showPlayers(true); setTurn("k");
    const my = epoch, alive = () => my === epoch && state.demo;
    const at = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, top: r.top }; };
    // Golan 8.11: the demo says the goal first (ttt_start: "choose a sound and try to put three in a row"), then plays a whole
    // match to the child's win: child, computer, child, computer, child = three in a row (a few scripts, a different one each press)
    const SCRIPTS = [{ k: [0, 1, 2], c: [4, 6] }, { k: [6, 7, 8], c: [4, 0] }, { k: [0, 3, 6], c: [4, 2] }, { k: [2, 5, 8], c: [4, 6] }];
    const S = SCRIPTS[(demoN++) % SCRIPTS.length];
    const finishDemo = () => { if (window.FL && FL.demoArrow) FL.demoArrow(null); playIds(["demo_back"], () => later(500, () => { if (alive() && demoAfter) { const f = demoAfter; demoAfter = null; f(); } })); };
    const kidMove = (n) => {
      if (!alive()) return; const i = S.k[n], a = at(cells[i]); setTurn("k");
      moveHand({ x: a.x + 60, y: innerHeight + 40 }, a, 900, () => later(250, () => {
        if (!alive()) return;
        tapCell(i, true); if (window.FL && FL.demoArrow) FL.demoArrow(a.x, a.top + 6);
        later(500, () => { if (!alive()) return; hideHand(); if (window.FL && FL.demoArrow) FL.demoArrow(null);
          if (n === 2) return whenQuiet(() => later(300, () => { if (!alive()) return; setTurn(null); drawWin(S.k); sfx.win();
            playIds([orElse("ttt_win", "fb_correct")], () => later(1400, () => { if (alive()) finishDemo(); })); }));
          setTurn("c");
          whenQuiet(() => later(650, () => { if (!alive()) return; put(S.c[n], "c"); whenQuiet(() => later(500, () => kidMove(n + 1))); }));
        });
      }));
    };
    later(400, () => { if (!alive()) return; playIds(["ttt_start"], () => later(300, () => kidMove(0))); });
  }
  let demoN = 0;
  const canDemo = () => !state.demo && ["intro2", "kid", "pc", "over"].includes(state.mode);
  $("demoStart").addEventListener("click", (e) => { e.stopPropagation(); $("go").click(); });
  $("helpCard").addEventListener("click", (e) => {
    e.stopPropagation(); if (!canDemo()) return;
    unlockAudio(); runDemo(() => startMatch());
  });
  $("demoSettings").addEventListener("click", (e) => {
    e.stopPropagation(); if (!canDemo()) return;
    closeSettings(); unlockAudio(); runDemo(() => startMatch());
  });

  // ---------- 3, 2, 1 ----------
  let countToken = 0;
  function countdown() {
    const my = ++countToken;
    document.documentElement.classList.add("fl-counting");
    state.mode = "ready"; showPlayers(false);
    const box = $("count");
    ["3", "2", "1"].forEach((n, i) => setTimeout(() => {
      if (my !== countToken || state.mode !== "ready" || paused) return;
      box.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = n; sp.style.background = "#10b947"; box.append(sp);
      tone([i === 2 ? 660 : 520], 0.16, "sine", 0.35);
    }, 700 + i * 1000));
    setTimeout(() => {
      if (my !== countToken || state.mode !== "ready" || paused) return;
      box.innerHTML = ""; tone([880, 1175], 0.14, "triangle", 0.4);
      startRound();
    }, 700 + 3 * 1000);
  }

  // keyboard (for testing on a computer): 1-9 taps a square, the top row first
  document.addEventListener("keydown", (e) => { const k = parseInt(e.key, 10); if (k >= 1 && k <= 9) tapCell(k - 1); });
  if (window.FL && FL.screen) FL.screen.onChange(() => relayout());
  addEventListener("resize", relayout);

  // test hook for automated checks
  window.__ttt = { state, prog, tapCell, pickSound, aiPick, lineMove, winner, endRound, runDemo, layout, level: () => curLevel(),
    setLevel: (n) => { prog.level = n; saveProg(); }, setManual: (n) => { manualLevel = n; }, get paused() { return paused; }, get hg() { return HG ? { left: HG.left(), done: HG.done() } : null; } };
})();
</script>
<script src="../shared/tooltip.js"></script>   <!-- one tooltip for every screen (Golan 8.11) -->
</body>
