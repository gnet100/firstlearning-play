<style>
<style>
    /* no size jump on refresh: the start panel waits for FL.screen (screen.js adds .fl-ready), at most 3 s (Golan 23.10) */
    html:not(.fl-ready) #start > * { visibility: hidden; animation: flShow 0s 3s forwards; }
    @keyframes flShow { to { visibility: visible; } }
/* Screens standard (/mnt/project-files/screens/screens-standard.md, 16.10): every size is a number of --u (one pixel of a
   1280x720 board, 720x1280 when the screen stands), with a floor in mm for fingers (--tap-s 10 mm, --tap 15 mm,
   --tap-play 20 mm, --gap 5 mm), and every distance from an edge is --edge-* (safe area or 12 --u). The variables come from
   games/shared/screen.js. No breakpoints by width: only standing (portrait) or lying (landscape).
   Look: same as "מרוץ השערים", one daylight look in light and dark. */
  :root {
    --sky: #bfe6ff; --ink: #1d2a3a; --card: #ffffffee; --accent: #ff8a3d; --accent-ink: #ffffff; --good: #2bb673; --muted: #5b6b7f;
    color-scheme: light;
    /* fallbacks until screen.js has measured (and on a page without it) */
    --u: 1px; --tap-s: 59px; --tap: 88px; --tap-play: 118px; --gap: 29px;
    --edge-t: max(12px, env(safe-area-inset-top)); --edge-r: max(12px, env(safe-area-inset-right));
    --edge-b: max(12px, env(safe-area-inset-bottom)); --edge-l: max(12px, env(safe-area-inset-left));
    /* the game's own sizes */
    --btn-s: max(calc(64 * var(--u)), var(--tap-s));     /* door, settings */
    --btn: max(calc(96 * var(--u)), var(--tap));          /* the child's speaker */
    --col-gap: max(calc(14 * var(--u)), var(--gap));      /* space between two buttons in the door column */
    --pill-h: var(--btn-s);                               /* the star pill is as tall as the door */
    --t-body: max(calc(26 * var(--u)), 17px);             /* parent text */
    --t-h1: max(calc(44 * var(--u)), 26px);
    --t-btn: max(calc(38 * var(--u)), 24px);
    --panel-w: min(100%, max(calc(640 * var(--u)), 320px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--sky);
    font-family: "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  /* ---------- buttons ---------- */
  .round-btn {
    width: var(--btn-s); height: var(--btn-s); border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: calc(var(--btn-s) * .46); display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 #c45f1d; padding: 0;
  }
  .round-btn:active { box-shadow: 0 1px 0 #c45f1d; }
  .round-btn[hidden] { display: none; }
  /* the door column at the top left, on every screen: door, then settings under it (Golan 14.10-16.10) */
  .door-btn, .gear { position: absolute; left: var(--edge-l); background: var(--card); color: var(--ink); box-shadow: 0 4px 16px #0002; }
  .door-btn { top: var(--edge-t); z-index: 30; font-size: calc(var(--btn-s) * .62); }
  .gear, .under-door { top: calc(var(--edge-t) + var(--btn-s) + var(--col-gap)); }
  .gear .gear-ico { width: 1.45em; height: 1.45em; color: #5b6470; }
  .door-ico { width: 1em; height: 1em; display: block; }
  /* "יציאה" tip on mouse hover (Golan 15.10) */
  .door-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #2b2f3a; color: #fff; font: 700 18px "Noto Sans Hebrew", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease .25s; }
  @media (hover: hover) { .door-btn:hover::after { opacity: 1; } }
  #pause, .pause-btn { display: none !important; }   /* no pause in this game (Golan 16.10) */

  /* ---------- the game screen ---------- */
  /* Golan 7.11: after a right answer the card's picture comes alive (pictures-animated, as in the sound train) */
  /* Golan 7.11 07:55: inside the card itself (no second card): it covers exactly the card's lit cream, the drawing at the same size */
  #wake { position: fixed; left: 0; top: 0; width: 0; height: 0; z-index: 4; pointer-events: none; display: none; overflow: hidden; border-radius: 11.7%; background: #fff6c9; }
  #wake.on { display: block; animation: wakeIn .25s ease-out both; }
  #wake svg { width: 86.5%; height: 86.5%; margin: 6.75%; display: block; overflow: visible; }
  @keyframes wakeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
  /* the balloon picker (tell-me's, Golan 7.11) */
  .cars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .cars button { border: 3px solid #d5dde6; border-radius: 18px; background: #eaf6ff; padding: 6px; cursor: pointer; aspect-ratio: 1; display: grid; place-items: center; }
  .cars button svg { width: 94%; height: 94%; display: block; }
  .cars button[aria-pressed="true"] { border-color: var(--good); background: #eafaf1; }   /* green when chosen (Golan 15.10) */
  .cars button:active { transform: scale(.96); }
  .cars button.flash { animation: carFlash 1s ease-in-out; }   /* slower, as in the waking-letter game (Golan 16.10) */
  .pick-count { display: flex; gap: 8px; justify-content: center; margin: 2px 0 4px; }
  .pick-count span { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #d5dde6; background: #fff; transition: background .3s, border-color .3s; }
  .pick-count span.on { border-color: var(--good); background: var(--good); }
  #cars button.chosen { position: relative; z-index: 2; transform: scale(1.12); border-color: var(--good); background: #eafaf1;
    transition: transform 1.8s ease-out, box-shadow 1.8s ease-out; box-shadow: 0 8px 24px #0003; }
  /* exit door, ajar, opening toward the left edge; "יציאה" tip on mouse hover (as in the car game, Golan 15.10) */
  .door-ico { width: 1em; height: 1em; display: block; }
  .door-btn { z-index: 30; }
  .door-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #2b2f3a; color: #fff; font: 700 18px "Noto Sans Hebrew", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease .25s; }
  @media (hover: hover) { .door-btn:hover::after { opacity: 1; } }
  /* green continue button with space before the arrow (as in the car game, Golan 15.10) */
  #resume { background: var(--good); color: #fff; box-shadow: 0 5px 0 #1d8a55; display: inline-flex; align-items: center; gap: 22px; }
  #resume:active { box-shadow: 0 2px 0 #1d8a55; }
  @keyframes carFlash { 50% { transform: scale(1.18); border-color: #ffb27a; } }
  .panel.pause-panel { background: none; box-shadow: none; width: auto; }

  /* The adult's two buttons stand where the car game has its arrows. They wake up only after the letter has
     arrived and the question was asked, so a quick child tap does not count (shared-from-race.md, 11.1). */
  .judge {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0;

  }
  .judge .who { align-self: center; font-size: 16px; font-weight: 700; color: var(--ink); background: #ffffffb3;

  .jbtn {
    pointer-events: auto; min-width: 150px; height: 84px; border-radius: 999px; border: 0; padding: 0 22px;

  .jbtn.flash { animation: jFlash 1.4s ease-in-out; }   /* nobody tapped yet: the buttons lift a little, slowly */
  @keyframes jFlash { 50% { transform: translateY(-14px); } }
  .jbtn svg { width: 1.1em; height: 1.1em; }

  .perf {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 4px); left: 92px;
    direction: ltr; text-align: left; font: 600 12px/1.35 ui-monospace, Menlo, Consolas, monospace;

  .perf b { font-size: 18px; }
  .perf .bad { color: #ff8080; } .perf .ok { color: #ffd166; } .perf .good { color: #7dffb0; }

  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #bfe6ffcc; z-index: 20; padding: 16px; }
  #settings { z-index: 10000; }   /* opens above the shared "מי משחק?" popup too (fl:gear) */
  .overlay[hidden] { display: none; }
  .panel {
    background: #fff; border-radius: 28px; padding: 28px 24px; max-width: 520px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px #0003;
  }
  .panel h1 { margin: 0 0 8px; font-size: 34px; }
  .panel p { margin: 6px 0 18px; font-size: 19px; color: var(--muted); }
  .swap-ask { background: #fff3ea; border-radius: 20px; padding: 10px 12px 14px; margin: 0 0 16px; }
  .swap-ask p { color: var(--ink); font-weight: 800; font-size: 24px; margin: 4px 0 10px; }
  .big-btn.small { font-size: 22px; padding: 10px 26px; min-height: 56px; }
  .big-btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #d5dde6; border: 2px solid #d5dde6; }
  .big-btn {
    border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer;

    box-shadow: 0 5px 0 #c45f1d;
  }
  .big-btn:active { box-shadow: 0 2px 0 #c45f1d; }
  .big-btn:disabled { opacity: .6; }
  .start-row { display: flex; gap: 14px; justify-content: center; align-items: center; }
  #start .start-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; margin: 0 -12px; }
  #start #go { grid-column: 2; white-space: nowrap; } #start #hear { grid-column: 3; justify-self: end; }
  #start #hear { width: 64px; min-width: 64px; height: 64px; min-height: 0; font-size: 30px; }
  .go-btn { background: #34b36b; box-shadow: 0 5px 0 #1f8048; }
  .go-btn:active { box-shadow: 0 2px 0 #1f8048; }
  .go-btn.pressed { animation: goPress .9s ease-in-out; box-shadow: 0 0 0 6px #34b36b33, 0 3px 0 #1f8048; }

  /* mother and child playing together, top-left of the start card (Golan 15.10; placeholder art) */
  .start-panel { position: relative; }
  .mom-kid { position: absolute; top: 8px; left: 12px; width: 150px; height: auto; pointer-events: none; }
  .together { display: inline-block; background: #eafaf1; color: #1f8048; font-weight: 800; font-size: 17px; border-radius: 999px; padding: 4px 14px; margin-bottom: 4px; }
  @media (hover: hover) and (pointer: fine) {
    .big-btn, .round-btn, .jbtn, .cars button, .seg button, .letters button:not(.fl-cell):not(.fl-pbtn) { transition: transform .15s ease, filter .15s ease, opacity .25s ease; }
    .big-btn:hover, .round-btn:hover, .jbtn:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.06); }
    .cars button:hover, .seg button:hover, .letters button:not(.fl-cell):not(.fl-pbtn):hover { transform: translateY(-2px); border-color: #ffb27a; }

  .spk { padding: 0; width: 84px; min-width: 84px; height: 84px; font-size: 42px; }

  .settings { text-align: right; }
  .settings h2 { margin: 0 0 12px; font-size: 26px; text-align: center; }
  .how { background: #f3f8fd; border-radius: 16px; padding: 10px 14px; font-size: 16px; line-height: 1.55; color: var(--ink); margin-bottom: 6px; }
  .how b { font-weight: 800; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
  .row > span small { display: block; font-size: 14px; color: var(--muted); font-weight: 400; }
  /* Golan 16.10 (all games): title beside or above the buttons, the long explanation on its own full line below them */
  .row { flex-wrap: wrap; }
  /* Golan 16.10: every row is 3 lines: title, then the options, then the explanation */
  .row { flex-direction: column; align-items: flex-start; gap: 8px; }
  .row > span { font-weight: 700; }
  .row > small.row-note { flex-basis: 100%; order: 99; font-size: 14px; color: var(--muted); font-weight: 400; margin-top: -4px; }
  .seg { display: flex; gap: 6px; flex-shrink: 0; }

  #childCard { flex: 1 1 100%; width: 100%; min-width: 0; align-self: stretch; }   /* the parent table fills the row like the picker (no overflow on a phone) */
  .settings { max-height: 100%; overflow-y: auto; }
  .seg button {
    min-width: 76px; min-height: 52px; border-radius: 14px; border: 2px solid #d5dde6; background: #fff;
    font: 700 17px "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters-row { align-items: flex-start; }
  .letters-row > span { display: flex; flex-direction: column; gap: 4px; }
  .letters-row small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .letters { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .letters button:not(.fl-cell):not(.fl-pbtn), .rep-grid span { width: 52px; height: 52px; border-radius: 12px; border: 2px solid #d5dde6; background: #fff; cursor: pointer;
    font: 800 26px "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); }
  .letters button:not(.fl-cell):not(.fl-pbtn)[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters button:not(.fl-cell):not(.fl-pbtn).final, .rep-grid span.final { border-style: dashed; }
  .letters button:not(.fl-cell):not(.fl-pbtn).final, .rep-grid span.final { text-decoration: underline; text-decoration-color: #8fb3d9; text-decoration-thickness: 3px; text-underline-offset: 1px; text-decoration-skip-ink: none; }
  .letters-tools { display: flex; flex-wrap: wrap; gap: 8px; }
  /* Golan 16.10: the practice picker is the child card's own table (FL.learner.letterPicker) plus selection */
  .letters { display: block; }
  .letters-tools button, .link-btn { min-height: 40px; padding: 0 14px; border-radius: 12px; border: 2px solid #d5dde6; background: #fff; cursor: pointer;
    font: 700 15px "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); }
  .diag { direction: ltr; text-align: left; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }

  /* parent summary */
  .report { text-align: right; }
  .report h2 { margin: 0 0 6px; font-size: 26px; text-align: center; }
  .report .score { font-size: 22px; font-weight: 800; text-align: center; margin: 6px 0 2px; }
  .report .sub { font-size: 16px; color: var(--muted); text-align: center; margin: 0 0 12px; }
  .rep-grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
  .rep-grid span { display: grid; place-items: center; cursor: default; }

  .rep-grid span.later { background: #fff4dc; border-color: var(--later); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 16px; color: var(--muted); margin: 4px 0 10px; }

  /* 3-2-1 before take-off, as on the car game's start line */
  .count { position: absolute; left: 50%; top: 42%; width: 0; height: 0; pointer-events: none; }
  .count span { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
    display: grid; place-items: center; font-size: 110px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0003;
    box-shadow: 0 0 0 4px #3dff7f88, 0 0 24px #3dff7f, 0 0 54px #00e05a, 0 8px 30px #0003; animation: countPop .95s ease-out forwards; }   /* glowing green (Golan, 15.10) */
  @keyframes countPop { 0% { transform: scale(.4); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

  .toast {
    position: absolute; top: 20%; left: 80%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    font-size: 64px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0004, 0 0 24px #0003;
    transition: transform .25s ease, opacity .25s ease; pointer-events: none; white-space: nowrap;
  }

  .toast .chk { display: inline-block; font-size: 80px; line-height: 1; vertical-align: -0.12em; filter: drop-shadow(0 0 8px #3dff7f) drop-shadow(0 3px 0 #0a7a35); }
  .toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  /* a correct answer: only the earned star, centred on the card's top-left corner and moving with it (Golan 18.10, as in the car game) */
  .toast.pinned { transform: translate(-50%, -50%) scale(.6); transform-origin: 50% 50%; will-change: transform, left, top; backface-visibility: hidden; line-height: 0; }
  .toast.pinned.show { transform: translate(-50%, -50%) scale(1); }
  .toast.pinned .chk { display: block; vertical-align: 0; filter: drop-shadow(0 3px 4px #0005); }
  .toast.good.pinned { font-size: 40px; }
  .toast.pinned .chk { font-size: 60px; }

  /* ===== screens standard (screens/screens-standard.md, 16.10): every size and place from FL.screen variables =====
     --u = one pixel of a 1280x720 board (720x1280 standing); floors in mm: --tap-s 10, --tap 15, --tap-play 20, --gap 5.
     No width breakpoints: only standing or lying (html[data-screen~="portrait"]). */
  html[data-screen] {
    --s: max(calc(72 * var(--u)), var(--tap-s));      /* door, settings */
    --b: max(calc(84 * var(--u)), var(--tap));        /* the child's main buttons: 🔊 */
    --g: max(calc(14 * var(--u)), var(--gap));        /* space between buttons */
    --col: calc(var(--edge-l) + var(--s) + var(--g)); /* the door/settings column */
  }
  html[data-screen] .round-btn, html[data-screen] .round-btn.gear:not(.pause-btn) { width: var(--s); height: var(--s); font-size: calc(var(--s) * .45); }
  html[data-screen] .gear-ico { width: calc(var(--s) * .58); height: calc(var(--s) * .58); }
  html[data-screen] .door-btn { font-size: calc(var(--s) * .56); }
  html[data-screen] .door-btn, html[data-screen] .start-gear { top: var(--edge-t); left: var(--edge-l); }
  html[data-screen] .hud .gear, html[data-screen] .overlay-gear { top: calc(var(--edge-t) + var(--s) + var(--g)); left: var(--edge-l); }
  /* top letter pill = detective's in every game (Golan 16.10, games/letter-recognition/detective/letter-pill-spec.md, FIXED SIZE):
     a white pill with the letter and the orange 🔊 (emoji 0.7x), one size from the first frame to the end; the dots sit at a
     fixed gap under it (pure CSS, nothing measured). The big letter card stays as it is. */
  html[data-screen] {
    --spk: max(calc(46 * var(--u)), var(--tap-s));
    --pill-t: max(calc(56 * var(--u)), 40px); --pill-lw: max(calc(64 * var(--u)), 48px);
    --pill-h: calc(max(var(--pill-t), var(--spk)) + 16 * var(--u)); --pill-w: calc(var(--pill-lw) + var(--spk) + 46 * var(--u));
    --pill-top: var(--edge-t); --dots-gap: max(calc(8 * var(--u)), 6px); }
  html[data-screen~="portrait"] { --pill-top: calc(var(--edge-t) + var(--s) + 10 * var(--u)); }   /* standing phone: under the door */
  html[data-screen] .hud .prompt { box-sizing: border-box; top: var(--pill-top); left: 50%; right: auto; transform: translateX(-50%);
    height: var(--pill-h); width: var(--pill-w); gap: 0; padding: 0 calc(12 * var(--u)) 0 calc(20 * var(--u)); justify-content: space-between; }
  html[data-screen] .prompt .target { display: block; width: var(--pill-lw); height: var(--pill-t); font-size: var(--pill-t);
    font-weight: 800; line-height: 1; text-align: center; color: var(--ink); overflow: visible; }
  html[data-screen] .prompt #replay { width: var(--spk); height: var(--spk); font-size: calc(var(--spk) * 0.7); padding: 0; line-height: 1; overflow: hidden; }
  /* hear only (Golan 18.10): a letter already מוכרת/known shows the 🔊 alone, centred in the same pill (as detective's listen) */
  .prompt.listen .target { display: none; }
  html[data-screen] .hud .prompt.listen { justify-content: center; padding: 0; }
  html[data-screen] .dots-wrap { top: calc(var(--pill-top) + var(--pill-h) + var(--dots-gap)); }

<script>
(() => {
  "use strict";
  // מְשַׂחֲקִים בְּיַחַד of the sound island (Golan 6.11.2026): a game for a child and an adult together, like "משחקים ביחד" of the
  // letters island. A sound with its letter and nikud (בַּ) stands in the middle of the sky; 4 hot-air balloons rise from below,
  // each carrying a picture card, stop in the four corners around it and hover. Only one picture starts with that sound.
  // The child says the right picture's name aloud and the adult taps "נכון" or "נסו שוב"; a touch on the right balloon counts too.
  // Right: Hila says the sound while the other 3 balloons fly up and away. A wrong picture touched: Hila says its name.
  // "נסו שוב": the balloons stay and the sound is said again. 3 mistakes: the right picture is shown (auto-solve, no star).
  // The shell (start window, 3-2-1, hourglass, settings, end window, endFly, demo, "?" card) is the river game's; the sounds,
  // pictures and ALIKE rule are the sound detective's; the balloons are the sound detective's balloon (patterns, basket, ropes).
  const T0 = performance.now();
  const $ = (id) => document.getElementById(id);
  const GAME = "soundtogether";
  const LRN = window.FL && window.FL.learner ? window.FL.learner : null;

  // ---------- content: the sound detective's sounds and pictures (3 pictures per sound) ----------
  const PICS = window.PICTURES || {}, PA = window.PICTURES_ANIMATED || null;
  const SOUNDS = { "ב": { syl: "בַּ", s: "syl_ba" }, "ג": { syl: "גָּ", s: "syl_ga" }, "נ": { syl: "נָ", s: "syl_na" },
    "ט": { syl: "טַ", s: "syl_ta_tet" }, "י": { syl: "יַ", s: "syl_ya" }, "כ": { syl: "כַּ", s: "syl_ka" },
    "א": { syl: "אַ", s: "syl_a" }, "ח": { syl: "חָ", s: "syl_cha" },
    "צ": { syl: "צָ", s: "syl_tsa" }, "ר": { syl: "רָ", s: "syl_ra" }, "ת": { syl: "תָּ", s: "syl_ta" },
    "מ": { syl: "מַ", s: "syl_ma" } };   // Golan 8.11: the 12th sound
  const PICS_OF = {   // Golan 7.11: 5 pictures for every sound (2 more each, summaries/sound-words-list.md)
    "ב": ["ב", "ן", "banana", "bottle", "duck"], "ג": ["camel", "socks", "gnome", "wheel", "fence"], "נ": ["נ", "shoe", "tiger", "swing", "stream"], "ט": ["ט", "ring", "chef", "pilot", "windmill"],
    "י": ["י", "ם", "hand", "girl", "diamond"], "כ": ["כ", "teaspoon", "firefighter", "ticket", "buttons"], "א": ["א", "rabbit", "watermelon", "ambulance", "pear"], "ח": ["ח", "donkey", "window", "spaceship", "trumpet"],
    "צ": ["צ", "plate", "painter", "parachutist", "scarf"], "ר": ["ר", "rattle", "trafficLight", "drone", "dancer"], "ת": ["ת", "rooster", "crocodile", "oven", "orange"],
    "מ": ["plane", "helicopter", "truck", "slide", "mask"] };
  const picsOf = (l) => (PICS_OF[l] || [l]).filter((k) => PICS[k]);
  // sounds that sound alike never meet in one question: ט/ת, כ/ק, א/ע/ה, ח/כ, ס/שׂ, ב/ו
  const ALIKE = [["ט", "ת"], ["כ", "ק"], ["א", "ע", "ה"], ["ח", "כ"], ["ס", "ש"], ["ב", "ו"]];
  const alike = (a, b) => ALIKE.some((g) => g.includes(a) && g.includes(b));
  const SOUND_L = Object.keys(SOUNDS).filter((l) => picsOf(l).length);
  const wordOf = (k) => (PICS[k] || {}).clip;
  for (const l of SOUND_L) for (const k of picsOf(l)) if (PICS[k] && !PICS[k].sound) PICS[k].sound = l;
  if (LRN && LRN.setGame) LRN.setGame(GAME, { autoCount: () => SOUND_L.length });

  // ---------- settings (kept per device) ----------

      const btns = [...$("cars").children].filter((b) => !b.classList.contains("chosen")).sort(() => Math.random() - 0.5);
      btns.forEach((b, i) => pickFlashTs.push(setTimeout(() => { b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); }, i * 420)));
    }, 4000);
  }
  // a tap chooses a balloon (it grows and stays big); a second tap puts it back. The 4th one starts the round.
  function pickBalloon(id, btn) {
    if (picking) return;
    stopPickFlash(); unlockAudio();
    const at = chosen.indexOf(id);
    if (at >= 0) chosen.splice(at, 1); else chosen.push(id);
    btn.classList.toggle("chosen", at < 0); btn.setAttribute("aria-pressed", String(at < 0));
    renderPickCount(); sfx.tap();
    if (chosen.length < 4) { pickNag(); return; }
    picking = true; const grown = performance.now() + 1800, my = screenTok;
    settings.balloons = chosen.slice(); saveSettings();
    say(Math.random() < 0.5 ? "fb_choice1" : "fb_choice2", () => setTimeout(() => {
      picking = false; if (my !== screenTok || $("carPick").hidden) return;
      $("carPick").hidden = true; startPlay();
    }, Math.max(250, grown - performance.now())));
  }
  ["doorPick"].forEach((id) => $(id).addEventListener("click", () => { stopPickFlash(); picking = false; $("carPick").hidden = true; if (!toHub()) backToStart(); }));
  $("gearPick").addEventListener("click", (e) => { e.stopPropagation(); openSettings(); });
  function startPlay() { if (starCount) starCount.reset(); $("hud").hidden = false; countdown(); }

  // ---------- the demo (only from the "?" card, Golan 5.11) ----------
  // Two questions: in the first a hand touches the right balloon; in the second the hand taps the adult's "נכון". Each time
  // Hila says the sound, the other balloons fly up. Then "נַחֲזֹר לְשַׂחֵק" (demo_back) and everything flies up (FL.demoOut) into the game.
  const demoKey = () => "fl-stog-demo-" + (prof() ? prof().id : "guest");
  const markDemo = () => { try { localStorage.setItem(demoKey(), "1"); } catch (e) {} };
  const demoSeen = () => { try { return !!localStorage.getItem(demoKey()); } catch (e) { return true; } };
  const hand = $("demoHand"); let demoRaf = 0, demoTok = 0, demoCont = null;
  function hideHand() { cancelAnimationFrame(demoRaf); hand.classList.remove("show"); }
  function moveHand(from, to, dur, then) {
    const t0 = performance.now();
    const step = () => { const k = Math.min(1, (performance.now() - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      hand.style.left = from.x + (to.x - from.x) * e + "px"; hand.style.top = from.y + (to.y - from.y) * e + "px";
      if (k < 1) demoRaf = requestAnimationFrame(step); else if (then) then(); };
    hand.classList.add("show"); step();
  }
  function endDemoMarks() { demoTok++; demoCont = null; if (window.FL && FL.demoFrame) FL.demoFrame(false); if (window.FL && FL.demoArrow) FL.demoArrow(null); hideHand(); state.demo = false; }
  let demoN = 0;   // which of the two examples the next press shows (the child touches / the adult says)
  function runDemo(done) {
    const my = ++demoTok; hush(); state.demo = true; demoCont = null; setJudge(false);
    const fin = () => { endDemoMarks(); markDemo(); state.q = null; balloons.forEach((b) => { b.state = "off"; b.root.setEnabled(false); }); if (done) done(); [600, 1200].forEach((ms) => setTimeout(onScreen, ms)); };
    // the demo's door (Golan 5.11): stop the demo now, it all flies up, then the game
    if (window.FL && FL.demoFrame) FL.demoFrame(true, () => { demoTok++; demoCont = null; hush(); hideHand(); clearTasks(); if (window.FL && FL.demoArrow) FL.demoArrow(null);
      if (window.FL && FL.demoOut) FL.demoOut(fin); else fin(); });
    const alive = () => my === demoTok && state.demo;
    const center = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, top: r.top }; };
    const finish = () => {
      if (window.FL && FL.demoArrow) FL.demoArrow(null); hideHand();
      playSeq([LINES.back], 1, () => setTimeout(() => { if (!alive()) return; hideHand(); if (window.FL && FL.demoOut) FL.demoOut(() => { if (alive()) fin(); else endDemoMarks(); }); else fin(); }, 500));
    };
    const example = (n) => {
      if (!alive()) return;
      state.mode = "play";
      newQuestion({ demo: true, after: (q) => {
        if (!alive() || state.q !== q) return;
        playSeq([LINES.demoQ, 100, SOUNDS[q.letter].s], 1, () => setTimeout(() => {
          if (!alive() || state.q !== q) return;
          const b = rightBalloon(), r = cardRect(b), p = n === 0 ? { x: (r.x0 + r.x1) / 2, y: (r.y0 + r.y1) / 2, top: r.y0 } : center($("said"));
          const cr = canvas.getBoundingClientRect(), k = cr.width / (canvas.clientWidth || cr.width); if (n === 0) { p.x = cr.left + p.x * k; p.y = cr.top + p.y * k; p.top = cr.top + p.top * k; }
          if (window.FL && FL.demoArrow) FL.demoArrow(p.x, p.top);
          moveHand({ x: p.x - 80, y: innerHeight + 40 }, p, 1100, () => setTimeout(() => {
            if (!alive() || state.q !== q) return;
            if (n === 1) { $("said").classList.add("tap"); setTimeout(() => $("said").classList.remove("tap"), 200); }
            if (window.FL && FL.demoArrow) FL.demoArrow(null); setTimeout(hideHand, 400);
            demoCont = () => { if (!alive()) return; setTimeout(finish, 400); /* Golan 8.11: one example per press; the next press shows the other one */ };
            answerRight(n === 0 ? "touch" : "adult");
          }, 250));
        }, 300));
      } });
      [60, 400].forEach((ms) => setTimeout(onScreen, ms));
    };
    balloons.forEach((b) => { b.state = "off"; b.root.setEnabled(false); });
    playSeq([], 1, () => { if (!alive()) return; example(demoN++ % 2); });
  }
  // the "?" card at the bottom left plays the demo again; then the game goes on with a new question
  function demoAgain() {
    if (state.demo || state.mode !== "play" || $("hud").hidden) return;
    unlockAudio(); hush(); clearTasks(); setJudge(false); const was = state.q; if (was && !was.rec && was.mistakes) recordQ(was, false);
    state.q = null; balloons.forEach((b) => { if (b.root.isEnabled()) flyAway(b); });
    setTimeout(() => runDemo(() => { state.mode = "play"; newQuestion(); }), 600);
  }
  $("helpCard").addEventListener("click", (e) => { e.stopPropagation(); demoAgain(); });
  $("demoSettings").addEventListener("click", (e) => { e.stopPropagation(); const m = modeBeforeSettings; closeSettings(); if (state.mode === "play" || m === "play") setTimeout(demoAgain, 350); });

  // ---------- 3, 2, 1, then the first question ----------
  let countToken = 0;
  function countdown() {
    const my = ++countToken;
    document.documentElement.classList.add("fl-counting");
    clearTasks(); state.mode = "ready"; state.q = null; setJudge(false); setSign("");
    balloons.forEach((b) => { b.state = "off"; b.root.setEnabled(false); });
    layout();
    const box = $("count");
    [0, 1, 2].forEach((i) => setTimeout(() => {
      if (my !== countToken || state.mode !== "ready") return;
      box.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = String(3 - i); sp.style.background = "#10b947"; box.append(sp);
      tone([i === 2 ? 660 : 520], 0.16, "sine", 0.35);
    }, 700 + i * 1000));
    setTimeout(() => {
      if (my !== countToken || state.mode !== "ready") return;
      box.innerHTML = ""; tone([880, 1175], 0.14, "triangle", 0.4);
      document.documentElement.classList.remove("fl-counting");
      startRound();
    }, 700 + 3 * 1000);
  }

  // ---------- door = back to the start screen (or the hub), from every screen ----------
  function backToStart() {
    flushPartial(); leaveScreen(); $("go").classList.remove("pressed");
    if (pausedFrom !== null) resumeGame();
    endDemoMarks(); clearTasks(); setJudge(false);
    state.mode = "intro"; if (starCount) starCount.reset(); if (HG) HG.stop();
    countToken++; $("count").innerHTML = "";
    ["hud", "end", "settings", "paused", "carPick"].forEach((id) => ($(id).hidden = true)); stopPickFlash(); picking = false;
    newQuestion({ still: true, demo: true }); state.mode = "intro"; $("mid").hidden = true;
    $("start").hidden = false;
  }
  function toHub() { if (!(LRN && LRN.fromHub && LRN.hubUrl)) return false; endDemoMarks(); flushPartial(); leaveScreen(); countToken++; if (HG) HG.stop(); location.href = LRN.hubUrl + "#games"; return true; }
  ["doorGame", "doorEnd", "doorPause"].forEach((id) => $(id).addEventListener("click", () => { if (!toHub()) backToStart(); }));
  if (window.FL && FL.screen && FL.screen.restartButton) FL.screen.restartButton(() => { backToStart(); $("start").hidden = true; openPick(); });

  // test hook for automated checks (games/tests/check-games.js): open() = true while the adult may judge; points() = the screen
  // centres of the 4 picture cards with right / wrong; said() / notYet() tap the adult's buttons
  window.__stog = { state, settings, get balloons() { return balloons; }, engine, scene, cam, canvas, hg: HG, SOUNDS, SOUND_L, PICS_OF, alike, layout, endRound, runDemo, demoSeen: () => demoSeen(), region: () => region,
    open: () => canAnswer(),
    points: () => { const cr = canvas.getBoundingClientRect(), k = cr.width / (canvas.clientWidth || cr.width); cam.getViewMatrix().multiplyToRef(cam.getProjectionMatrix(), tmpM);
      return balloons.filter((b) => b.state === "hover" || b.state === "shake").map((b) => { const r = cardRect(b); return { right: b.right, x: cr.left + (r.x0 + r.x1) / 2 * k, y: cr.top + (r.y0 + r.y1) / 2 * k, pic: b.pic }; }); },
    said: () => $("said").click(), notYet: () => $("notYet").click() };
})();
</script>
