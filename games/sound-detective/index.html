<style>
/* Same look, buttons and phone layout as "מרוץ השערים" (race-gates-voice), so both games feel like one game.
   Single deliberate daylight look: same colours in light and dark, like the race game. */
  :root {
    --sky: #bfe6ff;
    --ink: #1d2a3a;
    --card: #ffffffee;
    --accent: #ff8a3d;
    --accent-ink: #ffffff;
    --good: #2bb673;
    --muted: #5b6b7f;
  }
  /* single deliberate look (daylight world): same colours in light and dark */
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--sky);
    font-family: "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  .prompt {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 20px;
    background: var(--card); border-radius: 999px; box-shadow: 0 4px 16px #0002;
  }
  .prompt .label { font-size: 22px; font-weight: 700; white-space: nowrap; }
  .prompt .target { font-size: 56px; font-weight: 800; line-height: 1; min-width: 64px; text-align: center; }
  /* the bar has the same size and layout as the race game's: the letter, then the speaker (Golan, 15.10) */
  .round-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: 30px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 #c45f1d;
  }
  .round-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c45f1d; }
  .prompt #replay { width: 46px; height: 46px; font-size: 21px; }   /* a smaller speaker (Golan, 16.10) */
  /* listening sky: only the speaker, in the middle of the bar (Golan, 16.10) */
  .prompt.listen { padding: 8px 14px; }
  .prompt.listen .target { display: none; }
  .prompt.listen #replay { width: 56px; height: 56px; font-size: 26px; }

  @keyframes starPop { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  .stars {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px;
    background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 26px; font-weight: 800;
    box-shadow: 0 4px 16px #0002;
  }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; background: #0002; }
  .dots span.done { background: var(--good); }
  .dots-wrap {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 88px); left: 50%; transform: translateX(-50%);
    pointer-events: none;
  }

  .gear {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink);
    box-shadow: 0 4px 16px #0002;
  }

  /* pause button next to the settings button (Golan, 14.10) */
  /* in the game the buttons stand in a column at the top left: door, settings, pause (Golan, 14.10) */
  .hud .gear { top: calc(max(12px, env(safe-area-inset-top)) + 76px); }
  .hud .pause-btn { left: 16px; top: calc(max(12px, env(safe-area-inset-top)) + 152px); }
  /* settings button on the start screen too */
  /* settings gear: a drawn icon, bigger and darker grey, on every screen (Golan, 15.10, all games) */
  .gear .gear-ico { width: 1.45em; height: 1.45em; color: #5b6470; }
  .under-door { top: calc(max(12px, env(safe-area-inset-top)) + 76px); }
  .start-gear { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; }
  /* door = back to the previous screen (Golan, 14.10) */
  /* exit door, ajar, opening toward the left edge; "יציאה" tip on mouse hover (Golan, 15.10) */
  .door-ico { width: 1em; height: 1em; display: block; }
  .door-btn { z-index: 30; }   /* tip above the FPS box */
  .door-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #2b2f3a; color: #fff; font: 700 18px "Noto Sans Hebrew", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease .25s; }
  @media (hover: hover) { .door-btn:hover::after { opacity: 1; } }
  .door-btn { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink); box-shadow: 0 4px 16px #0002; font-size: 40px; }
  /* car picker */
  .cars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .cars button { border: 3px solid #d5dde6; border-radius: 18px; background: #eaf6ff; padding: 4px; cursor: pointer; aspect-ratio: 1; }
  .cars button img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; display: block; }
  .cars button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .cars button:active { transform: scale(.96); }
  .cars button.flash { animation: carFlash .5s ease-in-out; }
  /* the chosen car grows while we wait (Golan, 15.10): #cars beats the mouse-hover rule, so it starts at once; slow grow */
  #cars button.chosen { position: relative; z-index: 2; transform: scale(1.3); border-color: var(--accent); background: #fff3ea;
    transition: transform 1.1s ease-out, box-shadow 1.1s ease-out; box-shadow: 0 8px 24px #0003; }   /* nag: quick grow, one car after another (Golan, 14.10) */
  @keyframes carFlash { 50% { transform: scale(1.18); border-color: #ffb27a; } }
  .panel.pause-panel { background: none; box-shadow: none; width: auto; }   /* only the continue button (Golan, 14.10) */
  .pause-panel .big-btn { font-size: 34px; padding: 18px 48px; }
  /* green continue button with space before the arrow (Golan, 15.10) */
  #resume { background: var(--good); color: #fff; box-shadow: 0 5px 0 #1d8a55; display: inline-flex; align-items: center; gap: 22px; }
  #resume:active { box-shadow: 0 2px 0 #1d8a55; }
  .pause-badge { display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%;
    border: 3px solid var(--accent); color: var(--accent); font-size: .8em; vertical-align: middle; margin-inline-end: 6px; }

  .arrows {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 18px; pointer-events: none; direction: ltr;
  }
  .arrow {
    pointer-events: auto; width: 96px; height: 96px; border-radius: 50%; border: 0;
    background: #ffffffcc; color: var(--ink); font-size: 46px; font-weight: 800; box-shadow: 0 4px 0 #0003;
    display: grid; place-items: center; cursor: pointer;
  }
  .arrow:active { transform: translateY(3px); box-shadow: 0 1px 0 #0003; }

  .perf {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 4px); left: 92px;
    direction: ltr; text-align: left; font: 600 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
    background: #000a; color: #fff; padding: 5px 9px; border-radius: 10px; pointer-events: none;
  }
  .perf b { font-size: 18px; }
  .perf .bad { color: #ff8080; } .perf .ok { color: #ffd166; } .perf .good { color: #7dffb0; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; background: #bfe6ffcc; padding: 16px;
  }
  .overlay[hidden], .row[hidden] { display: none; }
  .round-btn[hidden] { display: none; }
  .panel {
    background: #fff; border-radius: 28px; padding: 28px 24px; max-width: 520px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px #0003;
  }
  .panel h1 { margin: 0 0 8px; font-size: 34px; }
  .panel p { margin: 6px 0 18px; font-size: 19px; color: var(--muted); }
  /* after 2 perfect rounds in a row: offer new letters (Golan, 14.10) */
  .swap-ask { background: #fff3ea; border-radius: 20px; padding: calc(10px * var(--k, 1)) 12px calc(14px * var(--k, 1)); margin: 0; width: 100%; box-sizing: border-box; }
  .swap-ask p { color: var(--ink); font-weight: 800; font-size: max(calc(24px * var(--k, 1)), 16px); margin: calc(4px * var(--k, 1)) 0 calc(10px * var(--k, 1)); }
  .fl-end .swap-ask .big-btn.small { min-height: max(calc(56 * var(--uu) * var(--k, 1)), var(--tap-s, 44px)); padding-block: calc(10 * var(--uu) * var(--k, 1)); }
  /* a phone lying down has little height: the question and its two buttons share one line */
  html[data-screen="phone landscape"] .fl-end .swap-ask { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px; padding: calc(6px * var(--k, 1)) 8px; }
  html[data-screen="phone landscape"] .fl-end .swap-ask p { margin: 0; font-size: 16px; white-space: nowrap; }
  html[data-screen="phone landscape"] .fl-end .swap-ask .start-row { flex-wrap: nowrap; gap: 6px; }
  html[data-screen="phone landscape"] .fl-end .swap-ask .big-btn.small { font-size: 16px; white-space: nowrap; padding-inline: 12px; }
  .big-btn.small { font-size: 22px; padding: 10px 26px; min-height: 56px; }
  .big-btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #d5dde6; border: 2px solid #d5dde6; }
  .big-btn {
    border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
    font: 800 30px "Noto Sans Hebrew", system-ui, sans-serif; padding: 18px 44px; min-height: 76px;
    box-shadow: 0 5px 0 #c45f1d;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c45f1d; }
  .big-btn:disabled { opacity: .6; }
  .start-row { display: flex; gap: 14px; justify-content: center; align-items: center; }
  /* start screen: "יוצאים לדרך" in the middle, speaker at the end of the row, space between (Golan, 14.10) */
  #start .start-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; }
  #start #go { grid-column: 2; white-space: nowrap; } #start #hear { grid-column: 3; justify-self: end; }
  #start .start-row { margin: 0 -12px; }   /* speaker closer to the edge (Golan, 14.10) */
  #start #hear { width: 64px; min-width: 64px; height: 64px; min-height: 0; font-size: 30px; }
  .go-btn { background: #34b36b; box-shadow: 0 5px 0 #1f8048; }
  #closeSettings { background: #34b36b; box-shadow: 0 5px 0 #1f8048; } #closeSettings:active { box-shadow: 0 2px 0 #1f8048; }   /* Golan 22.10: back to the game = starts it again, green */
  .go-btn:active { box-shadow: 0 2px 0 #1f8048; }
  /* the button reacts when pressed (Golan, 14.10): a bounce and a glow */
  /* one soft, slow press (Golan, 14.10: less dramatic, not double) */
  .go-btn.pressed { animation: goPress .9s ease-in-out; box-shadow: 0 0 0 6px #34b36b33, 0 3px 0 #1f8048; }
  @keyframes goPress { 0% { transform: scale(1); } 45% { transform: scale(.95); } 100% { transform: scale(1); } }
  /* small hover hint with a mouse (computers only) */
  @media (hover: hover) and (pointer: fine) {
    .big-btn, .round-btn, .arrow, .cars button, .seg button, .letters button { transition: transform .15s ease, filter .15s ease; }
    .big-btn:hover, .round-btn:hover, .arrow:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .cars button:hover, .seg button:hover, .letters button:hover { transform: translateY(-2px); border-color: #ffb27a; }
  }
  .spk { padding: 0; width: 84px; min-width: 84px; height: 84px; font-size: 42px; }

  .settings { text-align: right; }
  .settings h2 { margin: 0 0 12px; font-size: 26px; text-align: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
  .seg { display: flex; gap: 6px; flex-shrink: 0; }
  .row.stack { flex-wrap: wrap; }
  .row.stack .seg { flex-shrink: 1; flex-wrap: wrap; }
  .settings { max-height: 100%; overflow-y: auto; }
  .seg button {
    min-width: 76px; min-height: 52px; border-radius: 14px; border: 2px solid #d5dde6; background: #fff;
    font: 700 17px "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters-row, .child-row, .level-row { align-items: flex-start; }
  /* settings rows: the title above the buttons (or beside them when it fits), the explanation on its own full line below (Golan, 16.10, all games) */
  /* every settings row is three lines: the title, then the options, then the explanation (Golan, 16.10, all games) */
  #settings .row { flex-direction: column; align-items: flex-start; flex-wrap: nowrap; gap: 8px; }
  #settings .row > .ttl, #settings .row > span:first-child { font-weight: 700; }
  #settings .row .seg { flex-wrap: wrap; }
  #settings .row > small.note { flex: 0 0 auto; line-height: 1.45; }
  #levelSeg, #daySeg { flex-wrap: nowrap; gap: 6px; }
  #levelSeg button, #daySeg button { min-width: 0; padding: 0 12px; }
  #settings .row > small.note { font-size: 14px; color: var(--muted); font-weight: 400; }
  /* the practice-letter picker sits under the child's table, in exactly 3 rows on every screen (Golan, 16.10, all games):
     22 letters + 5 finals = 27 tiles, so 9 a row */
  .letters { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 420px; direction: rtl; }
  .letters button { width: auto; min-width: 0; aspect-ratio: 1; padding: 0; border-radius: 8px; border: 2px solid #d5dde6; background: #fff; cursor: pointer;
    font: 800 clamp(16px, 3.2vw, 24px) "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); }
  .letters button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters button.final { border-style: dashed; }
  /* Final letters get a writing line, so the tail below it shows (ן is not ו, ך is not ר) */
  /* thin line, same length for every final letter (Golan, 15.10, same as the car game) */
  .letters button.final, #target.final { background-image: linear-gradient(#9dbbdc, #9dbbdc); background-repeat: no-repeat; }
  .letters button.final { background-size: 55% 1.5px; background-position: center 66%; }
  #target.final { background-size: .8em 2px; background-position: center .69em; }
  /* soft suggestion after a round: a stretch break, or a gentle goodbye for today; play can always continue */
  #childTable { margin: 6px 0 10px; }
  .diag { direction: ltr; text-align: left; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  /* 3-2-1 countdown on the start line (Golan, 14.10): each circle appears big and fades away */
  .count { position: absolute; left: 50%; top: 42%; width: 0; height: 0; pointer-events: none; }
  .count span { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
    display: grid; place-items: center; font-size: 110px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0003;
    box-shadow: 0 0 0 4px #3dff7f88, 0 0 24px #3dff7f, 0 0 54px #00e05a, 0 8px 30px #0003; animation: countPop .95s ease-out forwards; }   /* glowing green, like the car game (Golan, 15.10) */
  @keyframes countPop { 0% { transform: scale(.4); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

  /* "יש נכון" is said, not written (Golan 18.10, all games, as in the race game): the star this answer earned, gold or silver,
     centred on the top left of the letter that was found, half on it and half outside. Size and place are set in placeOk(). */
  .ok-mark { position: absolute; left: 0; top: 0; font-size: 27px; line-height: 0; pointer-events: none; opacity: 0;
    transform: translate(-50%, -50%) scale(.6); transform-origin: 50% 50%; transition: transform .25s ease, opacity .25s ease;
    filter: drop-shadow(0 3px 4px #0005); will-change: transform, left, top; }
  .ok-mark.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .ok-mark svg { display: block; }
  .prompt .target.pulse { animation: pulse .6s ease-in-out 2; }
  @keyframes pulse { 50% { transform: scale(1.35); color: var(--accent); } }
  /* ---------- additions for the detective game ---------- */
  .prompt .pips { display: none !important; }   /* removed (Golan, 15.10): the letter covered them; the tags on the basket already show what was found */
  .prompt .pips span { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--good); background: transparent; }
  .prompt .pips span.done { background: var(--good); }
  .balloons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .balloons button { border: 3px solid #d5dde6; border-radius: 18px; background: #eaf6ff; padding: 6px; cursor: pointer; aspect-ratio: 1; display: grid; place-items: center; }
  .balloons button svg { width: 94%; height: 94%; display: block; }
  .balloons button:active { transform: scale(.96); }
  .balloons button.flash { animation: carFlash 1s ease-in-out; }   /* slower flash (Golan, 16.10, all games) */
  /* the chosen balloon grows while we wait, exactly like the chosen car (Golan, 15.10) */
  #balloons button.chosen { position: relative; z-index: 2; transform: scale(1.3); border-color: var(--accent); background: #fff3ea;
    transition: transform 1.8s ease-out, box-shadow 1.8s ease-out; box-shadow: 0 8px 24px #0003; }
  @media (hover: hover) and (pointer: fine) { .balloons button { transition: transform .15s ease; } .balloons button:hover { transform: translateY(-2px); border-color: #ffb27a; } }
  /* 3x3 everywhere; the grid never gets taller than the window, so the card shrinks instead of scrolling (Golan, 16.10, all games) */
  #balloonPick .balloons { width: min(100%, calc(100dvh - var(--et, 0px) - var(--eb, 0px) - 2 * max(calc(28 * var(--uu, 1px)), 14px) - 1.4 * max(calc(34 * var(--uu, 1px)), 24px) - 30px)); margin-inline: auto; }
  /* no 5-column fallback: 3x3 on every screen, phone landscape too (Golan, 16.10) */
  @media (prefers-reduced-motion: reduce) { .go-btn.pressed, .balloons button.flash, .count span { animation-duration: .01s; } }
  /* ---------- screens standard (screens/screens-standard.md, 16.10): one design unit --u (1280x720 board, 720x1280 standing),
     finger floors in mm (--tap-s 10 mm, --tap 15 mm, --tap-play 20 mm) and safe edges (--edge-*) from games/shared/screen.js.
     No width breakpoints: only standing / lying (html[data-screen~=portrait]). Fallbacks keep the page usable without screen.js. */
  html, body { position: fixed; inset: 0; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  :root {
    --uu: var(--u, 1px);
    --b: max(calc(64 * var(--uu)), var(--tap-s, 48px));            /* door, settings */
    --row: calc(var(--b) + 12 * var(--uu));
    --spk: max(calc(46 * var(--uu)), var(--tap-s, 44px));          /* the question speaker, small (Golan, 16.10) */
    --spk-l: max(calc(56 * var(--uu)), calc(var(--tap-s, 44px) * 1.15));
    --hear: max(calc(76 * var(--uu)), var(--tap, 60px));          /* same height as "יוצאים לדרך" */
    --et: var(--edge-t, max(12px, env(safe-area-inset-top))); --er: var(--edge-r, max(16px, env(safe-area-inset-right)));
    --eb: var(--edge-b, max(12px, env(safe-area-inset-bottom))); --el: var(--edge-l, max(16px, env(safe-area-inset-left)));
  }
  .round-btn { width: var(--b); height: var(--b); font-size: calc(var(--b) * 0.47); }
  .door-btn { top: var(--et); left: var(--el); font-size: calc(var(--b) * 0.62); }
  .door-btn::after { font-size: max(calc(18 * var(--uu)), 14px); }
  .gear, .start-gear { top: var(--et); left: var(--el); }
  .hud .gear, .under-door { top: calc(var(--et) + var(--row)); }
  .hud .pause-btn { left: var(--el); top: calc(var(--et) + 2 * var(--row)); }
  .stars { top: var(--et); right: var(--er); font-size: max(calc(26 * var(--uu)), 18px); padding: calc(8 * var(--uu)) calc(18 * var(--uu)); }
  .prompt { top: var(--et); gap: calc(14 * var(--uu)); padding: calc(8 * var(--uu)) calc(12 * var(--uu)) calc(8 * var(--uu)) calc(20 * var(--uu)); }
  html[data-screen~="portrait"] .prompt { top: calc(var(--et) + var(--b) + 10 * var(--uu)); }   /* standing: the bar goes one row down, under the door */
  .prompt .target { font-size: max(calc(56 * var(--uu)), 40px); min-width: max(calc(64 * var(--uu)), 48px); }
  .prompt #replay { width: var(--spk); height: var(--spk); font-size: calc(var(--spk) * 0.7); padding: 0; line-height: 1; overflow: hidden; }   /* bigger icon, same circle (Golan, 16.10) */
  .prompt.listen { padding: calc(8 * var(--uu)) calc(14 * var(--uu)); }
  .prompt.listen #replay { width: var(--spk-l); height: var(--spk-l); font-size: calc(var(--spk-l) * 0.7); padding: 0; line-height: 1; overflow: hidden; }
  .dots-wrap { top: calc(var(--et) + 92 * var(--uu)); }   /* the game moves it right under the bar */
  .dots { gap: max(calc(6 * var(--uu)), 4px); }
  .dots span { width: max(calc(12 * var(--uu)), 9px); height: max(calc(12 * var(--uu)), 9px); }
  /* ONE fixed look from the first frame to the end (Golan, 16.10, all games): the pill never changes size, not when the
     letter arrives, not for a wide letter, not in a listening sky; the dots sit a fixed gap under it, set by CSS only */
  :root {
    --pill-t: max(calc(56 * var(--uu)), 40px);                     /* letter size */
    --pill-lw: max(calc(64 * var(--uu)), 48px);                    /* letter slot width */
    --pill-h: calc(max(var(--pill-t), var(--spk)) + 16 * var(--uu));
    --pill-w: calc(var(--pill-lw) + var(--spk) + 46 * var(--uu));   /* 20 + 14 + 12 of padding and gap */
    --pill-top: var(--et);
    --dots-gap: max(calc(8 * var(--uu)), 6px);
  }
  html[data-screen~="portrait"] { --pill-top: calc(var(--et) + var(--b) + 10 * var(--uu)); }
  .prompt, .prompt.listen { box-sizing: border-box; top: var(--pill-top); height: var(--pill-h); width: var(--pill-w);
    padding: 0 calc(12 * var(--uu)) 0 calc(20 * var(--uu)); justify-content: space-between; }
  .prompt .target { display: block; width: var(--pill-lw); min-width: 0; height: var(--pill-t); line-height: 1; overflow: visible; }
  .prompt.listen { justify-content: center; padding: 0; }
  .prompt.listen #replay { width: var(--spk); height: var(--spk); font-size: calc(var(--spk) * 0.7); }   /* same circle, just centred */
  .dots-wrap { top: calc(var(--pill-top) + var(--pill-h) + var(--dots-gap)) !important; }
  .dots { margin-top: 0; }
  .perf { top: calc(var(--et) + 4px); left: calc(var(--el) + var(--b) + 12 * var(--uu)); }
  /* windows stay inside the safe area and never taller than the screen (no 100vh: on a phone it is taller than what shows) */
  .overlay { padding: var(--et) var(--er) var(--eb) var(--el); }
  html[data-screen~="landscape"] #start, html[data-screen~="landscape"] #balloonPick, html[data-screen~="landscape"] #end {
    padding-inline: calc(max(var(--el), var(--er)) + var(--b) + 8 * var(--uu)); }   /* lying: the window keeps clear of the door column */
  html[data-screen~="portrait"] #end { padding-top: calc(var(--et) + var(--row) + var(--b) + 8 * var(--uu)); }   /* standing: the window starts below the gear */
  .panel { width: min(100%, max(calc(520 * var(--uu)), 340px)); max-width: none; max-height: 100%; overflow-y: auto;
    padding: max(calc(28 * var(--uu)), 14px) max(calc(24 * var(--uu)), 16px); border-radius: max(calc(28 * var(--uu)), 18px); }
  .panel.pause-panel { width: auto; overflow: visible; }
  .panel h1 { font-size: max(calc(34 * var(--uu)), 24px); }
  .panel p { font-size: max(calc(19 * var(--uu)), 16px); }
  .big-btn { font-size: max(calc(30 * var(--uu)), 22px); padding: calc(18 * var(--uu)) max(calc(44 * var(--uu)), 22px); min-height: max(calc(76 * var(--uu)), var(--tap, 60px)); }
  .big-btn.small { font-size: max(calc(22 * var(--uu)), 18px); min-height: max(calc(56 * var(--uu)), var(--tap-s, 44px)); }
  #start .start-row { gap: max(calc(24 * var(--uu)), 8px); }
  /* the start speaker is a circle and its 🔊 fits inside it: no button padding, no minimum height, icon about half the circle, centred (Golan, 16.10, all games) */
  #start #hear { width: var(--hear); min-width: var(--hear); height: var(--hear); min-height: 0; padding: 0; border-radius: 50%;
    display: grid; place-items: center; line-height: 1; font-size: calc(var(--hear) * 0.7); overflow: hidden; }
  .count span { left: calc(-90 * var(--uu)); top: calc(-90 * var(--uu)); width: calc(180 * var(--uu)); height: calc(180 * var(--uu)); font-size: calc(110 * var(--uu)); }
  /* X close in the settings window's top right corner; it stays in view while the window scrolls (Golan, 16.10, all games) */
  /* settings = a fixed header (X + title) over a scrolling body (screens standard 4א); on a phone the window spans the
     whole width minus the edges, so the letter tables get as wide as they can (audit 16.10) */
  #settings .panel.settings { position: relative; display: flex; flex-direction: column; overflow: hidden; max-height: 100%; box-sizing: border-box; }
  .set-head { position: relative; flex: 0 0 auto; min-height: calc(var(--tap-s, 44px) - max(calc(28 * var(--uu)), 14px) + 10px); }   /* always taller than the X */
  #settings .panel.settings { width: min(100%, max(calc(520 * var(--uu)), 460px)); }   /* a short PC window keeps a readable table */

    return `<svg viewBox="0 -14 100 134" aria-hidden="true"><defs><clipPath id="bc${i}"><path d="${env}" transform="${t}"/></clipPath></defs>` +
      (d.flag ? `<path d="M50 ${top + 1}V${top - 10}" stroke="#5b4632" stroke-width="2"/><path d="M50 ${top - 10}h14l-4 4.5 4 4.5H50z" fill="${d.flag}"/>` : "") +
      `<image href="${cv.toDataURL()}" x="0" y="${d.shape === "heart" ? -14 : Math.min(0, top - 2).toFixed(1)}" width="100" height="${d.shape === "heart" ? 134 : (120 - Math.min(0, top - 2)).toFixed(1)}" preserveAspectRatio="none" clip-path="url(#bc${i})"/>` +
      `<path d="${env}" transform="${t}" fill="none" stroke="${d.shape === "heart" ? d.c[1] : "#0000001f"}" stroke-width="${d.shape === "heart" ? 1.8 : 1.5}"/>` +
      `<path d="M${50 - mx} 89L32 97M${50 + mx} 89L68 97" stroke="#5b4632" stroke-width="2.5"/><rect x="30" y="96" width="40" height="24" rx="4" fill="${d.basket}"/>` +   // the heart balloon's basket size (Golan 28.10)
      `<rect x="30" y="96" width="40" height="4" fill="#4a3222"/><rect x="30" y="104.5" width="40" height="3.6" fill="${d.c[0]}"/>` +
      `<rect x="30" y="110.4" width="40" height="2.4" fill="${d.c[1] || "#fff"}"/><rect x="30" y="114.6" width="40" height="3.6" fill="${d.c[0]}"/></svg>`;   // striped basket, like the 3D one
  }
  let pickNagT = 0, pickFlashTs = [], picking = false, pickSaid = 0;   // "יש לבחור כדור פורח" is said only twice, then the balloons just flash (Golan, 15.10, as in the car game)
  function openPick() {
    const box = $("balloons"); box.textContent = "";
    BALLOONS.forEach((d, i) => {
      const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "כדור " + (i + 1)); b.innerHTML = balloonSvg(i);
      b.addEventListener("click", () => pickBalloon(i)); box.append(b);
    });
    $("balloonPick").hidden = false; clearTimeout(pickNagT); pickSaid = 0;
    setTimeout(() => { if (!$("balloonPick").hidden && !picking) { say("יש לבחור כדור פורח", 1); pickSaid++; setTimeout(() => whenQuiet(pickNag), 300); } }, 700);
  }
  function stopPickFlash() { clearTimeout(pickNagT); pickFlashTs.forEach(clearTimeout); pickFlashTs = []; [...$("balloons").children].forEach((b) => b.classList.remove("flash")); }
  function pickNag() {
    clearTimeout(pickNagT);
    pickNagT = setTimeout(() => {
      if ($("balloonPick").hidden || picking) return;
      if (pickSaid < 2) { say("יש לבחור כדור פורח", 1); pickSaid++; }
      const btns = shuffle([...$("balloons").children]);
      btns.forEach((b, i) => pickFlashTs.push(setTimeout(() => { b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); }, i * 420)));
      pickFlashTs.push(setTimeout(() => whenQuiet(pickNag), btns.length * 420 + 1000));
    }, 4000);
  }
  function pickBalloon(i) {
    if (picking) return; picking = true; stopPickFlash();
    settings.balloon = i; saveSettings(); useBalloon(i);
    [...$("balloons").children].forEach((b, k) => { b.setAttribute("aria-pressed", String(k === i)); b.classList.toggle("chosen", k === i); });   // grows, like the chosen car
    say(Math.random() < 0.5 ? "יופי של בחירה!" : "בחירה מצוינת!", 1);
    const grownAt = performance.now() + 1800;   // the picker waits until the balloon has finished growing (Golan, 16.10)
    whenQuiet(() => setTimeout(() => { picking = false; if ($("balloonPick").hidden) return; $("balloonPick").hidden = true; $("hud").hidden = false; state.stars = 0; state.starKinds = []; if (sc) sc.reset(); /* stars start at zero as soon as the HUD shows (Golan, 16.10) */ countdown();   /* no pause button any more (Golan, 16.10) */ }, Math.max(250, grownAt - performance.now())));   // same short pause as the car picker (Golan, 15.10)
  }
  if (settings.balloon != null) useBalloon(settings.balloon);

  // ---------- 3, 2, 1 on the hill, then the balloon lifts off ----------
  let countToken = 0;
  function countdown() {
    const my = ++countToken;
    document.documentElement.classList.add("fl-counting");   // on clean light blue (Golan 23.10; screen.js)
    state.mode = "ready"; state.q = null; state.liftGoal = 0; state.lift = 0;
    clouds.forEach((c) => { c.state = "off"; c.root.setEnabled(false); }); clearTags(); state.swap = null;
    $("target").textContent = ""; renderPips(); renderDots(); layout();
    const box = $("count"), steps = [["3", "#10b947"], ["2", "#10b947"], ["1", "#10b947"]];
    steps.forEach(([n, col], i) => setTimeout(() => {
      if (my !== countToken || state.mode !== "ready") return;
      box.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = n; sp.style.background = col; box.append(sp);
      tone([i === 2 ? 660 : 520], 0.16, "sine", 0.35);
      if (i === 0) state.liftGoal = 1;   // the balloon starts rising with "3", slowly, and arrives as the game starts (Golan, 15.10)
    }, 700 + i * 1000));
    setTimeout(() => {
      if (my !== countToken || state.mode !== "ready") return;
      box.innerHTML = ""; tone([880, 1175], 0.14, "triangle", 0.4);
      startRound();
    }, 700 + 3 * 1000);
  }

  // ---------- door = back to the start screen, from every screen ----------
  // opened from the hub: every door goes straight back to the hub's "בַּמֶּה נְשַׂחֵק?" list (Golan, 16.10).
  const HUB_GAMES = LM && LM.fromHub && LM.hubUrl ? LM.hubUrl + "#games" : null;   // hub path comes from data-fl-hub on the learner.js tag
  function goHub() { if (hg) hg.stop(); flushPartial(); hush(); countToken++; clearTimeout(introT); location.href = HUB_GAMES; }
  function backToStart() {
    if (HUB_GAMES) return goHub();
    resetToStart();
  }
  function demoFromStart() {
    $("start").hidden = true; $("hud").hidden = false; document.documentElement.classList.remove("fl-counting");
    if (settings.balloon == null) useBalloon(0);
    state.lift = state.liftGoal = 1; state.stars = 0; state.starKinds = []; if (sc) sc.reset(); state.qIndex = 0;
    renderDots(); layout();
    runDemo(() => setTimeout(resetToStart, 600));
  }
  // the restart button: the balloon picker again
  function backToPick() { resetToStart(); $("start").hidden = true; clearTags(); state.swap = null; openPick(); }
  function resetToStart() {
    flushPartial(); hush(); if (hg) hg.stop(); hideHand(); demoAfter = null; hideOk();
    if (pausedFrom !== null) resumeGame();
    stopPickFlash(); picking = false;
    state.q = null; state.resolved = true; state.mode = "intro"; state.flashAt = 0; state.liftGoal = 0;
    countToken++; $("count").innerHTML = "";
    clouds.forEach((c) => { c.state = "off"; c.root.setEnabled(false); }); clearTags(); state.swap = null;
    ["hud", "end", "balloonPick", "settings", "paused"].forEach((id) => ($(id).hidden = true));
    $("start").hidden = false;
  }
  ["doorGame", "doorPick", "doorEnd", "doorPause"].forEach((id) => $(id).addEventListener("click", backToStart));   // the door always leaves to the island's game list, from every screen (Golan 28.10); opened on its own: the start screen
  // "התחל מחדש" under the gear (Golan 23.10, all games): the round starts again, as after "עוד סיבוב"
  if (window.FL && FL.screen && FL.screen.restartButton) FL.screen.restartButton(backToPick);

  // test hook for automated checks
  window.__sound = { openPick, state, askQuestion, clouds, makeQuestion, cloudAt, layout, view, endRound, endP, tags, judge, balloon, autoSolve, hearName, runDemo: () => runDemo(), SOUNDS };
})();
</script>
