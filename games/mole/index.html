<meta charset="utf-8">
<title>הכה את החפרפרת</title>
<script>document.documentElement.lang = "he"; document.documentElement.dir = "rtl";   /* like the race game's <html lang="he" dir="rtl"> (the artifact adds its own <html>) */</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- the shared self-hosted font (no internet needed); fonts/ next to the game is the copy for a page without games/shared -->
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Screens standard (/mnt/project-files/screens/screens-standard.md, 16.10): every size is a number of --u (one pixel of a
   1280x720 board, 720x1280 when the screen stands), with a floor in mm for fingers (--tap-s 10 mm, --tap 15 mm,
   --tap-play 20 mm, --gap 5 mm), and every distance from an edge is --edge-* (safe area or 12 --u). The variables come from
   games/shared/screen.js. No breakpoints by width: only standing (portrait) or lying (landscape).
   Look: same as "מרוץ השערים", one daylight look in light and dark. */
  :root {
    --sky: #bfe6ff; --ink: #1d2a3a; --card: #ffffffee; --accent: #ff8a3d; --accent-ink: #ffffff; --good: #2bb673; --muted: #5b6b7f;
    color-scheme: light;
    /* fallbacks until screen.js has measured (and on a page without it) */
    --u: 1px; --tap-s: 59px; --tap: 88px; --tap-play: 118px; --gap: 29px;
    --edge-t: max(12px, env(safe-area-inset-top)); --edge-r: max(12px, env(safe-area-inset-right));
    --edge-b: max(12px, env(safe-area-inset-bottom)); --edge-l: max(12px, env(safe-area-inset-left));
    /* the game's own sizes */
    --btn-s: max(calc(64 * var(--u)), var(--tap-s));     /* door, settings */
    --btn: max(calc(96 * var(--u)), var(--tap));          /* the child's speaker */
    --col-gap: max(calc(14 * var(--u)), var(--gap));      /* space between two buttons in the door column */
    --pill-h: var(--btn-s);                               /* the star pill is as tall as the door */
    --t-body: max(calc(26 * var(--u)), 17px);             /* parent text */
    --t-h1: max(calc(44 * var(--u)), 26px);
    --t-btn: max(calc(38 * var(--u)), 24px);
    --panel-w: min(100%, max(calc(640 * var(--u)), 320px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--sky);
    font-family: "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  /* ---------- buttons ---------- */
  .round-btn {
    width: var(--btn-s); height: var(--btn-s); border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: calc(var(--btn-s) * .46); display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 #c45f1d; padding: 0;
  }
  .round-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c45f1d; }
  .round-btn[hidden] { display: none; }
  /* the door column at the top left, on every screen: door, then settings under it (Golan 14.10-16.10) */
  .door-btn, .gear { position: absolute; left: var(--edge-l); background: var(--card); color: var(--ink); box-shadow: 0 4px 16px #0002; }
  .door-btn { top: var(--edge-t); z-index: 30; font-size: calc(var(--btn-s) * .62); }
  .gear, .under-door { top: calc(var(--edge-t) + var(--btn-s) + var(--col-gap)); }
  .gear .gear-ico { width: 1.45em; height: 1.45em; color: #5b6470; }
  .door-ico { width: 1em; height: 1em; display: block; }
  /* "יציאה" tip on mouse hover (Golan 15.10) */
  .door-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #2b2f3a; color: #fff; font: 700 18px "Noto Sans Hebrew", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease .25s; }
  @media (hover: hover) { .door-btn:hover::after { opacity: 1; } }
  #pause, .pause-btn { display: none !important; }   /* no pause in this game (Golan 16.10) */

  /* ---------- the game screen ---------- */
  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  /* top letter pill = the detective's standard (Golan 16.10, all games), fixed size for the whole game. This game never shows
     the letter, so it is the detective's "listening sky" pill: same width and height, the speaker centred, emoji 0.7x */
  :root {
    --lp-spk: max(calc(46 * var(--u)), var(--tap-s));
    --lp-t: max(calc(56 * var(--u)), 40px);
    --lp-lw: max(calc(64 * var(--u)), 48px);
    --lp-h: calc(max(var(--lp-t), var(--lp-spk)) + 16 * var(--u));
    --lp-w: calc(var(--lp-lw) + var(--lp-spk) + 46 * var(--u));
    --lp-top: var(--edge-t);
    --dots-gap: max(calc(8 * var(--u)), 6px);
  }
  html[data-screen~="portrait"] { --lp-top: calc(var(--edge-t) + var(--btn-s) + 10 * var(--u)); }   /* standing phone: one row down, under the door */
  .prompt { position: absolute; left: 50%; transform: translateX(-50%); top: var(--lp-top); box-sizing: border-box;
    width: var(--lp-w); height: var(--lp-h); padding: 0; display: flex; align-items: center; justify-content: center;
    background: var(--card); border-radius: 999px; box-shadow: 0 4px 16px #0002; }
  .prompt .target, .prompt .pips { display: none !important; }
  .prompt #replay { width: var(--lp-spk); height: var(--lp-spk); min-width: 0; min-height: 0; font-size: calc(var(--lp-spk) * 0.7); padding: 0; line-height: 1; overflow: hidden; }
  .stars { position: absolute; top: var(--edge-t); right: var(--edge-r); min-height: var(--pill-h); display: flex; align-items: center;
    background: var(--card); border-radius: 999px; padding: 0 max(calc(20 * var(--u)), 12px); font-size: max(calc(30 * var(--u)), 20px); font-weight: 800;
    box-shadow: 0 4px 16px #0002; }
  .stars.fl-sc-host { max-width: calc(100vw - var(--edge-l) - var(--edge-r) - var(--btn-s) - var(--col-gap)); }
  .dots-wrap { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; top: calc(var(--lp-top) + var(--lp-h) + var(--dots-gap)); }
  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: max(calc(6 * var(--u)), 4px); max-width: 70vw; }
  .dots span { width: max(calc(12 * var(--u)), 9px); height: max(calc(12 * var(--u)), 9px); border-radius: 50%; background: #0002; }
  .dots span.done { background: var(--good); }

  .perf { position: absolute; bottom: var(--edge-b); left: var(--edge-l); direction: ltr; text-align: left;
    font: 600 12px/1.35 ui-monospace, Menlo, Consolas, monospace; background: #000a; color: #fff; padding: 5px 9px; border-radius: 10px; pointer-events: none; }
  .perf[hidden] { display: none; }
  .perf b { font-size: 18px; }
  .perf .bad { color: #ff8080; } .perf .ok { color: #ffd166; } .perf .good { color: #7dffb0; }

  /* 3-2-1 before the round (Golan 14.10): each glowing green circle appears big and fades away */
  .count { position: absolute; left: 50%; top: 42%; width: 0; height: 0; pointer-events: none; --c: max(calc(240 * var(--u)), 150px); }
  .count span { position: absolute; left: calc(var(--c) / -2); top: calc(var(--c) / -2); width: var(--c); height: var(--c); border-radius: 50%;
    display: grid; place-items: center; font-size: calc(var(--c) * .6); font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0003;
    box-shadow: 0 0 0 4px #3dff7f88, 0 0 24px #3dff7f, 0 0 54px #00e05a, 0 8px 30px #0003; animation: countPop .95s ease-out forwards; }
  @keyframes countPop { 0% { transform: scale(.4); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  .toast { display: none; }   /* no "oops" and no text after a touch in this game */

  /* ---------- screens over the game: start, balloon pick, end, settings ---------- */
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: #bfe6ffcc;
    padding: var(--edge-t) var(--edge-r) var(--edge-b) var(--edge-l); }
  .overlay[hidden], .row[hidden] { display: none; }
  .letters { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }   /* a hidden settings row really disappears (.row sets display: flex) */
  /* a screen with the door column keeps its panel clear of it */
  .overlay:has(> .door-btn) { padding-left: calc(var(--edge-l) + var(--btn-s) + var(--col-gap)); padding-right: calc(var(--edge-r) + var(--btn-s) + var(--col-gap)); }
  html[data-screen~="portrait"] .overlay:has(> .door-btn) { padding-left: var(--edge-l); padding-right: var(--edge-r);
    padding-top: calc(var(--edge-t) + var(--btn-s) * 2 + var(--col-gap) * 2); }
  .panel { background: #fff; border-radius: max(calc(36 * var(--u)), 20px); padding: max(calc(36 * var(--u)), 16px) max(calc(32 * var(--u)), 16px);
    width: var(--panel-w); max-height: 100%; overflow-y: auto; text-align: center; box-shadow: 0 10px 40px #0003; }
  .panel h1 { margin: 0 0 .25em; font-size: var(--t-h1); }
  .panel p { margin: .3em 0 .9em; font-size: var(--t-body); color: var(--muted); }
  .big-btn { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
    font: 800 var(--t-btn) "Noto Sans Hebrew", system-ui, sans-serif; padding: 0 1.3em; min-height: var(--tap); box-shadow: 0 5px 0 #c45f1d; }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c45f1d; }
  .big-btn:disabled { opacity: .6; }
  .go-btn { background: #34b36b; box-shadow: 0 5px 0 #1f8048; }
  #closeSettings { background: #34b36b; box-shadow: 0 5px 0 #1f8048; } #closeSettings:active { box-shadow: 0 2px 0 #1f8048; }   /* Golan 22.10: back to the game = starts it again, green */
  .go-btn:active { box-shadow: 0 2px 0 #1f8048; }
  .go-btn.pressed { animation: goPress .9s ease-in-out; box-shadow: 0 0 0 6px #34b36b33, 0 3px 0 #1f8048; }
  @keyframes goPress { 0% { transform: scale(1); } 45% { transform: scale(.95); } 100% { transform: scale(1); } }
  /* start screen: "יוצאים לדרך" in the middle, the speaker at the end of the row (Golan 14.10) */
  #start .start-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: max(calc(20 * var(--u)), 8px); align-items: center; }
  #start #go { grid-column: 2; white-space: nowrap; } #start #hear { grid-column: 3; justify-self: end; }
  /* the start-screen 🔊: a circle as tall as the start button, the icon centred inside it (Golan 16.10, all games, as in detective) */
  .spk { --spk: max(calc(76 * var(--u)), var(--tap)); width: var(--spk); min-width: var(--spk); height: var(--spk); min-height: 0; padding: 0;
    border-radius: 50%; display: grid; place-items: center; line-height: 1; font-size: calc(var(--spk) * .47); overflow: hidden; }
  #start #go { min-height: var(--spk, max(calc(76 * var(--u)), var(--tap))); }
  @media (hover: hover) and (pointer: fine) {
    .big-btn, .round-btn, .seg button { transition: transform .15s ease, filter .15s ease; }
    .big-btn:hover, .round-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .seg button:hover { transform: translateY(-2px); border-color: #ffb27a; }
  }

  /* balloon pick: 9 balloons, 3 in a row (5 in a row on a low lying screen) */
  .balloons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  /* same card as the detective picker (Golan 16.10, all games) */
  #balloonPick .panel { width: min(100%, max(calc(520 * var(--u)), 340px)); padding: max(calc(28 * var(--u)), 14px) max(calc(24 * var(--u)), 16px); border-radius: max(calc(28 * var(--u)), 18px); }
  #balloonPick .panel h1 { margin: 0 0 8px; }
  .balloons button { border: 3px solid #d5dde6; border-radius: 18px; background: #eaf6ff; padding: 6px; cursor: pointer; aspect-ratio: 1;
    display: grid; place-items: center; min-width: var(--tap); }
  .balloons button svg { width: 94%; height: 94%; display: block; }
  .balloons button:active { transform: scale(.96); }
  .balloons button.flash { animation: carFlash 1s ease-in-out; }   /* slower flash and grow (Golan 16.10) */
  @keyframes carFlash { 50% { transform: scale(1.18); border-color: #ffb27a; } }
  #balloons button.chosen { position: relative; z-index: 2; transform: scale(1.3); border-color: var(--accent); background: #fff3ea;
    transition: transform 1.8s ease-out, box-shadow 1.8s ease-out; box-shadow: 0 8px 24px #0003; }
  @media (hover: hover) and (pointer: fine) { .balloons button { transition: transform .15s ease; } .balloons button:hover { transform: translateY(-2px); border-color: #ffb27a; } }
  /* phone landscape: one wider card, 5 columns (5 + 4) so it fits the short height */
  /* 3x3 everywhere (Golan 16.10): the grid is never taller than the window, so on a short PC window the tiles shrink instead of scrolling */
  #balloonPick .balloons { width: min(100%, calc(100dvh - var(--edge-t, 0px) - var(--edge-b, 0px) - 2 * max(calc(28 * var(--u)), 14px) - 1.4 * var(--t-h1) - 30px)); margin-inline: auto; }


  /* pause screen (kept for the code; there is no pause button in this game) */
  .panel.pause-panel { background: none; box-shadow: none; width: auto; }
  #resume { background: var(--good); color: #fff; box-shadow: 0 5px 0 #1d8a55; display: inline-flex; align-items: center; gap: 22px; }

  /* age question: only on a page without the shared child card (the age is in the profile now) */
  .age-pick .ages { display: flex; gap: max(calc(12 * var(--u)), 8px); justify-content: center; margin: 14px 0 6px; }
  .age-pick .ages button { width: var(--tap); height: var(--tap); border-radius: 22%; border: 3px solid #d5dde6; background: #eaf6ff; cursor: pointer;
    font: 800 calc(var(--tap) * .45) "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); }

  /* ---------- settings (for the parent: may go down to 9 mm buttons and 14px text, standard sec 3) ---------- */
  .settings { text-align: right; }
  .settings h2 { margin: 0 0 12px; font-size: max(calc(34 * var(--u)), 22px); text-align: center; }
  .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 12px; row-gap: 8px; padding: 10px 0;
    border-bottom: 1px solid #eee; font-size: max(calc(24 * var(--u)), 17px); }
  /* every settings row: title on its own line, then the choices, then the explanation (Golan 16.10) */
  .settings .row > span:first-child { flex: 0 0 100%; font-weight: 700; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { min-width: max(calc(96 * var(--u)), 64px); min-height: max(calc(64 * var(--u)), 53px); border-radius: 14px; border: 2px solid #d5dde6; background: #fff;
    font: 700 max(calc(22 * var(--u)), 16px) "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); cursor: pointer; padding: 0 10px; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  #ageSeg { flex-wrap: nowrap; }
  #ageSeg button { min-width: 53px; padding-inline: 0; flex: 0 0 auto; }
  .row-note { display: block; width: 100%; font-size: max(calc(19 * var(--u)), 14px); color: var(--muted); line-height: 1.4; }
  .card-title { width: 100%; font-weight: 700; font-size: max(calc(24 * var(--u)), 17px); margin-top: 6px; }
  .report { text-align: right; font-size: max(calc(23 * var(--u)), 16px); line-height: 1.5; }
  .report .info { color: var(--muted); font-size: max(calc(20 * var(--u)), 14px); margin-top: 6px; }
  .child-card { width: 100%; }
  .diag { direction: ltr; text-align: left; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  #closeSettings { margin-top: 4px; }
  /* X at the top right of settings, closes like "חזרה למשחק" (Golan 16.10, all games); stays in view while the panel scrolls */
  #settings .panel.settings { display: flex; flex-direction: column; overflow: hidden; max-height: 100%; box-sizing: border-box; }
  .set-head { position: relative; flex: 0 0 auto; padding-inline: calc(var(--tap-s) + 4px); }   /* room for the X on both sides keeps the title centred */
  .set-head h2 { min-height: var(--tap-s); display: flex; align-items: center; justify-content: center; }
  .set-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  html[data-screen~="phone"] #settings .panel.settings { width: 100%; padding-inline: max(calc(12 * var(--u)), 10px); }
  .x-btn { position: absolute; top: 0; right: 0; z-index: 2; width: var(--tap-s); height: var(--tap-s); padding: 0;
    border: 0; border-radius: 50%; background: #eef2f6; color: var(--ink); font: 700 calc(var(--tap-s) * .45) system-ui, sans-serif; cursor: pointer;
    display: grid; place-items: center; box-shadow: 0 2px 8px #0002; }
  .x-btn:active { transform: scale(.95); }

  @media (prefers-reduced-motion: reduce) { .go-btn.pressed, .balloons button.flash, .count span { animation-duration: .01s; } }
  #settings .panel.settings { height: 100%; }   /* the settings window is always the same size (Golan 19.10, all games + hub) */

  /* ---------- the mole game (Golan 21.10, station 1) ---------- */
  html, body { background: linear-gradient(#8fd0ff 0%, #bfe6ff 55%, #e6f6ff 100%); }
  .prompt, .dots-wrap { display: none !important; }
  /* the guide: the child's own companion in the chosen balloon, holding the sign with the letter we look for (Golan 21.10).
     Lying screen: a column on the left under the door and the gear. Standing screen: at the top in the middle. */
  .guide { position: absolute; display: flex; flex-direction: column; align-items: center; gap: max(calc(6 * var(--u)), 4px); pointer-events: none; }
  .guide > * { pointer-events: auto; }
  .guide svg.g-pic { display: block; width: 100%; height: auto; overflow: visible; }
  .guide #replay { width: var(--btn-s); height: var(--btn-s); background: var(--card); color: var(--ink); box-shadow: 0 4px 16px #0002; font-size: calc(var(--btn-s) * .5); }
  html[data-screen~="portrait"] .guide { flex-direction: row; align-items: flex-end; }
  .g-all { transform-box: view-box; transform-origin: 60px 90px; animation: gFloat 3.2s ease-in-out infinite; }
  @keyframes gFloat { 50% { transform: translateY(-3px); } }
  .g-comp, .g-sign { transform-box: view-box; }
  .g-comp { transform-origin: 60px 132px; }
  .g-sign { transform-origin: 60px 150px; }
  .guide.yay .g-comp { animation: gJump .55s ease-out 2; }
  .guide.yay .g-sign { animation: gJump .55s ease-out 2; }
  @keyframes gJump { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px) scale(1.04); } }
  .guide.oops .g-comp { animation: gShake .7s ease-in-out; }
  @keyframes gShake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 45% { transform: rotate(8deg); } 70% { transform: rotate(-5deg); } }
  .guide.timeup .g-comp { animation: gDroop 1.2s ease-in-out; }
  @keyframes gDroop { 0%, 100% { transform: none; } 30%, 75% { transform: translateY(5px) rotate(-6deg); } }
  .guide.timeup .g-clock { opacity: 1; animation: gRing .15s linear 6; }
  .g-clock { opacity: 0; transition: opacity .3s; transform-box: fill-box; transform-origin: center; }
  @keyframes gRing { 50% { transform: rotate(12deg); } }
  .g-sign.hint rect.board { stroke: #ffc233; }
  @media (prefers-reduced-motion: reduce) { .g-all, .guide * { animation: none !important; } }
</style>

<canvas id="game" aria-label="הכה את החפרפרת"></canvas>

<div class="hud" id="hud" hidden>
  <!-- the guide (Golan 21.10): the child's companion in the chosen balloon holds the sign; 🔊 says the question again -->
  <div class="guide" id="guide">
    <div id="guidePic"></div>
    <button class="round-btn" id="replay" aria-label="שוב">🔊</button>
  </div>
  <div class="stars" id="stars" data-fl-stars data-fl-title="הכה את החפרפרת"></div>

  const whereId = (l) => "lc_" + CLIP_OF_LETTER[l];   // lc_name_bet, lc_fin_kaf
  const FALLBACK = {}; for (const l of [...LETTERS, ...FINALS]) FALLBACK[whereId(l)] = CLIP_OF_LETTER[l] === "name_zayin" ? ["name_zayin"] : ["lc_where", CLIP_OF_LETTER[l]];
  // a wrong mole: "זֹאת הָאוֹת" (this_is, tell-me's clip) + the touched letter's name, then the question again
  const CLIP_END = { this_is: 1.0 };   // "זֹאת הָאוֹת" is spoken by 0.95 s; the file runs on silent to 1.87 s (tell-me, Golan 15.10)
  const GENDERED = ["ins_balloon", "ins_mole"];
  GENDERED.forEach((id) => { FALLBACK[id + "_m"] = [id]; FALLBACK[id + "_f"] = [id]; });
  const LINES = { go: "fb_go", done: "fb_round_done", choice1: "fb_choice1", choice2: "fb_choice2", pick: "ins_balloon", correct: "fb_correct", thisIs: "this_is",
    intro: "ins_mole" };   // new (requested): "מַקְשִׁיבִים לְשֵׁם הָאוֹת, וְנוֹגְעִים בַּחֲפַרְפֶּרֶת שֶׁמַּחְזִיקָה אוֹתָהּ" _m / _f

  let voiceHold = () => false, heldSeq = null, curSeq = null;

    setTimeout(() => { if (state.q !== q) return; duckAll(q, m); setTimeout(() => { if (state.q === q) whenQuiet(() => { if (state.q === q) askNext(); }); }, 650); }, 900);
  }
  // one record per letter asked, with the first answer (shared card). A sign showing "?" = heard only (audioOnly), and a
  // perfect heard-only find counts toward "מזהה בביטחון" (as in the detective).
  function recordQ(q, solved) {
    if (!LRN || q.rec) return; q.rec = true;
    const ok = !q.wrongs, heard = !q.shown;
    try {
      LRN.record({ game: "mole", letter: q.letter, picked: ok ? q.letter : q.firstWrong, firstTry: ok, solved, opts: q.letters.slice(), rtMs: q.firstTap || 0,
        changed: false, hint: q.hint ? 1 : 0, mode: "recognize", audioOnly: heard, perfect: heard && solved && ok && !q.hint });
      if (visit) visit.result(q.letter, { perfect: solved && ok && !q.hint, listen: q.listen });
    } catch (e) {}
  }
  function flushPartial() {
    const q = state.q; if (q && !q.done && q.wrongs) recordQ(q, false);
    if (LRN && state.n && state.roundOpen) { try { LRN.roundEnd({ game: "mole" }); } catch (e) {} state.roundOpen = false; }
  }
  addEventListener("pagehide", flushPartial);

  function startRound() {
    state.stars = 0; state.starKinds = []; state.n = 0; state.roundOpen = true; if (starCount) starCount.reset(); state.roundStart = performance.now();
    if (HG) HG.start(); setTimeout(onScreen, 60); askNext();
  }
  let endP = null;
  function endRound() {
    state.mode = "end"; state.q = null; if (HG) HG.stop();
    if (LRN && state.roundOpen) { try { LRN.roundEnd({ game: "mole" }); } catch (e) {} state.roundOpen = false; }
    moles.forEach((m) => { if (m.state !== "off") { m.state = "duck"; m.t = 0; } });
    sparks.emitRate = 0;
    $("end").hidden = false; $("pause").hidden = true;
    const opts = { stars: state.starKinds.map((k) => (k === "silver" ? "silver" : "gold")), letters: true };
    if (LRN && LRN.endPanel) {
      if (!endP) endP = LRN.endPanel($("end"), { ...opts, buttons: [{ text: "לסיים", ghost: true, id: "finish", onClick: () => $("doorEnd").click() }, { text: "עוד סיבוב", primary: true, id: "again", onClick: playAgain }] });
      else endP.set(opts);
    }
    say(LINES.done);
  }
  $("replay").addEventListener("click", () => {
    const q = state.q; if (!q || q.done || state.mode !== "play") return;
    q.repeats++; speakQuestion(q, 0.85);
  });

  // ---------- settings (the one shared form) ----------
  let modeBeforeSettings = null;
  function syncSeg() { $("perf").hidden = settings.perf !== "on"; }
  function renderLetters() {
    if (form) return form.refresh();
    if (!LRN || !LRN.settingsForm) return;
    const seg = (key, after) => ({ get: () => settings[key], set: (v) => { settings[key] = v; saveSettings(); syncSeg(); if (after) after(); } });
    form = LRN.settingsForm($("flForm"), { game: "mole", lettersId: "letters",
      levels: ["5 חורים ו-3 חפרפרות. החפרפרות מחכות עד שנוגעים, והאות כתובה על השלט עד שמוצאים אותה פעם אחת בלי טעות.",
        "7 חורים ו-4 חפרפרות. כל חפרפרת בחוץ 4 שניות, ואז קופצת מחור אחר. את האות רק שומעים.",
        "10 חורים ו-5 חפרפרות, 2.5 שניות בחוץ, ואחת האותיות דומה לאות שמחפשים. את האות רק שומעים."],
      onLevel: () => { levelChanged = true; },
      picker: { finals: true, onChange: () => { lettersChanged = true; } },
      quality: seg("quality", () => applyQuality()),
      tech: { perf: seg("perf"), diag: () => diagnostics() } });
    pk = form.picker;
  }
  let levelChanged = false, lettersChanged = false;
  function openSettings() { holdGame(); syncSeg(); renderLetters(); if (form && form.closeTech) form.closeTech(); $("settings").hidden = false; document.querySelectorAll("#settings .set-body, #settings .panel").forEach((e) => (e.scrollTop = 0)); }
  function holdGame() {
    if (state.mode !== "paused") { modeBeforeSettings = state.mode; state.mode = "paused"; }
    if (!pausedAt) pausedAt = performance.now();
    if (seqBusy && curSeq) { heldSeq = heldSeq || curSeq; hush(); }
    else if (clipNow && !clipNow.paused) { heardIntro = false; hush(); }
  }
  function closeSettings() {
    $("settings").hidden = true;
    if (levelChanged) { levelChanged = false; layoutHoles(); onScreen(); const q = state.q; if (q && !q.done && modeBeforeSettings === "play") { duckAll(q); q.done = true; modeBeforeSettings = "between"; setTimeout(() => { if (state.mode === "between") askNext(); }, 500); } }
    lettersChanged = false;
    if (!bgHold) releaseGame();
  }
  function releaseGame() {
    if (state.mode === "paused" && pausedFrom === null) {
      state.mode = modeBeforeSettings || "play";
      if (pausedAt) { pausedTotal += performance.now() - pausedAt; pausedAt = 0; }
    }
    if (pausedFrom !== null) return;
    if (state.mode === "ready") { heldSeq = null; countdown(); return; }
    const q = state.q;
    if (state.mode === "play" && q && !q.done) { heldSeq = null; speakQuestion(q, 1); return; }   // the current question once more
    if (heldSeq) { const h = heldSeq; heldSeq = null; playSeq(...h); return; }
    if (!$("start").hidden && !heardIntro) later(autoIntro, 600);
  }
  $("gear").addEventListener("click", openSettings);
  addEventListener("fl:gear", openSettings);
  ["gearStart", "gearPick", "gearEnd", "gearPause"].forEach((id) => $(id).addEventListener("click", (e) => { e.stopPropagation(); openSettings(); }));
  $("closeSettings").addEventListener("click", closeSettings);
  $("xSettings").addEventListener("click", closeSettings);
  $("settings").addEventListener("pointerdown", (e) => { if (e.target === $("settings")) closeSettings(); });
  syncSeg();

  // ---------- pause, and the app in the background ----------
  let pausedFrom = null, pausedClip = null;
  voiceHold = () => !$("settings").hidden || pausedFrom !== null || bgHold;
  let bgHold = false;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (bgHold) return; if ($("settings").hidden) holdGame(); else hush(); bgHold = true; engine.stopRenderLoop(); }
    else if (bgHold) { bgHold = false; engine.runRenderLoop(renderFrame); if ($("settings").hidden) releaseGame(); }
  });
  function pauseGame() {
    if (state.mode === "paused" || state.mode === "end" || state.mode === "ready" || $("hud").hidden) return;
    pausedFrom = state.mode; state.mode = "paused"; pausedAt = performance.now();
    pausedClip = clipNow && !clipNow.paused ? clipNow : null; if (pausedClip) pausedClip.pause();
    $("paused").hidden = false;
  }
  function resumeGame() {
    if (pausedFrom === null) return;
    state.mode = pausedFrom; pausedFrom = null;
    if (pausedAt) { pausedTotal += performance.now() - pausedAt; pausedAt = 0; }
    if (pausedClip) pausedClip.play().catch(() => {}); pausedClip = null;
    if (heldSeq) { const h = heldSeq; heldSeq = null; playSeq(...h); }
    $("paused").hidden = true;
  }
  $("pause").addEventListener("click", () => (pausedFrom === null ? pauseGame() : resumeGame()));
  $("resume").addEventListener("click", resumeGame);
  $("paused").addEventListener("pointerdown", (e) => { if (e.target === $("paused")) resumeGame(); });

  // ---------- performance meter ----------
  const fpsSamples = []; let lastPerfUpdate = 0, loadMs = 0;
  function countTris() { let n = 0; const a = scene.getActiveMeshes(); for (let i = 0; i < a.length; i++) { const m = a.data[i]; n += (m && m.getTotalIndices ? m.getTotalIndices() : 0) / 3; } return Math.round(n); }
  function diagnostics() {
    const avg = fpsSamples.length ? fpsSamples.reduce((a, b) => a + b, 0) / fpsSamples.length : 0;
    return [`FPS avg: ${avg.toFixed(1)}`, `Load to ready: ${(loadMs / 1000).toFixed(1)}s`, `Render: ${engine.getRenderWidth()}x${engine.getRenderHeight()}  dpr ${window.devicePixelRatio}`,
      `Triangles on screen: ${countTris().toLocaleString()}`, `Babylon ${BABYLON.Engine.Version}`, `Voice clips: ${clipStatus.ok} loaded, ${clipStatus.missing} missing`,
      `Shared child card: ${LRN ? "loaded" : "missing"}`].join("\n");
  }
  function updatePerf(now) {
    const fps = engine.getFps();
    if (isFinite(fps) && fps > 0 && state.mode === "play") { fpsSamples.push(fps); if (fpsSamples.length > 600) fpsSamples.shift(); }
    if (now - lastPerfUpdate < 500 || settings.perf !== "on") return;
    lastPerfUpdate = now;
    $("perf").innerHTML = `<b class="${fps >= 50 ? "good" : fps >= 30 ? "ok" : "bad"}">${fps.toFixed(0)}</b> FPS<br>▲ ${countTris().toLocaleString()}`;
  }

  // ---------- main loop ----------
  const easeOutBack = (k) => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
  scene.onBeforeRenderObservable.add(() => {
    const rdt = Math.min(engine.getDeltaTime() / 1000, 0.05), dt = rdt * motionK(), now = performance.now(); motionMs += dt * 1000;
    const paused = state.mode === "paused";
    if (!paused) state.gameT += dt;
    const T = state.gameT, q = state.q;
    for (const c of skyClouds) { c.position.x += dt * c.speed; if (c.position.x > 24) c.position.x = -24; }
    island.position.y = Math.sin(T * 0.7) * 0.06;   // the island floats gently
    if (!paused) for (const m of moles) {
      if (m.state === "off") continue;
      m.t += dt;
      const k0 = m.t - m.delay;
      if (m.state === "rise") {
        if (k0 < 0) { m.body.position.y = DOWN_Y; continue; }
        if (k0 < dt + 0.001) sfx.pop();
        const k = Math.min(1, k0 / 0.38); m.body.position.y = DOWN_Y * (1 - easeOutBack(k));
        if (k >= 1) { m.state = "up"; m.t = 0; m.upAt = state.gameT; }
      } else if (m.state === "up") {
        m.body.position.y = Math.sin(T * 2.2 + m.ph) * 0.04 * S;
        m.tilt.rotation.z = Math.sin(T * 1.6 + m.ph) * 0.04;
        if (m.hint) { const p = 1 + Math.sin(T * 7) * 0.05; m.tilt.scaling.set(p, p, p); }
      } else if (m.state === "sad") {   // a shake of the head, a droop, then down into the hole
        const k = Math.min(1, m.t / 1.1);
        m.tilt.rotation.z = Math.sin(k * Math.PI * 5) * 0.16 * (1 - k);
        m.body.position.y = k < 0.55 ? -0.1 * S * (k / 0.55) : -0.1 * S + (DOWN_Y + 0.1 * S) * Math.pow((k - 0.55) / 0.45, 2);
        if (k >= 1) { m.state = "off"; m.root.setEnabled(false); }
      } else if (m.state === "bonk") {   // a soft squash (the touch), then down
        const k = Math.min(1, m.t / 0.85);
        const sq = k < 0.25 ? 1 - 0.32 * Math.sin((k / 0.25) * Math.PI / 2) : 0.68 + 0.32 * Math.min(1, (k - 0.25) / 0.2);
        m.tilt.scaling.set(1 + (1 - sq) * 0.6, sq, 1 + (1 - sq) * 0.6);
        m.body.position.y = k < 0.5 ? 0 : DOWN_Y * Math.pow((k - 0.5) / 0.5, 2);
        if (k >= 1) { m.state = "off"; m.root.setEnabled(false); }
      } else if (m.state === "duck") {
        const k = Math.min(1, m.t / 0.32); m.body.position.y = Math.min(m.body.position.y, DOWN_Y * k * k);
        if (k >= 1) { m.state = "off"; m.root.setEnabled(false); }
      }
    }
    // the hint: sparkles around the right mole
    const hm = q && !q.done && moles.find((m) => m.hint && m.state === "up");
    if (hm && !paused) { const p = hm.root.getAbsolutePosition(); sparks.emitter = new BABYLON.Vector3(p.x, p.y + hm.body.position.y, p.z - 0.3 * S); sparks.emitRate = 40; } else sparks.emitRate = 0;
    if (!paused && q && !q.done && state.mode === "play") {
      const outNow = moles.filter((m) => m.state === "rise" || m.state === "up");
      if (q.phase === "rising" && outNow.length && outNow.every((m) => m.state === "up")) {
        q.phase = "up";
        // the question at the first coming up, and every second time the moles come back (levels 2 and 3)
        if (q.cycle === 0 || q.cycle % 2 === 0) whenQuiet(() => { if (state.q === q && !q.done) speakQuestion(q, q.cycle ? 0.92 : 1); });
      }
      if (q.phase === "up" && STAY_MS[lvl()] !== Infinity && q.armed) {
        // levels 2 and 3: all out for 4 / 2.5 s the first time, then one after another (Golan 23.10); the speed slider too
        if (q.rotLeft == null) q.rotLeft = q.stayLeft;
        q.rotLeft -= rdt * 1000 * motionK();
        if (q.rotLeft <= 0) q.rotLeft = rotateStep(q);
      }
      if (q.phase === "up" && !busy()) {
        if (q.firstEnd) {
          const t = clock(), since = (t - q.firstEnd) / 1000, sinceLast = (t - q.lastEnd) / 1000;
          if (q.autoRep < 2 && (q.autoRep === 0 ? since > REPEAT_S : sinceLast > 8)) { q.autoRep++; q.repeats++; q.lastEnd = Infinity; speakQuestion(q, 0.85); }
        }
      }
      if (q.phase === "wait") popMoles(q);   // back from settings in the middle of a "down and up"
    }
    updatePerf(now);
  });
  const renderFrame = () => scene.render();
  engine.runRenderLoop(renderFrame);
  const onScreen = () => { placeGuide(); fitCamera(); };
  if (SCR) SCR.onChange(onScreen); else window.addEventListener("resize", () => { applyQuality(); onScreen(); });
  window.addEventListener("resize", () => setTimeout(onScreen, 50));

  // ---------- start screen ----------
  const fontReady = (document.fonts && document.fonts.load) ? Promise.race([
    Promise.all([document.fonts.load(`800 150px "Noto Sans Hebrew"`, "אבךןץ")]), new Promise((r) => setTimeout(r, 4000))]) : Promise.resolve();
  fontReady.then(() => {
    moles.forEach((m) => drawSign(m, "א", false));   // a texture must be drawn once before the scene counts as ready
    layoutHoles();
    return scene.whenReadyAsync();
  }).then(() => {
    loadMs = performance.now() - T0; onScreen();
    $("go").disabled = false; $("go").textContent = "יוצאים לדרך";
  });
  let heardIntro = false;
  const gl = (id) => { const g = prof() && prof().gender; return g && GENDERED.includes(id) ? id + "_" + g : id; };
  const gt = (pl, m, f) => { const g = prof() && prof().gender; return g === "m" ? m : g === "f" ? f : pl; };
  function sayIntro() { heardIntro = true; say(gl(LINES.intro)); }
  function autoIntro() {
    if (heardIntro || $("start").hidden || !$("settings").hidden || document.querySelector(".fl-ov")) return;
    const a = getClip(gl(LINES.intro)); if (a._bad) return;
    const my = screenTok;
    if (!a._ok) { const again = () => { if (my === screenTok) autoIntro(); }; a.addEventListener("canplaythrough", again, { once: true }); a.addEventListener("error", again, { once: true }); return; }
    if (clipNow) clipNow.pause(); clipNow = a; a.currentTime = 0;
    a.play().then(() => { if (my !== screenTok) { a.pause(); return; } heardIntro = true; }).catch(() => {});
  }
  function genderTexts() {
    $("startText").textContent = gt("מקשיבים לשם של האות, ונוגעים בחפרפרת שמחזיקה אותה", "תקשיב לשם של האות, וגע בחפרפרת שמחזיקה אותה", "תקשיבי לשם של האות, וגעי בחפרפרת שמחזיקה אותה");
    $("startText2").textContent = gt("נוגעים עם האצבע או העכבר", "גע עם האצבע או העכבר", "געי עם האצבע או העכבר");
    $("pickTitle").textContent = gt("בוחרים כדור פורח", "בחר כדור פורח", "בחרי כדור פורח");
  }
  const whoReady = LRN ? LRN.chooseChild() : Promise.resolve();
  whoReady.then(() => { genderTexts(); renderLetters(); layoutHoles(); drawGuide(); }).then(() => later(autoIntro, 1500));
  $("doorStart").addEventListener("click", (e) => {
    e.stopPropagation(); leaveScreen(); $("go").classList.remove("pressed");
    if (LRN && LRN.fromHub && LRN.hubUrl) { location.href = LRN.hubUrl + "#games"; return; }
    if (document.referrer && history.length > 1) { history.back(); return; }
    if (LRN) LRN.chooseChild().then(() => { syncSeg(); if (form) form.refresh(); genderTexts(); layoutHoles(); drawGuide(); }).then(() => { heardIntro = false; later(autoIntro, 1500); });
  });
  $("hear").addEventListener("click", (e) => { e.stopPropagation(); unlockAudio(); sayIntro(); });
  $("start").addEventListener("pointerdown", (e) => { if (document.querySelector(".fl-ov")) return; if (!heardIntro && !e.target.closest("#go, #hear, #gearStart, #doorStart")) { unlockAudio(); sayIntro(); } });
  $("go").addEventListener("click", () => {
    hush(); unlockAudio();
    try { if (document.documentElement.requestFullscreen && matchMedia("(pointer: coarse)").matches) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    if ($("go").classList.contains("pressed")) return;
    $("go").classList.add("pressed"); sfx.tap(); tone([523, 784], 0.12, "triangle", 0.35);
    leaveScreen(); say(LINES.go);
    later(() => { $("go").classList.remove("pressed"); $("start").hidden = true; openPick(); }, 1600);
  });
  function playAgain() { hush(); $("end").hidden = true; $("hud").hidden = true; openPick(); }
  // ---------- balloon picker: the same 9 balloons, voice and reminder as every game; the companion rides in it ----------
  const PICK_STEP = 420;
  let pickNagT = 0, pickFlashTs = [], picking = false, pickSaid = 0;
  function openPick() {
    if (starCount) starCount.reset();
    const box = $("balloons"); box.textContent = "";
    BALLOONS.forEach((d, i) => {
      const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "כדור " + (i + 1)); b.innerHTML = balloonSvg(i);
      b.addEventListener("click", () => pickBalloon(i)); box.append(b);
    });
    $("balloonPick").hidden = false; clearTimeout(pickNagT); pickSaid = 0;
    later(() => { if (!$("balloonPick").hidden && !picking) { say(gl(LINES.pick)); pickSaid++; setTimeout(() => whenQuiet(pickNag), 300); } }, 700);
  }
  function stopPickFlash() { clearTimeout(pickNagT); pickFlashTs.forEach(clearTimeout); pickFlashTs = []; [...$("balloons").children].forEach((b) => b.classList.remove("flash")); }
  function pickNag() {
    clearTimeout(pickNagT);
    pickNagT = setTimeout(() => {
      if ($("balloonPick").hidden || picking) return;
      if (pickSaid < 2) { say(gl(LINES.pick)); pickSaid++; }
      const btns = shuffle([...$("balloons").children]);
      btns.forEach((b, i) => pickFlashTs.push(setTimeout(() => { b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); }, i * PICK_STEP)));
      pickFlashTs.push(setTimeout(() => whenQuiet(pickNag), btns.length * PICK_STEP + 1000));
    }, 4000);
  }
  function pickBalloon(i) {
    if (picking) return; picking = true; stopPickFlash(); const pickedAt = performance.now();
    settings.balloon = i; saveSettings();
    [...$("balloons").children].forEach((b, k) => { b.setAttribute("aria-pressed", String(k === i)); b.classList.toggle("chosen", k === i); });
    say(Math.random() < 0.5 ? LINES.choice1 : LINES.choice2);
    whenQuiet(() => setTimeout(() => { picking = false; if ($("balloonPick").hidden) return; $("balloonPick").hidden = true; $("hud").hidden = false; countdown(); }, Math.max(250, 1900 - (performance.now() - pickedAt))));
  }

  // ---------- 3, 2, 1, then the first moles come up ----------
  let countToken = 0;
  function countdown() {
    const my = ++countToken;
    state.mode = "ready"; state.q = null;
    moles.forEach((m) => { m.state = "off"; m.root.setEnabled(false); });
    layoutHoles(); setSign("?", false); onScreen();
    const box = $("count");
    [0, 1, 2].forEach((i) => setTimeout(() => {
      if (my !== countToken || state.mode !== "ready") return;
      box.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = String(3 - i); sp.style.background = "#10b947"; box.append(sp);
      tone([i === 2 ? 660 : 520], 0.16, "sine", 0.35);
    }, 700 + i * 1000));
    setTimeout(() => {
      if (my !== countToken || state.mode !== "ready") return;
      box.innerHTML = ""; tone([880, 1175], 0.14, "triangle", 0.4);
      startRound();
    }, 700 + 3 * 1000);
  }

  // ---------- door = back to the start screen (or the hub), from every screen ----------
  function backToStart() {
    flushPartial(); leaveScreen(); $("go").classList.remove("pressed");
    if (pausedFrom !== null) resumeGame();
    stopPickFlash(); picking = false;
    state.q = null; state.mode = "intro"; if (starCount) starCount.reset(); if (HG) HG.stop();
    countToken++; $("count").innerHTML = "";
    moles.forEach((m) => { m.state = "off"; m.root.setEnabled(false); }); sparks.emitRate = 0;
    ["hud", "end", "balloonPick", "settings", "paused"].forEach((id) => ($(id).hidden = true));
    $("start").hidden = false;
  }
  function toHub() { if (!(LRN && LRN.fromHub && LRN.hubUrl)) return false; flushPartial(); leaveScreen(); countToken++; if (HG) HG.stop(); location.href = LRN.hubUrl + "#games"; return true; }
  ["doorGame", "doorPick", "doorEnd", "doorPause"].forEach((id) => $(id).addEventListener("click", () => { if (!toHub()) backToStart(); }));

  // test hook for automated checks (games/tests/check-games.js): targets() = where the right and wrong moles are on the screen
  window.__mole = { state, moles, holes, answer, endRound, askNext, layoutHoles, screenOf, fitCamera, engine, scene, cam, canvas, hg: HG, lvl,
    region: () => fitInfo,
    targets: () => { const q = state.q; if (state.mode !== "play" || !q || q.done) return null;
      const up = moles.filter((m) => m.state === "up"), r = canvas.getBoundingClientRect(), at = (m) => { const s = screenOf(m); return { x: r.left + s.x, y: r.top + s.y, letter: m.letter }; };
      return { right: up.filter((m) => m.letter === q.letter).map(at), wrong: up.filter((m) => m.letter !== q.letter).map(at) }; } };
})();
</script>
