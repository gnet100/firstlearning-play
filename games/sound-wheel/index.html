<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>גלגל הצלילים</title>
<link rel="stylesheet" href="../shared/fonts/fonts.css">   <!-- local font, no internet needed (screens standard ס8) -->
<style>
    /* no size jump on refresh: the start panel waits for FL.screen (screen.js adds .fl-ready), at most 3 s (Golan 23.10) */
    html:not(.fl-ready) #start > * { visibility: hidden; animation: flShow 0s 3s forwards; }
    @keyframes flShow { to { visibility: visible; } }
  /* Same look, buttons and sizes as the car and gates game (voice/race-gates-voice), so the child feels it is one game. */
  :root {
    --sky: #bfe6ff;
    --ink: #1d2a3a;
    --card: #ffffffee;
    --accent: #ff8a3d;
    --accent-ink: #ffffff;
    --good: #2bb673;
    --muted: #5b6b7f;
  }
  /* single deliberate look (daylight world): same colours in light and dark */
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--sky);
    font-family: "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  /* "איך משחקים?" in the game (Golan 29.10): a card with a question mark, bottom left */
  #helpCard { position: fixed; left: var(--edge-l, 12px); bottom: var(--edge-b, 12px); width: max(calc(58 * var(--u, 1px)), 46px); aspect-ratio: 3 / 4; border-radius: 18%;
    border: 3px solid #7c5cff; background: linear-gradient(#ffffff, #efeaff); box-shadow: 0 4px 0 #5a3fd1, 0 6px 14px #0003; color: #5a3fd1; cursor: pointer; padding: 0;
    font: 900 max(calc(38 * var(--u, 1px)), 30px) "Noto Sans Hebrew", system-ui, sans-serif; display: grid; place-items: center; z-index: 8; }
  #helpCard:active { transform: translateY(3px); box-shadow: 0 1px 0 #5a3fd1; }
  #demoStart { display: none; }   /* the card in the game replaces the button in the start window */
  .hud[hidden] { display: none; }

  .prompt {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 20px;
    background: var(--card); border-radius: 999px; box-shadow: 0 4px 16px #0002;
  }
  .prompt .label { display: none; }   /* no instruction text, only the letter, centred in a longer bar (as in the car and train games, Golan 15.10) */
  .prompt { min-width: 250px; min-height: 64px; }
  .prompt #replay { margin-inline-start: auto; position: relative; z-index: 1; }   /* the speaker stays at the end of the bar */
  .prompt .target { font-size: 56px; font-weight: 800; line-height: 1; text-align: center;
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .prompt .target:empty { display: none; }
  .round-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: 30px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 #c45f1d;
  }
  .round-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c45f1d; }

  .stars {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px;
    background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 26px; font-weight: 800;
    box-shadow: 0 4px 16px #0002;
  }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; background: #0002; }
  .dots span.done { background: var(--good); }
  .dots-wrap {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 88px); left: 50%; transform: translateX(-50%);
    pointer-events: none;
  }

  .gear {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink);
    box-shadow: 0 4px 16px #0002;
  }
  /* buttons in a column at the top left: door, settings (as in the car game; no pause button, Golan 16.10) */
  .hud .gear, .overlay-gear { top: calc(max(12px, env(safe-area-inset-top)) + 76px); }
  /* settings gear on every screen, a bigger, darker grey icon (Golan, 15.10) */
  .gear-ico { width: 1.45em; height: 1.45em; display: block; color: #5b6573; }
  .overlay-gear { position: absolute; left: 16px; z-index: 30; }
  .start-gear { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; }
  /* exit door, ajar, opening toward the left edge; "יציאה" tip on mouse hover (as in the car game, Golan 15.10) */
  .door-ico { width: 1em; height: 1em; display: block; }
  .door-btn { z-index: 30; }
  .door-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #2b2f3a; color: #fff; font: 700 18px "Noto Sans Hebrew", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease .25s; }
  @media (hover: hover) { .door-btn:hover::after { opacity: 1; } }
  .door-btn { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink); box-shadow: 0 4px 16px #0002; font-size: 40px; }
  /* balloon picker (instead of the car picker) */
  .cars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .cars button { border: 3px solid #d5dde6; border-radius: 18px; background: #eaf6ff; padding: 4px; cursor: pointer; aspect-ratio: 1; }
  .cars button svg { width: 100%; height: 100%; display: block; }
  .cars button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .cars button:active { transform: scale(.96); }
  .cars button.flash { animation: carFlash 1s ease-in-out; }   /* slower highlight (Golan, 16.10) */
  /* the chosen balloon grows at once, slowly, while the praise plays (as in the car game, Golan 15.10; slower 16.10) */
  #balloons button.chosen { position: relative; z-index: 2; transform: scale(1.3); border-color: var(--accent); background: #fff3ea;
    transition: transform 1.8s ease-out, box-shadow 1.8s ease-out; box-shadow: 0 8px 24px #0003; }
  @keyframes carFlash { 50% { transform: scale(1.18); border-color: #ffb27a; } }
  /* green continue button with space before the arrow (as in the car game, Golan 15.10) */

  .perf {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 4px); left: 92px;
    direction: ltr; text-align: left; font: 600 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
    background: #000a; color: #fff; padding: 5px 9px; border-radius: 10px; pointer-events: none;
  }
  .perf b { font-size: 18px; }
  .perf .bad { color: #ff8080; } .perf .ok { color: #ffd166; } .perf .good { color: #7dffb0; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; background: #bfe6ffcc; padding: 16px; z-index: 20;   /* above the picture card and the balls (Golan 29.10: the donkey covered the settings) */
  }
  .overlay[hidden] { display: none; }
  /* X in the top-right corner of settings (Golan 16.10, all games): stays in view while the panel scrolls; the scroll bar is on the left (RTL) */
  .settings { --xs: max(var(--tap-s, 48px), calc(56 * var(--u, 1px))); }
  .x-close { position: sticky; top: 0; z-index: 3; display: block; margin: 0 0 calc(-1 * var(--xs)) auto; margin-inline: 0 auto;
    width: var(--xs); height: var(--xs); border: 0; border-radius: 50%; background: #eef2f7; color: #2b2f3a;
    font: 800 calc(var(--xs) * .5) system-ui, sans-serif; line-height: 1; cursor: pointer; box-shadow: 0 2px 6px #0002; }
  .x-close:active { transform: scale(.94); }
  .panel {
    background: #fff; border-radius: 28px; padding: 28px 24px; max-width: 520px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px #0003;
  }
  .panel h1 { margin: 0 0 8px; font-size: 34px; }
  .panel p { margin: 6px 0 18px; font-size: 19px; color: var(--muted); }
  .swap-ask { background: #fff3ea; border-radius: 20px; padding: 10px 12px 14px; margin: 0 0 16px; }
  .swap-ask p { color: var(--ink); font-weight: 800; font-size: 24px; margin: 4px 0 10px; }
  .big-btn.small { font-size: 22px; padding: 10px 26px; min-height: 56px; }
  .big-btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #d5dde6; border: 2px solid #d5dde6; }
  .big-btn {
    border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
    font: 800 30px "Noto Sans Hebrew", system-ui, sans-serif; padding: 18px 44px; min-height: 76px;
    box-shadow: 0 5px 0 #c45f1d;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c45f1d; }
  .big-btn:disabled { opacity: .6; }
  .start-row { display: flex; gap: 14px; justify-content: center; align-items: center; }
  #start .start-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; margin: 0 -12px; }
  #start #go { grid-column: 2; white-space: nowrap; } #start #hear { grid-column: 3; justify-self: end; }
  .spk { padding: 0; width: 84px; min-width: 84px; height: 84px; font-size: 42px; }
  #start #hear { width: 64px; min-width: 64px; height: 64px; min-height: 0; font-size: 30px; }
  .go-btn { background: #34b36b; box-shadow: 0 5px 0 #1f8048; }
  #closeSettings { background: #34b36b; box-shadow: 0 5px 0 #1f8048; } #closeSettings:active { box-shadow: 0 2px 0 #1f8048; }   /* Golan 22.10: back to the game = starts it again, green */
  .go-btn:active { box-shadow: 0 2px 0 #1f8048; }
  .go-btn.pressed { animation: goPress .9s ease-in-out; box-shadow: 0 0 0 6px #34b36b33, 0 3px 0 #1f8048; }
  @keyframes goPress { 0% { transform: scale(1); } 45% { transform: scale(.95); } 100% { transform: scale(1); } }
  @media (hover: hover) and (pointer: fine) {
    .big-btn, .round-btn, .cars button, .seg button, .letters:not(.shared) button { transition: transform .15s ease, filter .15s ease; }
    .big-btn:hover, .round-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .cars button:hover, .seg button:hover, .letters:not(.shared) button:hover:not(:disabled) { transform: translateY(-2px); border-color: #ffb27a; }
    #magic svg { cursor: pointer; }
  }

  .settings { text-align: right; }
  .settings h2 { margin: 0 0 12px; font-size: 26px; text-align: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
  .seg { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; max-width: 100%; }
  .row { flex-wrap: wrap; row-gap: 8px; justify-content: flex-start; }
  .row > span:first-child { flex-basis: 100%; font-weight: 700; }   /* Golan 16.10: title on its own first line, then the options, then the explanation */
  /* settings rows (Golan 16.10, all games): title on the right of the buttons (or above them if they do not fit), the explanation on its own full line below */
  .row-note { flex-basis: 100%; display: block; font-size: 14px; line-height: 1.45; color: var(--muted); font-weight: 400; }
  .row.stack { flex-wrap: wrap; }
  .row.stack .seg { flex-shrink: 1; flex-wrap: wrap; }
  /* settings = a fixed header (X + title) over a scrolling body, as in the detective game (screens standard 4א) */
  .settings { max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
  .set-head { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .set-head .x-close { position: static; margin: 0; flex: 0 0 auto; }
  .settings .set-head h2 { flex: 1 1 auto; margin: 0; padding-inline: 0 calc(var(--xs) + 6px); }   /* the title stays centred on the window */
  .set-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  html[data-screen~="phone"] .settings .set-head h2 { padding-inline-end: 0; font-size: 22px; }   /* a narrow phone: the title keeps one line */
  .seg button {
    min-width: 76px; min-height: 52px; border-radius: 14px; border: 2px solid #d5dde6; background: #fff;
    font: 700 17px "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters-row { align-items: flex-start; }
  .letters-row > span { display: flex; flex-direction: column; gap: 4px; }
  .letters-row small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .letters.shared, #parentTable { display: block; max-width: none; width: 100%; }   /* both tables the same width, so they look the same */
  .letters { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 372px; margin: 0; }   /* Golan 16.10: 3 rows of 8 (tiles the size of the parent table) on every screen, like the parent table */
  .letters:not(.shared) button { width: auto; height: auto; aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 8px; border: 2px solid #d5dde6; background: #fff; cursor: pointer;
    font: 800 clamp(16px,3.2vw,24px) "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); }
  .letters:not(.shared) button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters:not(.shared) button:disabled { opacity: .3; cursor: default; }
  #parentTable { margin: 6px 0 8px; }
  .diag { direction: ltr; text-align: left; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  /* 3-2-1 countdown, as in the car game */
  .count { position: absolute; left: 50%; top: 42%; width: 0; height: 0; pointer-events: none; z-index: 40; }
  .count span { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
    display: grid; place-items: center; font-size: 110px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0003;
    box-shadow: 0 0 0 4px #3dff7f88, 0 0 24px #3dff7f, 0 0 54px #00e05a, 0 8px 30px #0003; animation: countPop .95s ease-out forwards; }
  @keyframes countPop { 0% { transform: scale(.4); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

  .toast {
    position: absolute; top: 20%; left: 80%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    font-size: 64px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0004, 0 0 24px #0003;
    transition: transform .25s ease, opacity .25s ease; pointer-events: none; white-space: nowrap; z-index: 3;
  }
  .fin-mark { color: #E8435A; }   /* the final letter at the end of the word */
  .prompt .target.pulse { animation: pulse .6s ease-in-out 2; }
  @keyframes pulse { 50% { transform: scale(1.35); color: var(--accent); } }
  .toast.good { font-size: 52px; color: #10b947; text-shadow: 0 0 6px #fff, 0 0 18px #3dff7f, 0 0 36px #00e05a, 0 3px 0 #0a7a35; }
  .toast .chk { display: inline-block; font-size: 80px; line-height: 1; vertical-align: -0.12em; filter: drop-shadow(0 0 8px #3dff7f) drop-shadow(0 3px 0 #0a7a35); }
  @keyframes starPop { to { transform: scale(1); } }
  .toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  /* "יש נכון" sits centred just above the winning letter, follows it, and is a little smaller (as in the car game, Golan 15.10) */
  .toast.pinned { transform: translate(-50%, -100%) scale(.6); transform-origin: 50% 100%; }
  .toast.pinned.show { transform: translate(-50%, -100%) scale(1); }
  .toast.good.pinned { font-size: 40px; }
  .toast.pinned .chk { font-size: 60px; }
  /* Golan 18.10 (all games, as in the car game): no "יש נכון" on screen, only the earned star (gold or silver), centred on the
     top-left corner of the right letter's sign, half on it and half outside; its size follows the sign (set in placeToast) */
  .toast.corner { transform: translate(-50%, -50%) scale(.6); transform-origin: 50% 50%; line-height: 0; }
  .toast.corner.show { transform: translate(-50%, -50%) scale(1); }
  .toast.corner .chk { display: block; vertical-align: 0; filter: drop-shadow(0 3px 4px #0005); }

  /* The magic picture: the object the letter wakes up from (first and last step of every round) */
  #magic { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: min(72vw, 54vh, 520px); aspect-ratio: 1; pointer-events: auto; }
  #magic[hidden] { display: none; }
  #magic .cloud { position: absolute; inset: -6%; border-radius: 46% 54% 48% 52% / 52% 46% 54% 48%; background: radial-gradient(circle at 50% 40%, #ffffff 0%, #ffffffee 55%, #ffffff00 72%); }
  #magic svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible; }
  /* the letter beside the picture (Golan 18.10): a white sign like the ones on the clouds; on the right (the balloon waits on the left) */
  #mCard { position: absolute; left: 103%; top: 50%; width: 50%; aspect-ratio: 3 / 2; transform: translateY(-50%); container-type: inline-size; cursor: pointer; pointer-events: auto;
    transition: left .7s ease-in-out, bottom .7s ease-in-out, width .7s ease-in-out; }
  /* Golan 19.10: first the letter alone, big, in the middle of the white circle; after the touch it moves aside for the picture */
  #magic.solo #mCard { left: 20%; width: 60%; }
  #mCard[hidden] { display: none; }
  /* Golan 20.10: on "גְּעוּ בָּאוֹת" the letter sleeps (breathing) and wakes up when touched (letters-animated/, its own thread) */
  #mAnim { position: absolute; left: 14%; top: 50%; width: 72%; aspect-ratio: 1; translate: 0 -50%;   /* translate, not transform: cardIn animates transform (Golan 20.10: centred in the white circle) */
    cursor: pointer; pointer-events: auto; box-sizing: border-box;
    background: #fff; border: 2.6cqw solid #7C5CFF; border-radius: 9cqw; box-shadow: 0 1.5cqw 4cqw #0003; overflow: hidden; animation: cardIn .6s ease-out both; }
  #mAnim[hidden] { display: none; }
  #mAnim svg { width: 100%; height: 100%; display: block; }
  #mFace { position: absolute; inset: 0; box-sizing: border-box; background: #fff; border: 4.5cqw solid #7C5CFF; border-radius: 11cqw; display: grid; place-items: center; box-shadow: 0 1.5cqw 4cqw #0003; }
  #mCardL { font: 800 52cqw/1 "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif; color: #1d2a3a; transform: translateY(-6%); }
  /* the writing line under the letter, as on the other games' signs (Golan 19.10) */
  #mFace::after { content: ""; position: absolute; left: 18%; right: 18%; top: 80%; height: max(2px, 1.1cqw); border-radius: 1cqw; background: rgba(120, 160, 205, .55); }
  /* the picture's word under it, the letter in it strongly marked; it grows a few times (Golan 19.10) */
  #magic { container-type: inline-size; }
  #mWord { position: absolute; left: 50%; top: 88%; translate: -50% 0; white-space: nowrap; direction: rtl; font: 800 max(28px, 13.5cqw)/1.25 "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif; color: #1d2a3a;
    background: #ffffffd9; border-radius: 0.4em; padding: 0.02em 0.35em 0.08em; box-shadow: 0 2px 10px #0002; animation: cardIn .45s ease-out both; }
  #mWord[hidden] { display: none; }
  #mWord .hit { display: inline-block; color: #FF5A1F; text-shadow: 0 0 0.12em #FFD54F; }
  #mWord .hit.grow { animation: hitGrow 4s ease-in-out both;   /* Golan 19.10: slower */ transform-origin: 50% 70%; }
  @keyframes hitGrow { 0%, 100% { transform: scale(1); } 15%, 48%, 81% { transform: scale(1.55); } 31%, 64% { transform: scale(1.1); } }
  #magicSvg.in { animation: cardIn .55s cubic-bezier(.3, 1.4, .5, 1) both; }
  #mFace.in { animation: cardIn .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes cardIn { 0% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  /* touching the letter: it flashes and grows for a moment; then the picture flashes and grows a little (Golan 18.10) */
  #mFace.flash { animation: cardFlash 2.4s ease-in-out both; }   /* Golan 19.10: slower */
  @keyframes cardFlash { 0%, 100% { transform: scale(1); border-color: #7C5CFF; }
    15%, 45%, 75% { border-color: #FFC400; box-shadow: 0 0 0 3cqw #FFC40088, 0 1.5cqw 4cqw #0003; }
    30%, 60% { border-color: #7C5CFF; box-shadow: 0 1.5cqw 4cqw #0003; } 40% { transform: scale(1.32); } }
  #magicSvg.tap { animation: picTap .35s ease-out; }
  @keyframes picTap { 50% { transform: scale(.95); } }
  #magicSvg.flash { animation: picFlash 1.4s ease-in-out both; }
  @keyframes picFlash { 0%, 100% { transform: scale(1); filter: none; } 15%, 50%, 85% { filter: brightness(1.22) drop-shadow(0 0 18px #FFD54F); } 32%, 68% { filter: none; } 45% { transform: scale(1.13); } }

  /* ===== screens standard (screens/screens-standard.md): every size and place from FL.screen variables =====
     --u = one pixel of a 1280x720 board (720x1280 standing); --tap-s / --tap / --tap-play / --gap = finger floors in mm;
     --edge-* = safe area or 12 design px. No width breakpoints: only standing (portrait) or lying (landscape). */
  html[data-screen] {
    --s: max(calc(72 * var(--u)), var(--tap-s));      /* door, settings */
    --b: max(calc(84 * var(--u)), var(--tap));        /* the child's main buttons: the speakers */
    --g: max(calc(14 * var(--u)), var(--gap));        /* space between buttons */
  }
  html[data-screen] .round-btn { width: var(--s); height: var(--s); font-size: calc(var(--s) * .45); }
  html[data-screen] .door-btn { font-size: calc(var(--s) * .6); }
  html[data-screen] .door-btn, html[data-screen] .start-gear { top: var(--edge-t); left: var(--edge-l); }
  html[data-screen] .hud .gear, html[data-screen] .overlay-gear { top: calc(var(--edge-t) + var(--s) + var(--g)); left: var(--edge-l); }
  /* top letter pill = the detective standard (Golan 16.10, all games; detective/letter-pill-spec.md "FIXED SIZE"): white pill, letter on the right,

<script>
(() => {
  "use strict";
  // גלגל הצלילים (Golan 29.10): the rules are in /mnt/project-files/summaries/sound-wheel-spec.md.
  // The other way round from "בלש הצלילים": the child spins a wheel of pictures, stops it, and touches the ball with the sound the
  // picture's word opens with. The shell (start, balloon picker, 3-2-1, hourglass, settings, end window, voice) is the memory game's;
  // the sound skill, the sounds, the "two mistakes" rules and the demo are the sound detective's.
  const $ = (id) => document.getElementById(id);
  const GAME = "wheel";

  // ---------- settings (kept per device, wrapped because storage can be blocked) ----------
  const settings = { voice: "on", letters: [], balloon: null, script: "auto", topic: "animals" };
  try { Object.assign(settings, JSON.parse(localStorage.getItem("fl-wheel-settings") || "{}")); } catch (e) {}
  settings.lettersMode = "auto";   // every page load starts in "החלטת מערכת" (Golan 16.10, all games)
  const saveSettings = () => { try { localStorage.setItem("fl-wheel-settings", JSON.stringify(settings)); } catch (e) {} };

  const LRN = (window.FL && window.FL.learner) || null;
  const kid = () => (LRN ? LRN.profile() : null);
  const gt = (pl, m, f) => { const g = kid() && kid().gender; return g === "m" ? m : g === "f" ? f : pl; };
  function genderTexts() {
    $("startText").textContent = gt("מסובבים את הגלגל ועוצרים", "סובב את הגלגל ועצור", "סובבי את הגלגל ועצרי");
    $("startText2").textContent = gt("ואז נוגעים בצליל שהתמונה מתחילה בו", "ואז גע בצליל שהתמונה מתחילה בו", "ואז געי בצליל שהתמונה מתחילה בו");
    $("pickTitle").textContent = gt("בוחרים כדור פורח", "בחר כדור פורח", "בחרי כדור פורח");
    $("topicTitle").textContent = gt("בּוֹחֲרִים גַּלְגַּל", "בְּחַר גַּלְגַּל", "בַּחֲרִי גַּלְגַּל")   /* nikud: Golan 29.10 */;
  }

  // ---------- content (spec 7): words that open with kamatz, patah or hataf patah; the sounds of the sound detective ----------
  // transport and toys: their own drawings with their own wake-up motion (wheel-pictures.js, Golan 29.10); shown as a live svg, not an image
  const WP = window.WHEEL_PICTURES || null;
  const PICS = Object.assign({}, window.PICTURES || {}, WP ? WP.pics : {}), PA = window.PICTURES_ANIMATED || null;
  const SOUNDS = { "ב": { syl: "בַּ", s: "syl_ba" }, "ג": { syl: "גָּ", s: "syl_ga" }, "נ": { syl: "נָ", s: "syl_na" },
    "ט": { syl: "טַ", s: "syl_ta_tet" }, "י": { syl: "יַ", s: "syl_ya" }, "כ": { syl: "כַּ", s: "syl_ka" },
    "א": { syl: "אַ", s: "syl_a" }, "ח": { syl: "חָ", s: "syl_cha" },
    "צ": { syl: "צָ", s: "syl_tsa" }, "ר": { syl: "רָ", s: "syl_ra" }, "ת": { syl: "תָּ", s: "syl_ta" },
    "מ": { syl: "מַ", s: "syl_ma" }, "ע": { syl: "עַ", s: "syl_a_ayin" }, "פ": { syl: "פַּ", s: "syl_pa" } };   // מ ע פ for transport and toys (29.10)
  // the topics: a picture key (pictures.js / sound-pictures.js / wheel-pictures.js) and the sound its word opens with
  const TOPICS = [
    { id: "animals", name: "חַיּוֹת", clip: "sw_cat_animals", pics: [["camel", "ג"], ["נ", "נ"], ["ט", "ט"], ["י", "י"], ["א", "א"], ["ח", "ח"], ["צ", "צ"],
      ["tiger", "נ"], ["rabbit", "א"], ["donkey", "ח"], ["rooster", "ת"], ["crocodile", "ת"]] },
    { id: "transport", name: "תַּחְבּוּרָה", clip: "sw_cat_transport", pics: [["ר", "ר"], ["plane", "מ"], ["helicopter", "מ"], ["truck", "מ"], ["fireTruck", "כ"], ["ambulance", "א"], ["spaceship", "ח"]] },
    { id: "toys", name: "צַעֲצוּעִים", clip: "sw_cat_toys", pics: [["כ", "כ"], ["ן", "ב"], ["rattle", "ר"],
      ["swing", "נ"], ["slide", "מ"], ["kite", "ע"], ["trumpet", "ח"], ["mask", "מ"], ["puzzle", "פ"]] },
  ];
  const topic = () => TOPICS.find((t) => t.id === settings.topic && !t.soon) || TOPICS[0];
  const soundOf = (k) => (topic().pics.find((p) => p[0] === k) || [])[1];
  const ALIKE = [["ט", "ת"], ["כ", "ק"], ["א", "ע", "ה"], ["ח", "כ"], ["ס", "ש"], ["ב", "ו"]];
  const alike = (a, b) => ALIKE.some((g) => g.includes(a) && g.includes(b));
  const SOUND_L = Object.keys(SOUNDS);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const lvl = () => (LRN ? Math.min(3, Math.max(1, LRN.level() || 1)) : 1);
  const ballCount = () => [3, 4, 5][lvl() - 1] || 4;   // spec 6: 3, 4, 5 balls (as the sound detective, Golan 29.10)
  const saySounds = () => lvl() < 3;
  const cardOf = (l) => { try { return (LRN && LRN.card && LRN.card(l)) || null; } catch (e) { return null; } };
  const soundKnown = (l) => { const c = cardOf(l); return !!(c && c.sound && c.sound.state === "known"); };
  if (LRN && LRN.setGame) LRN.setGame(GAME, { autoCount: () => SOUND_L.length });
  function chosenLetters() { return settings.lettersMode === "auto" ? [] : [...new Set(settings.letters || [])].filter((l) => SOUND_L.includes(l)); }
  // spec 2: before every spin the system puts on the wheel only pictures it wants practised: first the sounds of letters the child
  // knows in print ("מזהה בביטחון"), the letters of the child's name among them; varied; a picture is the answer once a round.
  function wheelPics() {
    const all = topic().pics, mine = chosenLetters(), name = (kid() && kid().name) || "";
    const want = (l) => { const c = cardOf(l); return (c && c.recognize && c.recognize.state === "known") || name.includes(l); };
    let pool = all.filter(([k, l]) => !state.usedRound.has(k) && (mine.length ? mine.includes(l) : true));
    if (pool.length < 3) { state.usedRound.clear(); pool = all.filter(([k, l]) => (mine.length ? mine.includes(l) : true)); }
    if (pool.length < 3) pool = all.slice();
    const first = pool.filter(([, l]) => want(l)), rest = pool.filter(([, l]) => !want(l));
    // the wanted ones, with a few others so the wheel always has a choice; a sound not yet known a little more often
    const pick = shuffle(first.slice()).concat(shuffle(rest).slice(0, Math.max(3, 6 - first.length)));
    pick.sort((a, b) => (soundKnown(a[1]) ? 1 : 0) - (soundKnown(b[1]) ? 1 : 0) + (Math.random() - 0.5));
    // at least 6 tiles on the drum; when there are fewer pictures they come round again in the same order, never side by side
    const uniq = shuffle(pick.slice(0, 8).map((p) => p[0])), out = [];
    while (out.length < Math.max(6, uniq.length)) out.push(uniq[out.length % uniq.length]);
    return out;
  }
  // the balls of one question: the right sound and others, never two that sound alike (spec 3)
  function makeBalls(t) {
    const n = ballCount();
    const others = shuffle(SOUND_L.filter((l) => l !== t && !alike(l, t))).reduce((a, l) => (a.length < n - 1 && !a.some((x) => alike(x, l)) ? a.concat(l) : a), []);
    // a new order every question, but the right sound is never the first ball (Golan 29.10)
    const out = shuffle([t, ...others]);
    if (out[0] === t && out.length > 1) { const j = 1 + Math.floor(Math.random() * (out.length - 1)); [out[0], out[j]] = [out[j], out[0]]; }
    return out;
  }
  // cursive (כתב יד) on a ball: by "סוג כתב", only for a letter whose cursive form is open (spec 6)
  function cursiveFor(l) {
    if (!(LRN && LRN.cursiveReady && LRN.cursiveReady(l))) return false;
    const m = settings.script || "auto";
    if (m === "print") return false; if (m === "cursive") return true; if (m === "mixed") return Math.random() < 0.5;
    return false;   // Golan 29.10: in the sound games the system choice is print only, no cursive mix
  }
  try { document.fonts.load('400 100px "FL Cursive"', "אב"); } catch (e) {}

  // ---------- audio: Hila's clips from the shared bank (voice/audio); a missing clip stays silent, never a browser voice ----------
  let actx = null;
  function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }
  function tone(freqs, dur = 0.14, type = "triangle", vol = 0.18) {
    if (!actx) return;
    let t = actx.currentTime;
    for (const f of freqs) {

    pausedClip = null; heldLine = null;
  }

  // ---------- doors ----------
  function toHub() {
    if (!LRN || !LRN.fromHub || !LRN.hubUrl) return false;
    flushPartial(); epoch++; cancelIntro(); stopVoice(); countToken++; paused = true; if (HG) HG.stop();
    location.href = LRN.hubUrl.split("#")[0] + "#games";
    return true;
  }
  function backToStart() {
    flushPartial(); epoch++; cancelIntro(); stopVoice(); if (HG) HG.stop(); hideHand(); clearTimeout(idleT); clearNudge();
    if (paused) resumeCore();
    state.mode = "intro"; state.q = null; state.spinning = false; countToken++; $("count").innerHTML = ""; $("fx").innerHTML = "";
    ["hud", "end", "pick", "topics", "settings", "wheel", "star", "balls", "spinRow", "okMark"].forEach((id) => ($(id).hidden = true));
    $("start").hidden = false;
  }
  const backToPick = () => { backToStart(); $("start").hidden = true; openPick(); };   // the restart button: the picker again
  ["doorGame", "doorPick", "doorTopics", "doorEnd"].forEach((id) => $(id).addEventListener("click", (e) => { e.stopPropagation(); if (!toHub()) backToStart(); }));   // the door always leaves to the island's game list (Golan 28.10)
  if (window.FL && FL.screen && FL.screen.restartButton) FL.screen.restartButton(backToPick);
  $("doorStart").addEventListener("click", (e) => {
    e.stopPropagation(); cancelIntro(); stopVoice(); if (!LRN || toHub()) return;
    choosingKid = true;
    LRN.chooseChild().then(() => { choosingKid = false; genderTexts(); if (form) form.refresh(); heardIntro = false; scheduleIntro(); });
  });
  function outsideTap(el, inside, close) {
    let downOut = false;
    el.addEventListener("pointerdown", (e) => { downOut = !e.target.closest(inside) && !e.target.closest(".round-btn"); });
    el.addEventListener("click", (e) => { if (downOut && !e.target.closest(inside) && !e.target.closest(".round-btn")) close(); downOut = false; });
  }
  outsideTap($("settings"), ".panel", () => closeSettings());

  // ---------- start screen ----------
  let heardIntro = false, introTok = 0, choosingKid = false;
  const cancelIntro = () => { introTok++; };
  function sayIntro() { heardIntro = true; say("sw_start"); }
  function scheduleIntro() { const t = ++introTok; setTimeout(() => { if (t !== introTok || choosingKid || heardIntro || $("start").hidden || !$("settings").hidden) return; const a = getClip(voiceId("sw_start")); if (a._bad) { heardIntro = true; return; } sayIntro(); }, 1500); }
  const fontReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load(`800 170px "Noto Sans Hebrew"`, "בגד"), new Promise((r) => setTimeout(r, 3000))]).catch(() => {}) : Promise.resolve();
  fontReady.then(() => { $("go").disabled = false; $("go").textContent = "יוצאים לדרך"; });
  (LRN ? LRN.chooseChild() : Promise.resolve()).then(() => { genderTexts(); scheduleIntro(); });
  $("hear").addEventListener("click", (e) => { e.stopPropagation(); unlockAudio(); sayIntro(); });
  $("go").addEventListener("click", () => {
    cancelIntro(); stopVoice(); unlockAudio();
    try { if (document.documentElement.requestFullscreen && matchMedia("(pointer: coarse)").matches) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    if ($("go").classList.contains("pressed")) return;
    $("go").classList.add("pressed"); tone([523, 784], 0.12, "triangle", 0.35);
    say("fb_go");
    setTimeout(() => { $("go").classList.remove("pressed"); $("start").hidden = true; openPick(); }, 1600);
  });

  // ---------- balloon picker (as in every game) ----------
  const PICK_STEP = 420;
  let pickNagT = 0, pickFlashTs = [], picking = false, pickSays = 0;
  // Golan 29.10: no balloon to choose in this game; the start goes straight to "בחר גלגל"
  function openPick() { openTopics(); }
  function openBalloons() {
    state.mode = "pick";
    const box = $("balloons"); box.textContent = "";
    BALLOONS.forEach((d, i) => {
      const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-pressed", "false"); b.setAttribute("aria-label", "כדור " + (i + 1));
      b.innerHTML = balloonSvg(i); b.addEventListener("click", () => pickBalloon(i)); box.append(b);
    });
    $("pick").hidden = false; clearTimeout(pickNagT); pickSays = 0;
    setTimeout(() => { if (!$("pick").hidden && !picking) { say("ins_balloon"); pickSays = 1; setTimeout(() => whenQuiet(pickNag), 300); } }, 700);
  }
  function stopPickFlash() { clearTimeout(pickNagT); pickFlashTs.forEach(clearTimeout); pickFlashTs = []; [...$("balloons").children].forEach((b) => b.classList.remove("flash")); }
  function pickNag() {
    clearTimeout(pickNagT);
    pickNagT = setTimeout(() => {
      if ($("pick").hidden || picking) return;
      if (pickSays < 2) { say("ins_balloon"); pickSays++; }
      const btns = [...$("balloons").children].sort(() => Math.random() - 0.5);
      btns.forEach((b, i) => pickFlashTs.push(setTimeout(() => { b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); }, i * PICK_STEP)));
      pickFlashTs.push(setTimeout(() => whenQuiet(pickNag), btns.length * PICK_STEP + 1000));
    }, 4000);
  }
  function pickBalloon(k) {
    if (picking) return; picking = true; stopPickFlash();
    settings.balloon = k; saveSettings();
    [...$("balloons").children].forEach((b, i) => { b.setAttribute("aria-pressed", String(i === k)); b.classList.toggle("chosen", i === k); });
    say(Math.random() < 0.5 ? "fb_choice1" : "fb_choice2");
    const pickedAt = performance.now();
    whenQuiet(() => setTimeout(() => { picking = false; if ($("pick").hidden) return; $("pick").hidden = true; openTopics(); }, Math.max(250, 1900 - (performance.now() - pickedAt))));
  }

  // ---------- the topic picker: 3 wheels (spec 1) ----------
  function openTopics() {
    state.mode = "pick";
    const box = $("topicList"); box.textContent = "";
    TOPICS.forEach((t, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "topic" + (t.soon ? " locked" : ""); b.dataset.id = t.id;
      b.innerHTML = `<span>${t.name}</span><span class="strip"><span class="ring" style="--bt:${26 + i * 4}s"></span></span>`;
      if (!t.soon) b.addEventListener("click", () => pickTopic(t, b));
      box.append(b);
    });
    $("topics").hidden = false; say("sw_pick");   // "בְּחַר גַּלְגַּל" (Golan 29.10)
    // every bracelet has the same number of cards: as many as the smallest one would hold (Golan 29.10; which pictures stay out does not matter)
    requestAnimationFrame(() => {
      const rows = [...box.children].map((b, i) => ({ ring: b.querySelector(".ring"), keys: TOPICS[i].pics.map(([k]) => k) }));
      const n = Math.min(...rows.map((r) => braceletFits(r.ring, r.keys.length)));
      rows.forEach((r) => bracelet(r.ring, r.keys, n));
    });
  }
  // how many cards a row's ring would hold: whole rounds of the topic's pictures, as big as fit
  const ringSize = (ring) => { const st = ring.parentNode, W = st.clientWidth, H = st.clientHeight; return { H, r0: Math.max(40, W * 0.46 - H * 0.3) }; };
  function braceletFits(ring, count) { const { H, r0 } = ringSize(ring); return count * Math.max(1, Math.round((2 * Math.PI * r0) / (H * 0.64 * 1.1) / count)); }
  // the pictures around a ring, each one fixed on it (when there are fewer pictures than cards they come round again)
  function bracelet(ring, keys, n) {
    const { H, r0 } = ringSize(ring), gap = 1.1;   // the ring fills the row's width; big cards (Golan 29.10)
    const s = Math.min(H * 0.64, (2 * Math.PI * r0) / (n * gap)), r = (n * s * gap) / (2 * Math.PI);   // the cards close together
    keys = shuffle(keys.slice());   // a different choice of pictures each time
    ring.style.setProperty("--s", s + "px");
    ring.innerHTML = Array.from({ length: n }, (_, j) => `<span class="bead" style="transform: rotateY(${(j * 360) / n}deg) translateZ(${r}px)"><i class="f">${picHtml(keys[j % keys.length])}</i><i class="b"></i></span>`).join("");
  }
  let topicBusy = false;
  function pickTopic(t, b) {
    if (topicBusy) return; topicBusy = true; unlockAudio();
    settings.topic = t.id; saveSettings(); b.classList.add("on");
    playIds([t.clip], () => setTimeout(() => { topicBusy = false; if ($("topics").hidden) return; $("topics").hidden = true; starCount.reset(); $("hud").hidden = false; countdown(); }, 500));
  }

  // ---------- 3, 2, 1 ----------
  let countToken = 0;
  function countdown() {
    const my = ++countToken;
    document.documentElement.classList.add("fl-counting");   // on clean light blue (Golan 23.10; screen.js)
    state.mode = "ready"; ["wheel", "star", "balls", "spinRow", "okMark"].forEach((id) => ($(id).hidden = true));
    const box = $("count");
    ["3", "2", "1"].forEach((n, i) => setTimeout(() => {
      if (my !== countToken || state.mode !== "ready" || paused) return;
      box.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = n; sp.style.background = "#10b947"; box.append(sp);
      tone([i === 2 ? 660 : 520], 0.16, "sine", 0.35);
    }, 700 + i * 1000));
    setTimeout(() => {
      if (my !== countToken || state.mode !== "ready" || paused) return;
      box.innerHTML = ""; tone([880, 1175], 0.14, "triangle", 0.4);
      startRound();
    }, 700 + 3 * 1000);
  }

  // keyboard (for testing on a computer): space spins / stops, 1-5 touches a ball
  document.addEventListener("keydown", (e) => {
    if (e.key === " ") { if (state.mode === "ready2spin") spin(); else if (state.mode === "spin") stop(); }
    const k = parseInt(e.key, 10); if (k >= 1 && k <= 5 && state.mode === "play") { const b = $("balls").children[k - 1]; if (b) judge(b); }
  });
  if (window.FL && FL.screen) FL.screen.onChange(() => layout());
  addEventListener("resize", layout);

  // test hook for automated checks
  window.__wheel = { state, settings, spin, stop, judge, endRound, lvl, layout, balls: () => [...$("balls").children], get paused() { return paused; }, get hg() { return HG ? { left: HG.left(), done: HG.done() } : null; } };
})();
</script>
