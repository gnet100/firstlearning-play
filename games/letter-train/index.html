<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>רכבת האותיות</title>
<link rel="stylesheet" href="../shared/fonts/fonts.css">   <!-- the font travels with the game: no internet needed (screens standard sec 9) -->
<style>
    /* no size jump on refresh: the start panel waits for FL.screen (screen.js adds .fl-ready), at most 3 s (Golan 23.10) */
    html:not(.fl-ready) #start > * { visibility: hidden; animation: flShow 0s 3s forwards; }
    @keyframes flShow { to { visibility: visible; } }
  /* Screens, buttons, sizes and colours are copied from the car-and-gates game (voice/race-gates-voice), so both feel like one game. */
  :root {
    --sky: #bfe6ff;
    --ink: #1d2a3a;
    --card: #ffffffee;
    --accent: #ff8a3d;
    --accent-ink: #ffffff;
    --good: #2bb673;
    --muted: #5b6b7f;
  }
  /* single deliberate look (daylight world): same colours in light and dark */
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--sky);
    font-family: "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  .prompt {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 20px;
    background: var(--card); border-radius: 999px; box-shadow: 0 4px 16px #0002;
  }
  .prompt .label { display: none; }   /* Golan 15.10: no "לַקָּרוֹן שֶׁל", only the letter, centred in the bar */
  .prompt.empty { visibility: hidden; }
  .prompt .target { font-size: 56px; font-weight: 800; line-height: 1; min-width: 64px; text-align: center; position: relative; }
  .prompt .target:empty { display: none; }
  .round-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: 30px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 #c45f1d;
  }
  .round-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c45f1d; }

  .stars {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px;
    background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 26px; font-weight: 800;
    box-shadow: 0 4px 16px #0002;
  }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; background: #0002; }
  .dots span.done { background: var(--good); }
  .dots-wrap {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 88px); left: 50%; transform: translateX(-50%);
    pointer-events: none;
  }

  .gear {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink);
    box-shadow: 0 4px 16px #0002;
  }
  /* in the game the buttons stand in a column at the top left: door, settings (as in the car game) */
  .hud .gear, .overlay-gear { top: calc(max(12px, env(safe-area-inset-top)) + 76px); }
  /* the settings gear: on every screen, a little bigger, darker grey (Golan 15.10) */
  .gear-ico { width: 40px; height: 40px; display: block; }
  .overlay-gear { z-index: 30; }
  .start-gear { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; }
  /* exit door, ajar, opening outward toward the left edge; "יציאה" tip on mouse hover (as in the car game, 15.10) */
  .door-ico { width: 1em; height: 1em; display: block; }
  .door-btn { z-index: 30; }
  .door-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #2b2f3a; color: #fff; font: 700 18px "Noto Sans Hebrew", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease .25s; }
  @media (hover: hover) { .door-btn:hover::after { opacity: 1; } }
  .door-btn { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink); box-shadow: 0 4px 16px #0002; font-size: 40px; }
  /* balloon picker (instead of the car picker) */
  .cars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .cars button { border: 3px solid #d5dde6; border-radius: 18px; background: #eaf6ff; padding: 4px; cursor: pointer; aspect-ratio: 1; }
  .cars.locos button { aspect-ratio: 3 / 2; min-width: 0; }   /* the engines are wide pictures */
  .cars.locos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cars button img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; display: block; }
  .cars button svg { width: 100%; height: 100%; display: block; }
  .cars button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .cars button:active { transform: scale(.96); }
  .cars button.flash { animation: carFlash 1s ease-in-out; }
  /* the chosen balloon grows at once, slowly, while the praise plays (as the chosen car does) */
  #cars button.chosen { position: relative; z-index: 2; transform: scale(1.3); border-color: var(--accent); background: #fff3ea;
    transition: transform 1.8s ease-out, box-shadow 1.8s ease-out; box-shadow: 0 8px 24px #0003; }
  @keyframes carFlash { 50% { transform: scale(1.18); border-color: #ffb27a; } }
  /* green continue button with space before the arrow (as in the car game) */

  .arrows {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-end; padding: 0 18px; pointer-events: none; direction: ltr;
  }
  .arrow {
    pointer-events: auto; width: 96px; height: 96px; border-radius: 50%; border: 0;
    background: #ffffffcc; color: var(--ink); font-size: 46px; font-weight: 800; box-shadow: 0 4px 0 #0003;
    display: grid; place-items: center; cursor: pointer;
  }
  .arrow:active { transform: translateY(3px); box-shadow: 0 1px 0 #0003; }
  /* new in the train game: the drop button, between the two arrows */
  .arrow.drop { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #c45f1d; }
  .arrow.drop:active { box-shadow: 0 1px 0 #c45f1d; }
  .arrow.drop svg { width: 52%; height: 52%; }

  .perf {
    position: absolute; bottom: max(6px, env(safe-area-inset-bottom)); left: 50% !important; transform: translateX(-50%);   /* bottom middle: the top pill now carries the game name (Golan 16.10) */
    direction: ltr; text-align: left; font: 600 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
    background: #000a; color: #fff; padding: 5px 9px; border-radius: 10px; pointer-events: none;
  }
  .perf b { font-size: 18px; }
  .perf .bad { color: #ff8080; } .perf .ok { color: #ffd166; } .perf .good { color: #7dffb0; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; background: #bfe6ffcc; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .panel {
    background: #fff; border-radius: 28px; padding: 28px 24px; max-width: 520px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px #0003;
  }
  .panel h1 { margin: 0 0 8px; font-size: 34px; }
  .panel p { margin: 6px 0 18px; font-size: 19px; color: var(--muted); }
  .swap-ask { background: #fff3ea; border-radius: 20px; padding: 10px 12px 14px; margin: 0 0 16px; }
  .swap-ask p { color: var(--ink); font-weight: 800; font-size: 24px; margin: 4px 0 10px; }
  .big-btn.small { font-size: 22px; padding: 10px 26px; min-height: 56px; }
  .big-btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #d5dde6; border: 2px solid #d5dde6; }
  .big-btn {
    border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
    font: 800 30px "Noto Sans Hebrew", system-ui, sans-serif; padding: 18px 44px; min-height: 76px;
    box-shadow: 0 5px 0 #c45f1d;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c45f1d; }
  .big-btn:disabled { opacity: .6; }
  .start-row { display: flex; gap: 14px; justify-content: center; align-items: center; }
  #start .start-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; }
  #start #go { grid-column: 2; white-space: nowrap; } #start #hear { grid-column: 3; justify-self: end; }
  #start .start-row { margin: 0 -12px; }
  #start #hear { width: 64px; min-width: 64px; height: 64px; min-height: 0; font-size: 30px; }
  .go-btn { background: #34b36b; box-shadow: 0 5px 0 #1f8048; }
  #closeSettings { background: #34b36b; box-shadow: 0 5px 0 #1f8048; } #closeSettings:active { box-shadow: 0 2px 0 #1f8048; }   /* Golan 22.10: back to the game = starts it again, green */
  .go-btn:active { box-shadow: 0 2px 0 #1f8048; }
  .go-btn.pressed { animation: goPress .9s ease-in-out; box-shadow: 0 0 0 6px #34b36b33, 0 3px 0 #1f8048; }
  @keyframes goPress { 0% { transform: scale(1); } 45% { transform: scale(.95); } 100% { transform: scale(1); } }
  @media (hover: hover) and (pointer: fine) {
    .big-btn, .round-btn, .arrow, .cars button, .seg button, .letters > button { transition: transform .15s ease, filter .15s ease; }
    .big-btn:hover, .round-btn:hover, .arrow:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .cars button:hover, .seg button:hover, .letters > button:hover { transform: translateY(-2px); border-color: #ffb27a; }
  }
  .spk { padding: 0; width: 84px; min-width: 84px; height: 84px; font-size: 42px; }

  .settings { text-align: right; }
  /* X in the top right corner of the settings (Golan 16.10, all games): stays in view while the panel scrolls; the scroll bar is on the left */
  .set-x-wrap { position: sticky; top: 0; height: 0; z-index: 5; }
  .set-x { position: absolute; top: -10px; right: -8px; width: max(calc(56 * var(--u, 1px)), var(--tap-s, 52px)); height: max(calc(56 * var(--u, 1px)), var(--tap-s, 52px));
    border-radius: 50%; border: 2px solid #d5dde6; background: #fff; color: var(--ink); font: 800 26px/1 "Noto Sans Hebrew", system-ui, sans-serif;
    display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px #0002; padding: 0; }
  .set-x:active { transform: scale(.94); }
  #settings h2 { padding: 0 calc(max(calc(56 * var(--u, 1px)), var(--tap-s, 52px)) - 4px); line-height: 1.3; }   /* the title stays centred and clear of the X */
  .settings h2 { margin: 0 0 12px; font-size: 26px; text-align: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
  .seg { display: flex; gap: 6px; flex-shrink: 0; }
  .row.stack { flex-wrap: wrap; }
  .row.stack .seg { flex-shrink: 1; flex-wrap: wrap; }
  .settings { max-height: 100%; overflow-y: auto; }
  .seg button {
    min-width: 76px; min-height: 52px; border-radius: 14px; border: 2px solid #d5dde6; background: #fff;
    font: 700 17px "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters-row { align-items: flex-start; }
  .letters-row > span, .row > span.two { display: flex; flex-direction: column; gap: 4px; }
  .letters-row small, .row small { font-size: 14px; color: var(--muted); font-weight: 400; }
  /* Golan 16.10 (all games): title above or beside the buttons, the long explanation on its own full line below them */
  .row.noted { flex-wrap: wrap; }
  .row .row-note { order: 9; line-height: 1.4; }
  /* Golan 16.10 (all games): every settings row is 3 lines: the title, then the options, then the explanation */
  #settings .row { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 8px; }
  #settings .row > span:first-child { font-weight: 700; }
  #settings .row.stack .seg { flex-wrap: nowrap; }
  #settings .row > .seg, #settings .row > #learnerTable, #settings .row > .letters { max-width: 100%; }
  .letters { width: 100%; }
  .letters > button { width: auto; height: auto; aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 8px; border: 2px solid #d5dde6; background: #fff; cursor: pointer;
    font: 800 clamp(16px, 3.2vw, 24px) "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); }
  .letters > button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters > button.final { border-style: dashed; }
  /* the writing line under a final letter in the bar is long, so the tail clearly goes below it (Golan 15.10) */
  #target.final::after { content: ""; position: absolute; left: 50%; width: 1em; transform: translateX(-50%); top: 0.75em; height: 1.5px; border-radius: 1px; background: #8fb3d9; }
  .letters > button.final { text-decoration: underline; text-decoration-color: #8fb3d9; text-decoration-thickness: 3px; text-underline-offset: 1px; text-decoration-skip-ink: none; }
  .diag { direction: ltr; text-align: left; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  /* 3-2-1 before the first train (same circles as the car game's start line) */
  .count { position: absolute; left: 50%; top: 42%; width: 0; height: 0; pointer-events: none; }
  .count span { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
    display: grid; place-items: center; font-size: 110px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0003;
    box-shadow: 0 0 0 6px #ffffff66, 0 0 22px #3dff7f, 0 0 48px #00e05a, 0 8px 30px #0003; animation: countPop .95s ease-out forwards; }
  @keyframes countPop { 0% { transform: scale(.4); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

  .toast {
    position: absolute; top: 20%; left: 80%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
    font-size: 64px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0004, 0 0 24px #0003;
    transition: transform .25s ease, opacity .25s ease; pointer-events: none; white-space: nowrap;
  }
  .prompt .target.pulse { animation: pulse .6s ease-in-out 2; }
  @keyframes pulse { 50% { transform: scale(1.35); color: var(--accent); } }
  .toast.good { font-size: 52px; color: #10b947; text-shadow: 0 0 6px #fff, 0 0 18px #3dff7f, 0 0 36px #00e05a, 0 3px 0 #0a7a35; }
  .toast .chk { display: inline-block; font-size: 80px; line-height: 1; vertical-align: -0.12em; filter: drop-shadow(0 0 8px #3dff7f) drop-shadow(0 3px 0 #0a7a35); }
  .toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  /* "יש נכון" sits centred just above the winning car's sign and follows it; a little smaller (as in the car game, 15.10) */
  /* "יש נכון" beside the balloon, at the height of its middle, on the side toward the screen centre (Golan 15.10) */
  .toast.pinned { transform: translate(0, -50%) scale(.6); transform-origin: 0 50%; }
  .toast.pinned.show { transform: translate(0, -50%) scale(1); }
  .toast.pinned.to-left { transform: translate(-100%, -50%) scale(.6); transform-origin: 100% 50%; }
  .toast.pinned.to-left.show { transform: translate(-100%, -50%) scale(1); }
  .toast.good.pinned { font-size: 40px; }
  .toast.pinned:not(.good) { font-size: 44px; }
  .toast.pinned .chk { font-size: 60px; }
  .toast .str { position: absolute; left: 50%; width: 2px; margin-left: -1px; background: #5B4630; pointer-events: none; }   /* the star's string (train, Golan 18.10) */
  /* Golan 18.10: only the check, centred on the letter's top-left corner (half on the letter, half outside), as in the car game */
  .toast.pinned.mark, .toast.pinned.mark.to-left { transform: translate(-50%, -50%) scale(.6); transform-origin: 50% 50%; }
  .toast.pinned.mark.show, .toast.pinned.mark.to-left.show { transform: translate(-50%, -50%) scale(1); }
  .toast.pinned.mark { line-height: 0; }
  .toast.pinned.mark .chk { display: block; vertical-align: 0; filter: drop-shadow(0 3px 4px #0005); }   /* the earned star, sized by placeToast */
  /* ===== screens standard (screens/screens-standard.md, 16.10): every size and place from FL.screen variables =====
     --u = one pixel of a 1280x720 board (720x1280 standing); floors in mm: --tap-s 10, --tap 15, --tap-play 20, --gap 5.
     No width breakpoints: only standing or lying (html[data-screen~="portrait"]). Same names as the other games. */
  html[data-screen] {
    --s: max(calc(72 * var(--u)), var(--tap-s));      /* door, settings */
    --b: max(calc(84 * var(--u)), var(--tap));        /* the child's main buttons: 🔊 */
    --a: max(calc(104 * var(--u)), var(--tap));       /* the arrows */
    --g: max(calc(14 * var(--u)), var(--gap));        /* space between buttons */
    --col: calc(var(--edge-l) + var(--s) + var(--g)); /* the door/settings column */
  }
  html[data-screen] .round-btn, html[data-screen] .round-btn.gear { width: var(--s); height: var(--s); font-size: calc(var(--s) * .45); }
  html[data-screen] .gear-ico { width: calc(var(--s) * .58); height: calc(var(--s) * .58); }
  html[data-screen] .door-btn { font-size: calc(var(--s) * .56); }
  html[data-screen] .door-btn, html[data-screen] .start-gear { top: var(--edge-t); left: var(--edge-l); }
  html[data-screen] .hud .gear, html[data-screen] .overlay-gear { top: calc(var(--edge-t) + var(--s) + var(--g)); left: var(--edge-l); }
  html[data-screen] .prompt { top: var(--edge-t); gap: max(calc(14 * var(--u)), 8px); padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u)) max(calc(20 * var(--u)), 12px); }
  html[data-screen] .prompt .round-btn { width: var(--b); height: var(--b); font-size: calc(var(--b) * .45); }
  html[data-screen] .prompt .target { font-size: max(calc(64 * var(--u)), 44px); min-width: max(calc(64 * var(--u)), 44px); }   /* the letter the child reads: 40px+ on a phone */
  html[data-screen] .dots-wrap { top: calc(var(--edge-t) + var(--b) + calc(16 * var(--u)) + var(--g)); }
  html[data-screen] .dots { gap: max(calc(6 * var(--u)), 4px); }
  html[data-screen] .dots span { width: max(calc(14 * var(--u)), 9px); height: max(calc(14 * var(--u)), 9px); }
  html[data-screen] .stars { top: var(--edge-t); right: var(--edge-r); font-size: max(calc(26 * var(--u)), 18px); padding: calc(8 * var(--u)) max(calc(18 * var(--u)), 12px); }
  html[data-screen] .arrows { bottom: var(--edge-b); padding: 0 var(--edge-r) 0 var(--edge-l); }
  html[data-screen] .arrow { width: var(--a); height: var(--a); font-size: calc(var(--a) * .46); }
  html[data-screen] .perf { bottom: var(--edge-b); }
  html[data-screen] .count span { width: max(calc(180 * var(--u)), 120px); height: max(calc(180 * var(--u)), 120px); left: calc(max(calc(180 * var(--u)), 120px) / -2);
    top: calc(max(calc(180 * var(--u)), 120px) / -2); font-size: max(calc(110 * var(--u)), 72px); }
  html[data-screen] .toast, html[data-screen] .toast.good { font-size: max(calc(52 * var(--u)), 34px); }
  html[data-screen] .toast .chk { font-size: max(calc(80 * var(--u)), 50px); }
  html[data-screen] .toast.good.pinned { font-size: max(calc(40 * var(--u)), 28px); }
  html[data-screen] .toast.pinned .chk { font-size: max(calc(60 * var(--u)), 40px); }
  /* the panels keep clear of the door/settings column and never run past the screen (no 100vh) */
  html[data-screen] .overlay { padding: var(--edge-t) var(--col) var(--edge-b) var(--col); }
  html[data-screen] .panel { max-width: max(calc(600 * var(--u)), min(520px, 100%)); max-height: 100%; overflow-y: auto;
    padding: max(calc(28 * var(--u)), 14px) max(calc(28 * var(--u)), 16px); border-radius: max(calc(28 * var(--u)), 18px); }
  html[data-screen] .panel h1 { font-size: max(calc(40 * var(--u)), 24px); }
  html[data-screen] .panel p { font-size: max(calc(22 * var(--u)), 17px); }
  html[data-screen] .big-btn { font-size: max(calc(34 * var(--u)), 22px); min-height: var(--tap); padding: calc(16 * var(--u)) max(calc(44 * var(--u)), 22px); }
  html[data-screen] .big-btn.small { font-size: max(calc(24 * var(--u)), 18px); min-height: var(--tap-s); padding: calc(10 * var(--u)) max(calc(26 * var(--u)), 16px); }
  html[data-screen] #start .start-row { gap: max(calc(24 * var(--u)), 8px); }
  /* the start-screen 🔊: a circle as tall as the start button, the icon centred inside it (Golan 16.10, all games; as in the detective game) */
  html[data-screen] #start #hear { --hb: max(calc(76 * var(--u)), var(--tap)); width: var(--hb); min-width: var(--hb); height: var(--hb); min-height: 0; padding: 0;
    border-radius: 50%; display: grid; place-items: center; line-height: 1; font-size: calc(var(--hb) * .47); overflow: hidden; }
  html[data-screen] .prompt #replay { display: grid; place-items: center; line-height: 1; padding: 0; overflow: hidden; }
  html[data-screen] #settings .panel { max-width: max(calc(640 * var(--u)), min(560px, 100%)); }
  /* the balloon picker = detective's card (Golan 16.10, all games; games/letter-recognition/detective/balloon-picker-spec.md) */
  html[data-screen] #carPick .panel { width: min(100%, max(calc(520 * var(--u)), 340px)); max-width: none; max-height: 100%; overflow-y: auto;
    padding: max(calc(28 * var(--u)), 14px) max(calc(24 * var(--u)), 16px); border-radius: max(calc(28 * var(--u)), 18px); }
  html[data-screen] #carPick .panel h1 { margin: 0 0 8px; font-size: max(calc(34 * var(--u)), 24px); }
  html[data-screen] .cars { grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  html[data-screen] .cars button { padding: 6px; display: grid; place-items: center; }
  html[data-screen] .cars button svg { width: 94%; height: 94%; }
  /* 3x3 on every screen (no 5-column rule, Golan 16.10): the grid is capped by the window height, so the tiles shrink instead of wrapping */
  html[data-screen] #carPick .cars { width: min(100%, calc(100dvh - var(--edge-t) - var(--edge-b) - 2 * max(calc(28 * var(--u)), 14px) - 1.4 * max(calc(34 * var(--u)), 24px) - 30px)); margin-inline: auto; }
  html[data-screen~="landscape"] #carPick { padding-inline: calc(max(var(--edge-l), var(--edge-r)) + var(--b) + 8 * var(--u)); }
  /* standing: the panels sit under the door/settings column; the letter bar and the dots move below the door row */
  html[data-screen~="portrait"] .overlay { padding: calc(var(--edge-t) + 2 * var(--s) + 2 * var(--g)) var(--edge-r) var(--edge-b) var(--edge-l); }
  html[data-screen~="portrait"] .prompt { top: calc(var(--edge-t) + var(--s) + var(--g)); left: calc(50% + var(--col) / 2); }
  html[data-screen~="portrait"] .dots-wrap { top: calc(var(--edge-t) + var(--s) + var(--b) + calc(16 * var(--u)) + 2 * var(--g)); left: calc(50% + var(--col) / 2); }
  html[data-screen~="portrait"] .toast, html[data-screen~="portrait"] .toast.good { left: 68%; top: 27%; }
  /* wrapper: never 100vh (taller than the visible part on a phone while the address bar shows) */
  html, body { position: fixed; inset: 0; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* the top letter pill = the detective's (Golan 16.10, all games; detective/letter-pill-spec.md "FIXED SIZE"): one fixed size from the first frame to the end,
     dots at a fixed gap under it. White pill, letter on the right, orange round speaker on the left (emoji 0.7x). */
  html[data-screen] {
    --spk: max(calc(46 * var(--u)), var(--tap-s));
    --pill-t: max(calc(56 * var(--u)), 40px);
    --pill-lw: max(calc(64 * var(--u)), 48px);
    --pill-h: calc(max(var(--pill-t), var(--spk)) + 16 * var(--u));
    --pill-w: calc(var(--pill-lw) + var(--spk) + 46 * var(--u));
    --pill-top: var(--edge-t);
    --dots-gap: max(calc(8 * var(--u)), 6px);
  }
  html[data-screen~="portrait"] { --pill-top: calc(var(--edge-t) + var(--s) + 10 * var(--u)); }
  html[data-screen] .prompt, html[data-screen~="portrait"] .prompt { box-sizing: border-box; left: 50%; top: var(--pill-top); height: var(--pill-h); width: var(--pill-w);
    gap: 0; padding: 0 calc(12 * var(--u)) 0 calc(20 * var(--u)); justify-content: space-between; }
  html[data-screen] .prompt .target, html[data-screen] .prompt .target:empty { display: block; font-size: var(--pill-t); width: var(--pill-lw); min-width: 0; height: var(--pill-t); line-height: 1; overflow: visible; }
  html[data-screen] .prompt #replay { width: var(--spk); height: var(--spk); font-size: calc(var(--spk) * 0.7); flex: none; }
  html[data-screen] .dots-wrap, html[data-screen~="portrait"] .dots-wrap { left: 50%; top: calc(var(--pill-top) + var(--pill-h) + var(--dots-gap)); }
  html[data-screen] .prompt.listen { justify-content: center; padding: 0; }
  html[data-screen] .prompt.listen .target { display: none; }

  /* settings (screens audit 16.10, standard sec. 4א): edge to edge on phones, and the X sits in a title row that never scrolls */

<script>
(() => {
  "use strict";
  const T0 = performance.now();
  const $ = (id) => document.getElementById(id);

  // ---------- settings (kept per device, wrapped because storage can be blocked) ----------
  const settings = { quality: "high", move: "auto", pace: "normal", cars: "3", match: "see", stress: "off", perf: "off", voice: "on", letters: [], script: "auto" };
  // Golan 19.10: "שליטה במהירות תנועת האלמנטים השונים" moves EVERYTHING that moves (also what is only watched):
  // the main loop scales its frame time by motionK(), and waves/bobbing/swaying run on motionMs (a clock that runs at that speed).
  // Waiting times, reaction times and the hourglass stay in real time.
  let motionMs = 0;
  const motionK = () => { try { const l = LRN; return l && l.speed ? l.speed("train") : 1; } catch (e) { return 1; } };
  try { Object.assign(settings, JSON.parse(localStorage.getItem("fl-train-settings") || "{}")); } catch (e) {}
  settings.letters = []; settings.lettersMode = "auto";   // every page load starts in "החלטת מערכת" (Golan 16.10, all games): a saved hand list is not played
  settings.match = "see";   // no closed box any more: the letter always hangs on the box (Golan 15.10)
  const saveSettings = () => { try { localStorage.setItem("fl-train-settings", JSON.stringify(settings)); } catch (e) {} };
  // Golan 19.10: the challenge level belongs to the child, not to the game: each child keeps their own choice
  // (settings.byKid[child id]); a new child starts at the default. Reads and writes of settings.<key> go there.
  (function perKid(keys) {
    const by = settings.byKid = settings.byKid || {};
    let whoC = "", whoT = -1e9;
    const who = () => { const n = performance.now(); if (n - whoT > 200) { whoT = n; try { const p = LRN && LRN.profile(); whoC = p ? p.id : ""; } catch (e) { whoC = ""; } } return whoC; };
    for (const [k, dflt] of Object.entries(keys)) {
      delete settings[k];
      Object.defineProperty(settings, k, { enumerable: false, get: () => { const o = by[who()]; return o && o[k] != null ? o[k] : dflt; }, set: (v) => { whoT = -1e9; (by[who()] = by[who()] || {})[k] = v; } });
    }
  })({ move: "auto" });


  // ---------- content (draft until the language & pedagogy advisor approves it) ----------
  // Same letters as the car game: 22 letters without dagesh or shin dot, plus 5 final letters, no nikud.
  const LETTERS = ["א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ", "ק", "ר", "ש", "ת"];
  const FINALS = ["ך", "ם", "ן", "ף", "ץ"];
  const FINAL_NAME = { "ך": "כף סופית", "ם": "מם סופית", "ן": "נון סופית", "ף": "פא סופית", "ץ": "צדי סופית" };
  const isFinal = (l) => FINALS.includes(l);
  const ALL_LETTERS = [...LETTERS, ...FINALS];
  // Shape look-alikes from the literacy framework, section 3.4 (the corrected list: ס/ם instead of מ/ס, plus ג/נ and ע/צ).
  const LOOKALIKE_GROUPS = [["ב", "כ"], ["ד", "ר", "ך"], ["ה", "ח", "ת"], ["ו", "ז", "ן"], ["ס", "ם"], ["ע", "צ"], ["ג", "נ"],
    ["כ", "ך"], ["נ", "ן"], ["פ", "ף"], ["צ", "ץ"], ["מ", "ם"]];
  const LOOKALIKE = {};
  for (const g of LOOKALIKE_GROUPS) for (const a of g) for (const b of g) if (a !== b) (LOOKALIKE[a] = LOOKALIKE[a] || new Set()).add(b);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pickOne = (a) => a[Math.floor(Math.random() * a.length)];
  // Chosen letters work exactly as in the car game: fewer than 6 chosen = about 70% from them and the rest at random;
  // 6 or more = only them; nothing chosen ("החלטת מערכת") = the child's card picks (all letters with no child). The first letter of a round is always a chosen one.
  function chosenLetters() { return [...new Set(settings.letters || [])].filter((l) => ALL_LETTERS.includes(l)); }
  function pickLetter(avoid, onlyChosen) {
    const chosen = chosenLetters();
    const all = chosen.length ? chosen : ALL_LETTERS;
    const others = ALL_LETTERS.filter((l) => !all.includes(l));
    for (let i = 0; i < 30; i++) {
      const fromChosen = onlyChosen || !chosen.length || chosen.length >= 6 || !others.length || Math.random() < 0.7;
      const t = pickOne(fromChosen ? all : others);
      if (!avoid.includes(t)) return t;
    }
    return ALL_LETTERS.find((l) => !avoid.includes(l)) || null;
  }
  // 2 to 5 cars (Golan, 15.10). Until the parent picks a number, it follows the age (advisor ruling literacy/practice-set-size.md):
  // Golan 17.10: the number of cars is part of the challenge level: level 1 = 2 cars, 2 = 3, 3 = 4, 4 = 5
  const carCount = () => 4;   // Golan 18.10: always 4 cars (the challenge is the balloon's speed only)
  // A round fills trains until at least 6 letters were dropped (6 = the car game's questions per round): 2 cars x 3 trains, 3 x 2, 4 x 2.
  // Golan 17.10: one cube in each car, then the next train comes; a round has as many trains as it takes to reach the
  // round length by age (5 / 7 / 9 cubes, learner.js), the last train full too
  // Golan 18.10: the round runs on the shared golden hourglass (1.5 / 2 / 2.5 min by level); when the sand is out, the train
  // on the screen is the last one. Without the hourglass (older learner.js): 5 / 7 / 9 trains by age, as before.
  const HG = window.FL && FL.learner && FL.learner.hourglass ? FL.learner.hourglass({ paused: () => state.paused || settingsOpen, onEnd: () => timeUp() }) : null;
  const roundOver = () => (HG ? HG.done() : state.trainNo >= trainsPerRound());

    setTimeout(() => { if (!$("carPick").hidden && !picking) { say("יש לבחור כדור פורח", 1); pickSays++; setTimeout(() => quietThen(carNag), 300); } }, 700);
  }
  // the picker runs outside the game clock, so it has its own wait-for-quiet
  function quietThen(cb) { let n = 0; const tick = () => { if (speaking() && n++ < 60) return setTimeout(tick, 100); cb(); }; setTimeout(tick, 200); }
  function stopCarFlash() { clearTimeout(carNagT); carFlashTs.forEach(clearTimeout); carFlashTs = []; [...$("cars").children].forEach((b) => b.classList.remove("flash")); }
  function carNag() {
    clearTimeout(carNagT);
    carNagT = setTimeout(() => {
      if ($("carPick").hidden || picking) return;
      if (pickSays < 2) { say(pickWhat === "loco" ? "יש לבחור קטר" : "יש לבחור כדור פורח", 1); pickSays++; }   // said twice, then only the balloons light up (Golan 15.10)
      const btns = [...$("cars").children].sort(() => Math.random() - 0.5);
      btns.forEach((b, i) => carFlashTs.push(setTimeout(() => { b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); }, i * 420)));
      carFlashTs.push(setTimeout(() => quietThen(carNag), btns.length * 420 + 1000));
    }, 4000);
  }
  function pickBalloon(i) {
    if (picking) return; picking = true; stopCarFlash();
    settings.balloon = i; saveSettings();
    [...$("cars").children].forEach((b, j) => { b.setAttribute("aria-pressed", String(j === i)); b.classList.toggle("chosen", j === i); });
    say(Math.random() < 0.5 ? "יופי של בחירה!" : "בחירה מצוינת!", 1);
    useBalloon(i);
    const grown = performance.now() + 1800;   // wait for the slow grow to end (Golan 16.10, as in waking-letter)
    quietThen(() => setTimeout(() => { picking = false; if ($("carPick").hidden) return; openLocoPick(); }, Math.max(250, grown - performance.now())));   // shorter pause after the pick, as in the car game (Golan, 15.10)
  }
  // Golan 20.10: after the balloon, the child picks the engine that brings the train (6 engines, same picker, same timings)
  const LOCO_NAMES = (window.FL && FL.trainLocos && FL.trainLocos.names) || ["classic"];
  let pickWhat = "balloon";
  function openLocoPick() {
    if (LOCO_NAMES.length < 2) return startAfterPick();
    pickWhat = "loco"; $("pickTitle").textContent = gt("בוחרים קטר", "בחר קטר", "בחרי קטר");
    const boxEl = $("cars"); boxEl.textContent = ""; boxEl.classList.add("locos");
    LOCO_NAMES.forEach((n, i) => {
      const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-pressed", "false"); b.setAttribute("aria-label", "קטר " + (i + 1));
      b.innerHTML = `<img src="../../hub-cards-animated/locos/${n}.png" alt="">`; b.addEventListener("click", () => pickLoco(i)); boxEl.append(b);
    });
    clearTimeout(carNagT); pickSays = 0;
    setTimeout(() => { if (!$("carPick").hidden && !picking) { say("יש לבחור קטר", 1); pickSays++; setTimeout(() => quietThen(carNag), 300); } }, 500);
  }
  function pickLoco(i) {
    if (picking) return; picking = true; stopCarFlash();
    settings.loco = LOCO_NAMES[i]; saveSettings(); buildLoco(settings.loco); loco.setEnabled(false);
    [...$("cars").children].forEach((b, j) => { b.setAttribute("aria-pressed", String(j === i)); b.classList.toggle("chosen", j === i); });
    say(Math.random() < 0.5 ? "יופי של בחירה!" : "בחירה מצוינת!", 1);
    const grown = performance.now() + 1800;
    quietThen(() => setTimeout(() => { picking = false; if ($("carPick").hidden) return; startAfterPick(); }, Math.max(250, grown - performance.now())));
  }
  function startAfterPick() {
    pickWhat = "balloon"; $("cars").classList.remove("locos"); genderTexts();
    $("carPick").hidden = true; { const sc = starCount(); if (sc) sc.reset(); } $("hud").hidden = false; countdown();   /* stars at 0 the moment the HUD shows (Golan 16.10) */
  }

  // ---------- 3, 2, 1 before the first train: the station is empty, then the cars roll in ----------
  let countToken = 0;
  function countdown() {
    const my = ++countToken;
    document.documentElement.classList.add("fl-counting");   // on clean light blue (Golan 23.10; screen.js)
    clearTimers(); state.phase = "ready"; state.letter = null; state.flyUp = null; state.lift = 0; state.needCrate = false; dropStar();
    for (const c of cars) { for (const k of c.cubes || []) { k.root.dispose(); crates.splice(crates.indexOf(k), 1); } c.cubes = []; c.count = 0; }
    if (state.crate) { state.crate.root.dispose(); crates.splice(crates.indexOf(state.crate), 1); state.crate = null; } for (const m of state.lost) { m.cr.root.dispose(); crates.splice(crates.indexOf(m.cr), 1); } state.lost.length = 0;
    state.trainX = 60; trainNode.position.x = 60; loco.setEnabled(true); steam.emitRate = 0; disposeGhost();
    layoutCars(); state.lane = Math.floor((carCount() - 1) / 2); state.bx = LANE_X[state.lane] + 0.8; state.freeX = null;
    state.bEnter = true;   // the balloon flies in from the left while the first train rolls in from the right (Golan 15.10)
    setTarget(""); state.drops = 0; renderDots();
    state.stars = 0; state.starList = []; state.roundSkill = 0; { const sc = starCount(); if (sc) sc.reset(); }   // every round starts from 0 stars
    const boxEl = $("count"), steps = [["3", "#10B947"], ["2", "#10B947"], ["1", "#10B947"]];   // all glowing green (Golan, 15.10)
    steps.forEach(([n, col], i) => after(700 + i * 1000, () => {
      if (my !== countToken || !state.counting) return;
      boxEl.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = n; sp.style.background = col; boxEl.append(sp);
      tone([i === 2 ? 660 : 520], 0.16, "sine", 0.35);
    }));
    // Golan 18.10: the train sets off the moment the game starts (while 3, 2, 1 is counted); the balloon comes when it is 80% of the way in
    state.counting = true; after(60, () => { if (my === countToken && state.counting) startRound(); });
    after(700 + 3 * 1000, () => {
      if (my !== countToken || !state.counting) return;
      boxEl.innerHTML = ""; tone([880, 1175], 0.14, "triangle", 0.4);
      state.counting = false; if (HG) HG.start();
    });
  }

  // ---------- door = back to the start screen ----------
  // Golan 24.10 (all games): every answer goes into the child's card at once; a letter with a wrong touch that was left
  // before it was found (door, restart, closing the page) is recorded too, as not found
  function flushPartial() {
    if (LRN && state.letter && state.letterWrong && !state.recDone) { state.recDone = true;
      LRN.record({ game: "train", letter: state.letter, picked: state.firstPicked, firstTry: false, solved: false, opts: activeCars().map((x) => x.letter), rtMs: null, changed: false, hint: Math.min(2, state.wrongs), mode: curRec() ? "cursive" : "recognize", pace: LRN.pace() }); }
  }
  addEventListener("pagehide", flushPartial);
  function backToStart() {
    flushPartial(); stopVoice(); stopCarFlash(); picking = false; clearTimeout(goT); $("go").classList.remove("pressed");
    if (settingsOpen) { $("settings").hidden = true; settingsOpen = false; pausedClip = null; if (pausedFrom === null) unfreeze(); }
    countToken++; state.counting = false; clearTimers(); $("count").innerHTML = "";
    state.phase = "intro"; state.letter = null; state.bounce = null; state.fall = null; state.flashAt = 0; state.hint = false; state.flyUp = null; state.lift = 0; state.needCrate = false; dropStar();
    if (state.crate) { state.crate.root.dispose(); crates.splice(crates.indexOf(state.crate), 1); state.crate = null; } for (const m of state.lost) { m.cr.root.dispose(); crates.splice(crates.indexOf(m.cr), 1); } state.lost.length = 0;
    for (const c of cars) { for (const k of c.cubes || []) { k.root.dispose(); crates.splice(crates.indexOf(k), 1); } c.cubes = []; c.count = 0; c.signRoot.position.y = SIGN_Y; }
    loco.setEnabled(false); steam.emitRate = 0; state.trainX = 0; disposeGhost(); gnomeReset(); if (HG) HG.stop();
    ["hud", "end", "carPick", "settings"].forEach((id) => ($(id).hidden = true));
    $("start").hidden = false;
  }
  // Opened from the central hub: every door goes straight back to its "בַּמֶּה נְשַׂחֵק?" list (Golan 16.10); voice and timers stop first
  function toHub() {
    if (!LRN || !LRN.fromHub || !LRN.hubUrl) return false;
    flushPartial(); stopVoice(); stopCarFlash(); picking = false; clearTimeout(goT); countToken++; clearTimers(); freeze();
    location.href = LRN.hubUrl + "#games"; return true;
  }
  const backToPick = () => { backToStart(); $("start").hidden = true; openCarPick(); };   // the restart button: the picker again
  ["doorGame", "doorCar", "doorEnd"].forEach((id) => $(id).addEventListener("click", (e) => { if (!toHub()) backToStart(e); }));   // the door always leaves to the island's game list, from every screen (Golan 28.10); opened on its own: the start screen
  // "התחל מחדש" under the gear (Golan 23.10, all games): the round starts again, as after "עוד סיבוב"
  if (window.FL && FL.screen && FL.screen.restartButton) FL.screen.restartButton(backToPick);
  // The opening screen's door goes back one screen (Golan 16.10, all games): to the page we came from, else to "מי משחק?"
  $("doorStart").addEventListener("click", (e) => {
    e.stopPropagation(); stopVoice(); clearTimeout(goT); $("go").classList.remove("pressed");
    if (toHub()) return;   // opened from the central hub: back to its game list
    if (document.referrer && history.length > 1) { history.back(); return; }
    if (LRN) LRN.chooseChild().then(() => { genderTexts(); heardIntro = false; clearTimeout(introT); introT = setTimeout(autoIntro, 1500); });
  });

  // test hook for automated checks
  window.__train = { state, newTrain, cars, gnome, fillShelf: (n) => { for (let i = 0; i < n; i++) { const s = nextSlot(); if (!s) return i; const cr = makeCrate(); drawCrate(cr, "ס", false); cr.str.isVisible = false; cr.stuck = true; for (const m of cr.root.getChildMeshes(false)) m.renderingGroupId = 1; gnome.shelf.push({ cr, s }); } return n; }, get lanes() { return LANE_X; }, makeTrain, setLane, requestDrop, endRound, settings, drawCarSign,
    balloonScreen() { const W = engine.getRenderWidth(), H = engine.getRenderHeight(), r = canvas.getBoundingClientRect(); const p = BABYLON.Vector3.Project(envelope.getAbsolutePosition(), BABYLON.Matrix.Identity(), scene.getTransformMatrix(), cam.viewport.toGlobal(W, H)); return [r.left + p.x * r.width / W, r.top + p.y * r.height / H]; } };
})();
</script>
