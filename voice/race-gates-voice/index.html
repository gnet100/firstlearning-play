<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>מרוץ השערים עם קול</title>
<!-- local font, no internet needed (screens audit 16.10, ס8); the letters are drawn only after fontReady -->
<link rel="stylesheet" href="../../games/shared/fonts/fonts.css">
<style>
  :root {
    --sky: #bfe6ff;
    --ink: #1d2a3a;
    --card: #ffffffee;
    --accent: #ff8a3d;
    --accent-ink: #ffffff;
    --good: #2bb673;
    --muted: #5b6b7f;
  }
  /* single deliberate look (daylight world): same colours in light and dark */
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--sky);
    font-family: "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  .hud > * { pointer-events: auto; }

  .prompt {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 8px 12px 8px 20px;
    background: var(--card); border-radius: 999px; box-shadow: 0 4px 16px #0002;
  }
  .prompt .label { font-size: 22px; font-weight: 700; white-space: nowrap; }
  .prompt .target { font-size: 56px; font-weight: 800; line-height: 1; min-width: 64px; text-align: center; }
  .round-btn {
    width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    font-size: 30px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 3px 0 #c45f1d;
  }
  .round-btn[hidden] { display: none; }
  .round-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c45f1d; }

  .stars {
    position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px;
    background: var(--card); border-radius: 999px; padding: 8px 18px; font-size: 26px; font-weight: 800;
    box-shadow: 0 4px 16px #0002;   /* filled by the shared FL.learner.starCounter: gold + count, silver + count (Golan 16.10) */
  }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; background: #0002; }
  .dots span.done { background: var(--good); }
  .dots-wrap {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 88px); left: 50%; transform: translateX(-50%);
    pointer-events: none;
  }

  .gear {
    position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink);
    box-shadow: 0 4px 16px #0002;
  }

  /* settings gear: grey drawn icon, a bit bigger, on every screen (Golan, 15.10) */
  .gear-ico { width: 1.3em; height: 1.3em; display: block; }
  .ov-gear { top: calc(max(12px, env(safe-area-inset-top)) + 76px); }
  /* in the game the buttons stand in a column at the top left: door, settings (Golan, 14.10; no pause button since 16.10) */
  .hud .gear { top: calc(max(12px, env(safe-area-inset-top)) + 76px); }
  /* settings button on the start screen too */
  .start-gear { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; }
  /* door = back to the previous screen (Golan, 14.10) */
  /* exit door, ajar, opening toward the left edge; "יציאה" tip on mouse hover (Golan, 15.10) */
  .door-ico { width: 1em; height: 1em; display: block; }
  .door-btn { z-index: 30; }   /* tip above the FPS box */
  .door-btn::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #2b2f3a; color: #fff; font: 700 18px "Noto Sans Hebrew", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s ease .25s; }
  @media (hover: hover) { .door-btn:hover::after { opacity: 1; } }
  .door-btn { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; background: var(--card); color: var(--ink); box-shadow: 0 4px 16px #0002; font-size: 40px; }
  /* car picker */
  .cars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .cars button { border: 3px solid #d5dde6; border-radius: 18px; background: #eaf6ff; padding: 4px; cursor: pointer; aspect-ratio: 1; }
  .cars button img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; display: block; }
  .cars button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .cars button:active { transform: scale(.96); }
  .cars button.flash { animation: carFlash 1s ease-in-out; }   /* slower, like the other games (Golan, 16.10) */
  /* the chosen car grows while we wait (Golan, 15.10): #cars beats the mouse-hover rule, so it starts at once; slow grow */
  #cars button.chosen { position: relative; z-index: 2; transform: scale(1.3); border-color: var(--accent); background: #fff3ea;
    transition: transform 1.8s ease-out, box-shadow 1.8s ease-out; box-shadow: 0 8px 24px #0003; }   /* nag: quick grow, one car after another (Golan, 14.10) */
  @keyframes carFlash { 50% { transform: scale(1.18); border-color: #ffb27a; } }

  .arrows {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0;
    display: flex; justify-content: space-between; padding: 0 18px; pointer-events: none; direction: ltr;
  }
  .arrow {
    pointer-events: auto; width: 96px; height: 96px; border-radius: 50%; border: 0;
    background: #ffffffcc; color: var(--ink); font-size: 46px; font-weight: 800; box-shadow: 0 4px 0 #0003;
    display: grid; place-items: center; cursor: pointer;
  }
  .arrow:active { transform: translateY(3px); box-shadow: 0 1px 0 #0003; }

  .perf {
    position: absolute; top: calc(max(12px, env(safe-area-inset-top)) + 4px); left: 92px;
    direction: ltr; text-align: left; font: 600 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
    background: #000a; color: #fff; padding: 5px 9px; border-radius: 10px; pointer-events: none;
  }
  .perf b { font-size: 18px; }
  .perf .bad { color: #ff8080; } .perf .ok { color: #ffd166; } .perf .good { color: #7dffb0; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center; background: #bfe6ffcc; padding: 16px;
  }
  .overlay[hidden] { display: none; }
  .panel {
    background: #fff; border-radius: 28px; padding: 28px 24px; max-width: 520px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px #0003;
  }
  .panel h1 { margin: 0 0 8px; font-size: 34px; }
  .panel p { margin: 6px 0 18px; font-size: 19px; color: var(--muted); }
  /* after 2 perfect rounds in a row: offer new letters (Golan, 14.10) */
  .swap-ask { background: #fff3ea; border-radius: 20px; padding: calc(10px * var(--k, 1)) 12px calc(14px * var(--k, 1)); margin: 0; }
  .swap-ask p { color: var(--ink); font-weight: 800; font-size: max(calc(24px * var(--k, 1)), 17px); margin: 4px 0 calc(10px * var(--k, 1)); }
  .swap-ask .start-row { margin: 0; }
  .swap-ask { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; column-gap: 12px; }
  .swap-ask p { margin: 0 !important; }
  html[data-screen~="landscape"] .swap-ask { padding: calc(8px * var(--k, 1)) 12px; }
  /* phone on its side: the question and its כן / לא in ONE line, so the shared panel still fits (Golan 17.10 two-button end popup) */
  html[data-screen~="phone"][data-screen~="landscape"] .swap-ask { flex-wrap: nowrap; padding: 4px 10px; }
  html[data-screen~="phone"][data-screen~="landscape"] .swap-long { display: none; }
  html[data-screen~="phone"][data-screen~="landscape"] .swap-ask .big-btn { min-width: calc(var(--tap-s) * 1.2); padding: 0 14px; }
  /* swap buttons shrink with the shared panel (--k) like everything else, never below the small touch size; "לא" is a pill too, not a tall circle */
  html[data-screen] .swap-ask .big-btn { white-space: nowrap; font-size: max(calc(30 * var(--u) * var(--k, 1)), 18px); min-height: max(calc(var(--tap) * var(--k, 1)), var(--tap-s)); min-width: max(calc(var(--tap) * 1.5 * var(--k, 1)), calc(var(--tap-s) * 1.5)); padding: 0 calc(30 * var(--u)); }
  .big-btn.small { font-size: 22px; padding: 10px 26px; min-height: 56px; }
  .big-btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 5px 0 #d5dde6; border: 2px solid #d5dde6; }
  .big-btn {
    border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer;
    font: 800 30px "Noto Sans Hebrew", system-ui, sans-serif; padding: 18px 44px; min-height: 76px;
    box-shadow: 0 5px 0 #c45f1d;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c45f1d; }
  .big-btn:disabled { opacity: .6; }
  .start-row { display: flex; gap: 14px; justify-content: center; align-items: center; }
  /* start screen: "יוצאים לדרך" in the middle, speaker at the end of the row, space between (Golan, 14.10) */
  #start .start-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; }
  #start #go { grid-column: 2; white-space: nowrap; } #start #hear { grid-column: 3; justify-self: end; }
  #start .start-row { margin: 0 -12px; }   /* speaker closer to the edge (Golan, 14.10) */
  #start #hear { width: 64px; min-width: 64px; height: 64px; min-height: 0; font-size: 30px; }
  @media (max-width: 480px) { #start .start-row { gap: 8px; } #start #go { font-size: 24px; padding: 14px 22px; } #start #hear { width: 54px; min-width: 54px; height: 54px; min-height: 0; font-size: 26px; } }
  .go-btn { background: #34b36b; box-shadow: 0 5px 0 #1f8048; }
  .go-btn:active { box-shadow: 0 2px 0 #1f8048; }
  /* the button reacts when pressed (Golan, 14.10): a bounce and a glow */
  /* one soft, slow press (Golan, 14.10: less dramatic, not double) */
  .go-btn.pressed { animation: goPress .9s ease-in-out; box-shadow: 0 0 0 6px #34b36b33, 0 3px 0 #1f8048; }
  @keyframes goPress { 0% { transform: scale(1); } 45% { transform: scale(.95); } 100% { transform: scale(1); } }
  /* small hover hint with a mouse (computers only) */
  @media (hover: hover) and (pointer: fine) {
    .big-btn, .round-btn, .arrow, .cars button, .seg button, .letters button { transition: transform .15s ease, filter .15s ease; }
    .big-btn:hover, .round-btn:hover, .arrow:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .cars button:hover, .seg button:hover, .letters button:hover { transform: translateY(-2px); border-color: #ffb27a; }
  }
  .spk { padding: 0; width: 84px; min-width: 84px; height: 84px; font-size: 42px; }

  .settings { text-align: right; }
  .settings h2 { margin: 0 0 12px; font-size: 26px; text-align: center; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
  .seg { display: flex; gap: 6px; flex-shrink: 0; }
  .row.stack { flex-wrap: wrap; }
  .row.stack .seg { flex-shrink: 1; flex-wrap: wrap; }
  .settings { max-height: 100%; overflow-y: auto; }
  /* X close button: top right, stays in view while the panel scrolls (the scroll bar is on the left in RTL) */
  /* the header row stays at the top while the rows scroll under it, never under the X (screens standard 4א) */
  .settings { padding-top: 0; }
  .set-head { position: relative; flex: 0 0 auto; z-index: 3; background: #fff; display: flex; align-items: center; gap: 10px;
    padding: 14px 0 10px; margin-bottom: 4px; border-bottom: 1px solid #eef1f5; }
  .set-head h2 { flex: 1; margin: 0; }
  .set-head::after { content: ""; flex: 0 0 var(--x, 52px); }   /* RTL: X on the right, an equal space on the left keeps the title centred */
  .set-head { --x: max(calc(52 * var(--u, 1px)), var(--tap-s, 48px)); }
  .set-x { flex: 0 0 auto; --x: max(calc(52 * var(--u, 1px)), var(--tap-s, 48px)); width: var(--x); height: var(--x); margin: 0;
    border: 2px solid #d5dde6; border-radius: 50%; background: #fff; color: var(--ink); font: 700 calc(var(--x) * .45) / 1 inherit;
    display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px #0002; }
  .set-x:active { transform: scale(.94); }
  /* the header row is fixed, only .set-body scrolls: nothing ever passes under the X (screens standard 4א, like detective) */
  #settings .panel.settings { display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; max-height: 100%; }
  .set-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .seg button {
    min-width: 76px; min-height: 52px; border-radius: 14px; border: 2px solid #d5dde6; background: #fff;
    font: 700 17px "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters-row { align-items: flex-start; }
  .letters-row > span { display: flex; flex-direction: column; gap: 4px; }
  .letters-row small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .letters { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 420px; margin: 0 auto; direction: rtl; }   /* always 3 rows (Golan 16.10, all games): 22 letters + 5 finals = 27 = 3 x 9 */
  .letters button { aspect-ratio: 1; min-width: 0; padding: 0; border-radius: 8px; border: 2px solid #d5dde6; background: #fff; cursor: pointer;
    font: 800 clamp(16px, 3.2vw, 24px) "Noto Sans Hebrew", system-ui, sans-serif; color: var(--ink); }
  .letters button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .letters button.final { border-style: dashed; }
  /* Final letters get a writing line, so the tail below it shows (ן is not ו, ך is not ר) */
  /* thin line, same length for every final letter (Golan, 15.10) */
  .letters button.final, #target.final { background-image: linear-gradient(#9dbbdc, #9dbbdc); background-repeat: no-repeat; }
  .letters button.final { background-size: 55% 1.5px; background-position: center 80%; }
  #target.final { background-size: .8em 2px; background-position: center .69em; }
  .diag { direction: ltr; text-align: left; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
  /* 3-2-1 countdown on the start line (Golan, 14.10): each circle appears big and fades away */
  .count { position: absolute; left: 50%; top: 42%; width: 0; height: 0; pointer-events: none; }
  .count span { position: absolute; left: -90px; top: -90px; width: 180px; height: 180px; border-radius: 50%;
    display: grid; place-items: center; font-size: 110px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0003;
    box-shadow: 0 0 0 4px #3dff7f88, 0 0 24px #3dff7f, 0 0 54px #00e05a, 0 8px 30px #0003; animation: countPop .95s ease-out forwards; }   /* glowing green, like "יש נכון" (Golan, 15.10) */
  @keyframes countPop { 0% { transform: scale(.4); opacity: 0; } 18% { transform: scale(1.1); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

  .toast {
    position: absolute; top: 20%; left: 80%; transform: translate(-50%, -50%) scale(.6);   /* right side, above the trees, off the sign (Golan, 14.10) */ opacity: 0;
    font-size: 64px; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #0004, 0 0 24px #0003;
    transition: transform .25s ease, opacity .25s ease; pointer-events: none; white-space: nowrap;
  }
  .prompt .target.pulse { animation: pulse .6s ease-in-out 2; }
  /* settings rows (Golan 16.10, all games): title above the buttons (or on their right when it fits), the long explanation on its own full line below them */
  /* every settings item = 3 lines: title, the options, then the explanation (Golan 16.10, all games) */
  .settings .row { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 8px; }
  .settings .row > .row-title { font-weight: 700; }
  .settings .row > .seg { flex-wrap: wrap; justify-content: flex-start; }
  .settings .row-note { margin: 0; font-size: 14px; color: var(--muted); font-weight: 400; line-height: 1.45; }
  .kid-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 6px 0 10px; }
  .kid-tools button { font: inherit; font-size: 17px; border: 2px solid #e2e6ee; background: #fff; border-radius: 12px; padding: 6px 12px; cursor: pointer; }
  .lvl-seg { display: inline-flex; gap: 4px; margin-inline-start: 6px; }
  .lvl-seg button[aria-pressed="true"] { border-color: var(--accent); background: #fff3ea; }
  .seg[data-key=gates] button.auto { width: auto; padding: 0 10px; }
  @keyframes starPop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 50% { transform: scale(1.35); color: var(--accent); } }
  .toast.good { font-size: 52px; color: #10b947; text-shadow: 0 0 6px #fff, 0 0 18px #3dff7f, 0 0 36px #00e05a, 0 3px 0 #0a7a35; }
  .toast .chk { display: inline-block; font-size: 80px; line-height: 1; vertical-align: -0.12em; filter: drop-shadow(0 0 8px #3dff7f) drop-shadow(0 3px 0 #0a7a35); }   /* bigger, mirrored check (Golan, 14.10) */
  .toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  /* "יש נכון" sits centred just above the winning letter, wherever it is, and is a little smaller (Golan, 15.10) */
  .toast.pinned { transform: translate(-50%, -50%) scale(.6); transform-origin: 50% 50%; will-change: transform, left, top; backface-visibility: hidden; line-height: 0; }
  .toast.pinned.show { transform: translate(-50%, -50%) scale(1); }
  .toast.pinned .chk { display: block; vertical-align: 0; filter: drop-shadow(0 3px 4px #0005); }   /* a star, not the green glowing check */
  .toast.good.pinned { font-size: 40px; }
  .toast.pinned .chk { font-size: 60px; }
  @media (max-width: 720px) {
    .toast, .toast.good { font-size: 40px; left: 68%; top: 27%; }
    .toast .chk { font-size: 56px; }
    .toast.good.pinned { font-size: 30px; }
    .toast.pinned .chk { font-size: 44px; }
    .prompt { top: calc(max(12px, env(safe-area-inset-top)) + 76px); }
    .dots-wrap { top: calc(max(12px, env(safe-area-inset-top)) + 160px); }
  }
  @media (max-width: 600px) {
    .prompt .label { font-size: 17px; }
    .prompt .target { font-size: 44px; }
    .arrow { width: 84px; height: 84px; }
  }
  /* Phones (Golan, 14.10): smaller buttons so nothing stands on top of anything else. */
  @media (max-width: 600px) {
    .round-btn { width: 52px; height: 52px; font-size: 24px; }
    .door-btn { font-size: 30px; }
    /* settings fit the width, no sideways scrolling (Golan, 15.10) */
    .settings { overflow-x: hidden; }
    .row { gap: 8px; }
    .seg { gap: 4px; flex-shrink: 1; min-width: 0; }
    .seg button { min-width: 0; padding: 0 10px; font-size: 16px; }
    .seg[data-key=gates] button { width: 44px; padding: 0; }
    .hud .gear, .ov-gear { top: calc(max(12px, env(safe-area-inset-top)) + 62px); }
    .perf { left: 78px; }
    .prompt { top: calc(max(12px, env(safe-area-inset-top)) + 62px); left: 80px; right: 12px; transform: none; justify-content: center; gap: 10px; padding: 6px 8px 6px 14px; }
    .dots-wrap { top: calc(max(12px, env(safe-area-inset-top)) + 136px); left: calc(50% + 34px); }
    .arrow { width: 72px; height: 72px; font-size: 36px; }
  }
  /* Phone on its side (Golan, 14.10): the screen is low, so everything is smaller and the car picker shows 5 in a row. */
  @media (max-height: 500px) and (orientation: landscape) {
    .overlay { padding: 8px; }
    .panel { padding: 14px 18px; max-height: calc(100vh - 16px); overflow-y: auto; }
    .panel h1 { font-size: 24px; margin-bottom: 4px; }
    .round-btn { width: 48px; height: 48px; font-size: 22px; }
    .door-btn { font-size: 28px; }
    .hud .gear, .ov-gear { top: calc(max(8px, env(safe-area-inset-top)) + 56px); }
    .door-btn, .start-gear { top: max(8px, env(safe-area-inset-top)); }
    .perf { left: 74px; }
    .prompt { top: max(8px, env(safe-area-inset-top)); gap: 10px; padding: 4px 8px 4px 14px; }
    .prompt .label { font-size: 18px; }
    .prompt .target { font-size: 40px; }
    .dots-wrap { top: calc(max(8px, env(safe-area-inset-top)) + 60px); }
    .stars { font-size: 20px; padding: 6px 14px; }
    .arrow { width: 72px; height: 72px; font-size: 36px; }
    #carPick .panel { max-width: 660px; }
    .cars { grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 4px; }
    #start .big-btn { padding-top: 12px; padding-bottom: 12px; }
  }

  /* ===== screens standard (16.10, from the screens thread's demo): every size and place from FL.screen variables, no device breakpoints ===== */
  html[data-screen] {
    --s: max(calc(72 * var(--u)), var(--tap-s));      /* door, settings */
    --b: max(calc(84 * var(--u)), var(--tap));        /* main kid buttons: replay */
    --g: max(calc(14 * var(--u)), var(--gap));        /* space between buttons */
    --arrow: max(calc(132 * var(--u)), var(--tap));
  }
  html[data-screen] .round-btn { width: var(--s); height: var(--s); font-size: calc(var(--s) * .45); }
  html[data-screen] .door-btn { font-size: calc(var(--s) * .6); }
  html[data-screen] .door-btn, html[data-screen] .start-gear { top: var(--edge-t); left: var(--edge-l); }
  html[data-screen] .hud .gear, html[data-screen] .ov-gear { top: calc(var(--edge-t) + var(--s) + var(--g)); left: var(--edge-l); }
  /* top letter pill = the detective standard (Golan 16.10, all games; detective/letter-pill-spec.md "FIXED SIZE"):
     white pill, letter + orange speaker (emoji 0.7x), dots at a fixed gap below; one size from the first frame to the end */
  html[data-screen] {
    --spk: max(calc(46 * var(--u)), var(--tap-s, 44px));
    --pill-t: max(calc(56 * var(--u)), 40px);
    --pill-lw: max(calc(64 * var(--u)), 48px);
    --pill-h: calc(max(var(--pill-t), var(--spk)) + 16 * var(--u));
    --pill-w: calc(var(--pill-lw) + var(--spk) + 46 * var(--u));
    --pill-top: var(--edge-t);
    --dots-gap: max(calc(8 * var(--u)), 6px);
  }
  html[data-screen~="portrait"] { --pill-top: calc(var(--edge-t) + var(--s) + 10 * var(--u)); }   /* standing: one row down, under the door */
  html[data-screen] .prompt { box-sizing: border-box; top: var(--pill-top); left: 50%; right: auto; transform: translateX(-50%);
    width: var(--pill-w); height: var(--pill-h); gap: calc(14 * var(--u)); padding: 0 calc(12 * var(--u)) 0 calc(20 * var(--u));
    justify-content: space-between; border-radius: 999px; }
  html[data-screen] .prompt .target { display: block; font-size: var(--pill-t); width: var(--pill-lw); min-width: 0; height: var(--pill-t); line-height: 1; overflow: visible; }
  html[data-screen] .prompt .round-btn { width: var(--spk); height: var(--spk); font-size: calc(var(--spk) * .7); padding: 0; line-height: 1; overflow: hidden; }
  /* phones: the settings panel uses the full width inside the safe edges, so the letter tiles get bigger (screens audit 16.10) */
  html[data-screen~="phone"] #settings .panel.settings { width: 100%; max-width: none; padding-inline: max(calc(12 * var(--u)), 10px); }
  html[data-screen~="phone"] .set-head h2 { font-size: 21px; }   /* one line beside the X */
  html[data-screen~="phone"] .set-head::after { flex-basis: 0; }   /* narrow phone: the title takes the spare side too, so it stays on one line */
  html[data-screen~="phone"] .set-head { padding: 8px 0 6px; }
  html[data-screen] .prompt.listen { justify-content: center; padding: 0; }   /* speaker-only question: same pill, speaker centred */
  html[data-screen] .prompt.listen .target { display: none; }
  html[data-screen] .dots-wrap { top: calc(var(--pill-top) + var(--pill-h) + var(--dots-gap)); left: 50%; }
  html[data-screen] .dots { margin-top: 0; gap: max(calc(6 * var(--u)), 4px); }
  html[data-screen] .dots span { width: max(calc(12 * var(--u)), 9px); height: max(calc(12 * var(--u)), 9px); }
  html[data-screen] .stars { top: var(--edge-t); right: var(--edge-r); font-size: max(calc(32 * var(--u)), 20px); padding: calc(8 * var(--u)) calc(18 * var(--u)); }
  html[data-screen] .arrows { bottom: var(--edge-b); padding: 0; left: var(--edge-l); right: var(--edge-r); }
  html[data-screen] .arrow { width: var(--arrow); height: var(--arrow); font-size: calc(var(--arrow) * .45); }
  html[data-screen] .perf { top: var(--edge-t); left: calc(var(--edge-l) + var(--s) + var(--g)); }
  html[data-screen] .overlay { padding: var(--edge-t) var(--edge-r) var(--edge-b) var(--edge-l); }
  html[data-screen] .panel { max-width: max(calc(640 * var(--u)), min(520px, 100%)); max-height: 100%; overflow-y: auto; }
  html[data-screen] .panel h1 { font-size: max(calc(44 * var(--u)), 24px); }
  html[data-screen] .panel p { font-size: max(calc(24 * var(--u)), 17px); }
  html[data-screen] .big-btn { font-size: max(calc(36 * var(--u)), 22px); min-height: var(--tap); padding: calc(16 * var(--u)) calc(44 * var(--u)); }
  /* start-screen speaker: a circle as tall as the start button, icon centred inside (Golan 16.10, all games; same rule as detective) */
  html[data-screen] #start #hear { --hb: max(calc(76 * var(--u)), var(--tap)); width: var(--hb); min-width: var(--hb); height: var(--hb); min-height: 0; padding: 0;
    border-radius: 50%; display: grid; place-items: center; line-height: 1; font-size: calc(var(--hb) * .47); overflow: hidden; flex: 0 0 auto; }
  html[data-screen] #start #go { min-height: max(calc(76 * var(--u)), var(--tap)); padding-top: 0; padding-bottom: 0; }
  /* phone or narrow window standing up: the prompt moves below the button row, beside the column */
  html[data-screen~="portrait"] .perf { display: none; }
  /* the panel never sits under the door/gear column (audit 16.10: SE and iPhone landscape, the gear covered the first car) */
  html[data-screen~="landscape"] :is(#start, #carPick, #end) { padding-left: calc(var(--edge-l) + var(--s) + var(--g)); padding-right: calc(var(--edge-r) + var(--s) + var(--g)); }

  /* car picker = the shared picker layout (Golan 16.10, all games): white rounded card, title, 3x3 equal light tiles,

  html[data-screen] #carPick { --side: 0px; --top: 0px; }

  html[data-screen~="portrait"] #carPick { --top: calc(2 * (var(--s) + var(--g))); }
  html[data-screen] #carPick .panel { width: auto; max-width: none; padding: max(calc(18 * var(--u)), 12px) max(calc(22 * var(--u)), 14px); }
  html[data-screen] #carPick h1 { margin: 0 0 max(calc(10 * var(--u)), 6px); line-height: 1.25; }
  html[data-screen] #carPick .cars { --cg: max(calc(14 * var(--u)), 8px);

<!-- the child's shared letter card for every letter game (games/shared, 15.10). Never edit these copies here. -->
<script src="../../games/shared/screen.js"></script>
<script src="../../games/shared/letter-pairs.js"></script>
<script src="../../games/shared/learner.js"></script>
<script>
(() => {
  "use strict";
  const T0 = performance.now();
  const $ = (id) => document.getElementById(id);

  // ---------- settings (kept per device, wrapped because storage can be blocked) ----------
  const settings = { quality: "high", pace: "normal", gates: "age", nikud: "uniform", stress: "off", perf: "off", voice: "on", letters: [], script: "auto" };
  // Golan 19.10: "שליטה במהירות תנועת האלמנטים השונים" moves EVERYTHING that moves (also what is only watched):
  // the main loop scales its frame time by motionK(), and waves/bobbing/swaying run on motionMs (a clock that runs at that speed).
  // Waiting times, reaction times and the hourglass stay in real time.
  let motionMs = 0;
  const motionK = () => { try { const l = LRN; return l && l.speed ? l.speed("race") : 1; } catch (e) { return 1; } };
  try { Object.assign(settings, JSON.parse(localStorage.getItem("fl-race-settings") || "{}")); } catch (e) {}
  // Every page load starts in "החלטת מערכת" (Golan 16.10, all games): a saved manual list is not played; taps in auto are handled by the picker
  settings.letters = []; settings.lettersMode = "auto";
  // Gates by age is the new default (advisor ruling 16.10: 2 up to age 4, 3 from 5); an older saved default moves to it once
  if (settings.gatesV !== 2) { settings.gatesV = 2; if (settings.gates === "3") settings.gates = "age"; }
  const saveSettings = () => { try { localStorage.setItem("fl-race-settings", JSON.stringify(settings)); } catch (e) {} };

  // ---------- content (draft – not yet approved by the pedagogy advisor) ----------
  // Open syllables with the "a" sound (spec, language stage 3). Kamatz and patah sound the same.
  // Nikud setting (Golan, 12.10.2026): "uniform" (default) = one mark per question, kamatz or patah;
  // "mixed" = the prompt and each gate get their own mark, so the child learns "מָ" and "מַ" are one sound;
  // "kamatz" / "patah" = always that mark. Gates always differ by letter, so there is one right answer.
  const KAMATZ = "\u05B8", PATAH = "\u05B7";
  // All letters in alphabet order (Golan, 14.10 added א ב ט י כ ע פ צ ק שׂ). Letters that sound the same
  // never stand on the gates of one question, so there is always exactly one right answer.
  // Letter recognition uses the 22 letters א-ת without dagesh or shin/sin dots (Golan, 14.10).
  const LETTERS = ["א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ", "ק", "ר", "ש", "ת"];
  const SOUND_GROUPS = [["א", "ע", "ה"], ["ת", "ט"], ["כּ", "ק"], ["ח", "כ"], ["ו", "ב"], ["ס", "שׂ"]];
  // Letter recognition (Golan, 14.10): the narrator says the letter's NAME, so letters that sound the same
  // (ת and ט, for example) have different names and may stand together on the gates.
  const sameSound = (a, b) => a === b;
  const FINAL_BASE_OF = (l) => ({ "ך": "כ", "ם": "מ", "ן": "נ", "ף": "פ", "ץ": "צ" })[l] || l;
  // Final letters (Golan, 14.10): shown without nikud; the narrator says the letter's name ("מֵם סוֹפִית").
  // A final-letter question has only final letters on its gates. They join the game only when chosen in settings.
  const FINALS = ["ך", "ם", "ן", "ף", "ץ"];
  const FINAL_NAME = { "ך": "כף סופית", "ם": "מם סופית", "ן": "נון סופית", "ף": "פא סופית", "ץ": "צדי סופית" };
  const isFinal = (l) => FINALS.includes(l);
  const ALL_LETTERS = [...LETTERS, ...FINALS];   // letter recognition uses every letter, finals too (Golan, 14.10)
  // Letters chosen by the parent/teacher (final letters count too). Fewer than 6 chosen: other regular letters
  // are mixed in at random, but chosen letters still come up most of the time (70%). Nothing chosen = all regular letters.
  // The first question of a round always uses a chosen letter (Golan, 14.10), so the game starts with them.
  // auto = "החלטת מערכת"; an old saved list with no mode stays a manual choice
  const lettersMode = () => settings.lettersMode || (chosenLetters().length ? "manual" : "auto");
  function chosenLetters() { return [...new Set((settings.letters || []).map((l) => l.replace(/[\u05BC\u05C1\u05C2]/g, "")))].filter((l) => ALL_LETTERS.includes(l)); }
  function pickTarget(prev, onlyChosen) {
    const chosen = chosenLetters();
    const all = chosen.length ? chosen : ALL_LETTERS;
    const others = ALL_LETTERS.filter((l) => !all.includes(l));
    for (let i = 0; i < 12; i++) {
      const fromChosen = onlyChosen || !chosen.length || chosen.length >= 6 || !others.length || Math.random() < 0.7;
      const src = fromChosen ? all : others;
      const t = src[Math.floor(Math.random() * src.length)];

  }
  function diagnostics() {
    const avg = fpsSamples.length ? fpsSamples.reduce((a, b) => a + b, 0) / fpsSamples.length : 0;
    return [
      `FPS avg(10s): ${avg.toFixed(1)}   worst: ${worstFps === 999 ? "-" : worstFps.toFixed(0)}`,
      `Load to ready: ${(loadMs / 1000).toFixed(1)}s   downloaded: ${downloadedKB()}`,
      `JS memory: ${performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + " MB" : "n/a"}`,
      `Render: ${engine.getRenderWidth()}x${engine.getRenderHeight()}  dpr ${window.devicePixelRatio}`,
      `Triangles on screen: ${countTris().toLocaleString()}`,
      `GPU: ${gpuName()}`,
      `WebGL: ${engine.webGLVersion}   Babylon ${BABYLON.Engine.Version}`,
      `Voice clips: ${clipStatus.ok} loaded, ${clipStatus.missing} missing (../audio)`,
      `Hebrew voice (fallback): ${heVoice ? heVoice.name : "not found"}`,
      `Browser: ${navigator.userAgent}`,
    ].join("\n");
  }
  function updatePerf(now) {
    const fps = engine.getFps();
    if (isFinite(fps) && fps > 0 && state.mode === "drive") {
      fpsSamples.push(fps); if (fpsSamples.length > 600) fpsSamples.shift();
      if (now - state.roundStart > 3000) worstFps = Math.min(worstFps, fps);
    }
    if (now - lastPerfUpdate < 500 || true /* no FPS box (Golan 28.10) */) return;
    lastPerfUpdate = now;
    const cls = fps >= 50 ? "good" : fps >= 30 ? "ok" : "bad";
    $("perf").innerHTML =
      `<b class="${cls}">${fps.toFixed(0)}</b> FPS<br>` +
      `▲ ${countTris().toLocaleString()} · ${settings.quality === "eco" ? "eco" : "high"}${settings.stress === "on" ? " · stress" : ""}`;
  }

  // ---------- main loop ----------
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05) * motionK(); motionMs += dt * 1000; const mnow = motionMs;
    const now = performance.now();
    const p = pace();

    // A lane change right after a bump used to switch to "drive" while the car was still past the gate line,
    // so the gate never triggered and the round froze. The car now finishes backing up first.
    const backing = state.backTo != null && state.z > state.backTo;
    if ((state.mode === "drive" || state.mode === "intro") && !backing) {
      let target = state.mode === "intro" ? 4 : p.cruise;
      const dist = state.gateZ - state.z;
      if (state.mode === "drive" && !state.resolved && dist < 16 && dist > 0) target = p.near; // slow down before the decision
      if (state.celebrate) target = Math.min(target, p.near * 0.4);   // drive slowly through "יש! נכון!" and the celebration (Golan, 13.10)
      state.speed += (target - state.speed) * Math.min(1, dt * 2.5);
      const before = state.z;
      state.z += state.speed * dt;
      if (state.mode === "drive" && !state.resolved && before < state.gateZ - 1.6 && state.z >= state.gateZ - 1.6) onPassGate();
    }
    if (state.bounce > 0) state.bounce = Math.max(0, state.bounce - dt * 3);
    if ((state.mode === "blocked" || state.mode === "drive") && backing && now > state.backAt) {
      const v = Math.min(2.4, 0.8 + (now - state.backAt) / 400);   // eases into a slow reverse
      const step = Math.min(v * dt, state.z - state.backTo);
      state.z -= step; state.speed = 0;
      for (const w of wheels) w.rotation.x -= step * 2.6;
      if (state.z <= state.backTo + 1e-3) state.backTo = null;
    }

    // car
    const tx = drag.active ? drag.x : LANE_X[state.lane];
    // Golan 18.10: slower from lane to lane with the arrows, a tap or a mouse click, at one capped speed however far the lane is
    // (a far lane no longer means a fast jump); a dragging finger is followed quickly
    if (drag.active && drag.moved) state.carX += (tx - state.carX) * Math.min(1, dt * 18);
    else { const d = tx - state.carX, gap = LANE_X.length > 1 ? Math.abs(LANE_X[1] - LANE_X[0]) : 3, v = Math.min(Math.abs(d) * 3.2, gap * 2.2); state.carX += Math.sign(d) * Math.min(Math.abs(d), v * dt); }
    car.position.set(state.carX, Math.sin(state.bounce * Math.PI) * 0.25, state.z);
    car.rotation.x = -Math.sin(state.bounce * Math.PI) * 0.12;   // the bump lifts the nose; the slow reverse does the backing off (no jump back)
    car.rotation.y = (tx - state.carX) * 0.12;
    for (const w of wheels) w.rotation.x += state.speed * dt * 2.6;

    // world follows the car; recycled props wrap around
    world.position.z = Math.floor(state.z / 50) * 50;
    for (const r of recycled) if (r.m.position.z < state.z - 14) r.m.position.z += r.span;

    // gates
    // The sign in the car's lane is not highlighted (Golan 18.10, all games); only the yellow hint frame remains.
    gates.forEach((g, i) => {
      const pulse = state.hintPulse && state.q && i === state.q.correctLane ? 1 + Math.sin(mnow / 420) * 0.035 : 1;   /* gentle breathing */
      g.sign.scaling.set(pulse, pulse, 1);
      if (g.shake > 0) {   // knocked by the car
        g.shake = Math.max(0, g.shake - dt * 1.4);
        g.sign.rotation.z = Math.sin(mnow / 38) * 0.14 * g.shake * g.shake;
        g.sign.position.x = Math.sin(mnow / 29) * 0.08 * g.shake;
        if (g.shake === 0) { g.sign.rotation.z = 0; g.sign.position.x = 0; }
      }
    });
    // Stuck in front of a wrong gate: say the right syllable again every 4 seconds (Golan, 14.10)
    if (state.mode === "blocked" && state.q && now - (state.nagAt || 0) > 4000) {
      state.nagAt = now;
      const busy = (clipNow && !clipNow.paused && !clipNow.ended) || ("speechSynthesis" in window && speechSynthesis.speaking);
      if (!busy) { if (state.reads < MAX_READS) { say(state.q.target, 0.7); state.reads++; } else if (!state.hintPulse) { state.hintPulse = true; drawSign(gates[state.q.correctLane], state.q.lanes[state.q.correctLane], true); } state.nags = (state.nags || 0) + 1; if (state.nags >= 1) state.flashAt = now; }   // after 4 readings only the letter keeps flashing (Golan, 15.10)   // from the 3rd reading: the question + the replay after the mistake came first
    }
    // From the 3rd reading, each reading lifts the right letter a little, slowly, and puts it back (Golan, 14.10)
    if (state.flashAt && state.q && !state.resolved) {
      const t = now - state.flashAt, g = gates[state.q.correctLane], FL = 2400;   /* slower, smaller hint lift (Golan 16.10, all games) */
      g.sign.position.y = 3.05 + 0.18 * Math.sin(Math.PI * Math.min(1, t / FL));
      if (t >= FL) { state.flashAt = 0; g.sign.position.y = 3.05; }
    }
    if (state.celebrate && state.q && state.mode !== "paused") {
      const c = state.celebrate, g = gates[state.q.correctLane];
      c.t += dt;
      const k = Math.min(1, c.t / 0.6), e = 1 - (1 - k) * (1 - k);   // ease out
      // keep the letter at a fixed distance ahead of the car, so the camera never reaches it (it looked huge, Golan 14.10)
      g.sign.position.z = Math.max(0, car.position.z + state.celebAhead - state.gateZ);
      const S = 0;   // the letter does not grow (Golan, 14.10)
      if (c.phase === "rise") { g.sign.position.y = 3.05 + 1.0 * e; g.sign.scaling.set(1 + S * e, 1 + S * e, 1); g.sign.rotation.y = 0; }
      // no spin (Golan, 14.10): while the syllable is said the letter grows and is emphasised with one soft pulse, then moves away
      else if (c.phase === "spin") {
        const b = Math.sin(Math.PI * Math.min(1, c.t / 0.9));
        g.sign.position.y = 4.05 + 0.25 * b; g.sign.rotation.y = 0; g.sign.rotation.z = 0;
        const z = 1 + S + 0.3 * b; g.sign.scaling.set(z, z, 1);
      }
      else { g.sign.position.y = 4.05 + c.t * 1.5; c.away = (c.away || 0) + c.t * 60 * dt; g.sign.position.z += c.away; g.sign.rotation.y = 0; g.sign.rotation.z = 0; g.sign.scaling.set(1 + S, 1 + S, 1); }
      placeToast(g);
    }

    // camera (slight lag for a sense of speed)
    // The camera moves sideways only as far as it must to show the outer gate, never past the road's
    // edge: when all the gates fit on screen it stays in the middle (Golan, 15.10: with 5 gates the
    // edge letter was cut off while grass beside the road filled the other side).
    cam.position.y = state.camHeight || 4.6; cam.position.z = car.position.z - 9;
    const vfov = cam.fovMode === BABYLON.Camera.FOVMODE_HORIZONTAL_FIXED ? null : cam.fov;
    const tanH = vfov == null ? Math.tan(cam.fov / 2) : Math.tan(vfov / 2) * engine.getAspectRatio(cam);
    const gateDist = STOP_BACK + 9;   // fixed, so the camera does not slide sideways as a gate comes near (Golan, 15.10)
    const edge = LANE_X[LANE_X.length - 1] + 2.0;          // outer post, with room for the bigger focused sign
    const room = Math.max(0, edge - gateDist * tanH * 0.96);
    const camX = Math.max(-room, Math.min(room, state.carX));
    cam.position.x += (camX - cam.position.x) * Math.min(1, dt * 4);
    cam.setTarget(new BABYLON.Vector3(cam.position.x, 1.4, car.position.z + 9));

    updatePerf(now);
  });

  engine.runRenderLoop(() => scene.render());
  applyLanes();   // calls fitCamera too
  FL.screen.onChange(() => { engine.resize(); fitCamera(); });   // rotation, resize, zoom, another monitor (screens standard)

  // ---------- start ----------
  const fontReady = (document.fonts && document.fonts.load) ? Promise.race([
    Promise.all([document.fonts.load(`800 170px "Noto Sans Hebrew"`, "בָּ"), document.fonts.load(`800 40px "Noto Sans Hebrew"`, "שָׁ"), document.fonts.load(`400 170px "FL Cursive"`, "אבךןץ")]),
    new Promise((r) => setTimeout(r, 4000)),
  ]) : Promise.resolve();
  fontReady.then(() => {
    allGates.forEach((g, i) => drawSign(g, ["מ", "ב", "ש", "ל", "ג"][i], false));   // letter recognition: no nikud
    for (const g of allGates) g.root.position.z = GATE_AHEAD;
    return scene.whenReadyAsync();
  }).then(() => {
    loadMs = performance.now() - T0;
    $("go").disabled = false; $("go").textContent = "יוצאים לדרך";
  });
  // Read the start instructions aloud (clip ins_start). Browsers block sound before the first click,
  // so we try on load, then again on the first touch of the start screen, and on the 🔊 button.
  let heardIntro = false;
  function sayIntro() { heardIntro = true; say("הוראות", 1); }
  // In the phone app (Capacitor) autoplay is allowed, so this always plays there. In Edge it plays if autoplay is set to "Allow".
  const introTok = navTok;   // a door before the intro plays cancels it for good (Golan, 16.10)
  function autoIntro() {
    if (settings.voice !== "on" || heardIntro || $("start").hidden || navTok !== introTok || $("go").classList.contains("pressed")) return;
    if (document.querySelector(".fl-ov") || settingsOpen()) return setTimeout(autoIntro, 1500);   /* "who plays?" or settings open: wait */   /* "who plays?" still open: wait for it, then look first */
    const a = getClip(genderedId("ins_start"));
    if (a._bad) { heardIntro = true; return sayBrowser("הוראות", 0.8); }
    if (!a._ok) return a.addEventListener("canplaythrough", autoIntro, { once: true });
    if (clipNow) clipNow.pause();
    a.currentTime = 0; clipNow = a; a.play().then(() => { heardIntro = true; }).catch(() => {});
  }
  setTimeout(autoIntro, 1500);   // let the child look at the screen first (Golan, 16.10)
  $("hear").addEventListener("click", (e) => { e.stopPropagation(); sayIntro(); });
  $("start").addEventListener("pointerdown", (e) => { if (!heardIntro && !e.target.closest("button")) sayIntro();   /* any button (door, gear, go, speaker) never starts the intro */ });
  $("go").addEventListener("click", () => {
    if (clipNow) clipNow.pause(); try { speechSynthesis.cancel(); } catch (e) {}
    unlockAudio();
    try { if (document.documentElement.requestFullscreen && matchMedia("(pointer: coarse)").matches) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
    // React, say "יוצאים לדרך!", short pause, then the car screen (Golan, 14.10)
    if ($("go").classList.contains("pressed")) return;
    $("go").classList.add("pressed"); sfx.lane(); tone([523, 784], 0.12, "triangle", 0.35);
    say("יוצאים לדרך!", 1); const tok = navTok;
    setTimeout(() => { $("go").classList.remove("pressed"); if (tok !== navTok) return; $("start").hidden = true; openCarPick(); }, 1600);
  });
  // "לְסַיֵּם" (day end, the child's choice): a soft goodbye, then back to the start screen
  function finishDay() {
    if (!dayEndNow) { backToStart(); return; }
    endUi.set({ note: "מחר ממשיכים 🌙", buttons: [] }); $("swapAsk").hidden = true;
    setTimeout(() => { backToStart(); }, 1800);
  }
  function againRound() { $("end").hidden = true; $("hud").hidden = true; openCarPick(); }   // car choice before every round (Golan, 14.10)

  // ---------- car picker (Golan, 14.10): "יש לבחור מכונית", then praise, then the round starts ----------
  function openCarPick() {
    const box = $("cars"); box.textContent = "";
    for (const id of CARS) {
      const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-pressed", "false");   // no frame on the last car; frames only while a car grows (Golan, 14.10)
      const img = document.createElement("img"); img.src = "cars/" + id + ".jpg"; img.alt = ""; b.append(img);
      b.addEventListener("click", () => pickCar(id));
      box.append(b);
    }
    $("carPick").hidden = false;
    clearTimeout(carNagT);
    carSays = 0; setTimeout(() => { if (!$("carPick").hidden && !picking) { say("יש לבחור מכונית", 1); carSays++; setTimeout(() => whenQuiet(carNag), 300); } }, 700);   // the pictures first, then the voice (Golan, 14.10)
  }
  // no car chosen for 4 s: say it again and flash all 9 cars one by one in random order (Golan, 14.10)
  let carNagT = 0, carFlashTs = [], carSays = 0;   // "יש לבחור מכונית" is said at most twice, then the cars only flash (Golan, 15.10)
  function stopCarFlash() {   // a pick in the middle stops the flashing at once (Golan, 14.10)
    clearTimeout(carNagT); carFlashTs.forEach(clearTimeout); carFlashTs = [];
    [...$("cars").children].forEach((b) => b.classList.remove("flash"));
  }
  function carNag() {
    clearTimeout(carNagT);
    carNagT = setTimeout(() => {
      if ($("carPick").hidden || picking) return;
      if (carSays < 2) { say("יש לבחור מכונית", 1); carSays++; }
      const btns = [...$("cars").children].sort(() => Math.random() - 0.5);
      btns.forEach((b, i) => carFlashTs.push(setTimeout(() => { b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); }, i * 420)));
      carFlashTs.push(setTimeout(() => whenQuiet(carNag), btns.length * 420 + 1000));
    }, 4000);
  }
  let picking = false;
  async function pickCar(id) {
    if (picking) return; picking = true; stopCarFlash(); const pickedAt = performance.now();
    settings.car = id; saveSettings();
    [...$("cars").children].forEach((b, i) => { b.setAttribute("aria-pressed", String(CARS[i] === id)); b.classList.toggle("chosen", CARS[i] === id); });
    say(Math.random() < 0.5 ? "יופי של בחירה!" : "בחירה מצוינת!", 1);
    await useCar(id);
    // wait for the praise to end, then a short pause, then the start line (Golan, 14.10; pause shortened 15.10)
    whenQuiet(() => setTimeout(() => { picking = false; if ($("carPick").hidden) return; $("carPick").hidden = true; $("hud").hidden = false; { const sc = starCount(); if (sc) sc.reset(); } countdown();   /* stars show at 0 as soon as the HUD appears (Golan 16.10) */ }, Math.max(250, 1800 - (performance.now() - pickedAt))));   /* wait for the 1.8 s grow to finish (Golan, 16.10) */
  }
  if (settings.car) useCar(settings.car);   // the last chosen car is ready at once

  // ---------- start line + 3, 2, 1 (Golan, 14.10): the car waits on the line, then the round starts ----------
  const startLine = (() => {
    const t = new BABYLON.DynamicTexture("startTex", { width: 512, height: 64 }, scene, false);
    const c = t.getContext(), n = 16;
    for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) { c.fillStyle = (i + j) % 2 ? "#1d2a3a" : "#ffffff"; c.fillRect(i * 32, j * 32, 32, 32); }
    t.update();
    const m = new BABYLON.StandardMaterial("startMat", scene); m.diffuseTexture = t; m.emissiveColor = new BABYLON.Color3(0.5, 0.5, 0.5); m.specularColor = BABYLON.Color3.Black();
    const line = BABYLON.MeshBuilder.CreateGround("startLine", { width: 10.4, height: 1.3 }, scene);
    line.material = m; line.setEnabled(false);
    return line;
  })();
  let countToken = 0;
  // HUD counter: the number and the same shared gold star as every game (Golan 16.10)
  function starCount() { return LRN && LRN.starCounter ? LRN.starCounter($("stars")) : null; }   // shared HUD counter, same one every call (Golan 16.10)
  function countdown() {
    const my = ++countToken;
    state.mode = "ready"; state.speed = 0; state.q = null;
    $("target").textContent = ""; document.querySelector(".prompt").classList.remove("listen"); renderDots();
    startLine.position.set(0, 0.04, state.z + 2.2); startLine.setEnabled(true);
    const box = $("count"), steps = [["3", "#10b947"], ["2", "#10b947"], ["1", "#10b947"]];   // all glowing green (Golan, 15.10)
    steps.forEach(([n, col], i) => setTimeout(() => {
      if (my !== countToken || state.mode !== "ready") return;
      box.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = n; sp.style.background = col; box.append(sp);
      tone([i === 2 ? 660 : 520], 0.16, "sine", 0.35);
    }, 700 + i * 1000));
    setTimeout(() => {
      if (my !== countToken || state.mode !== "ready") return;
      box.innerHTML = ""; tone([880, 1175], 0.14, "triangle", 0.4);
      startRound();
      setTimeout(() => startLine.setEnabled(false), 6000);
    }, 700 + 3 * 1000);
  }

  // ---------- door = back to the previous screen; here always the start screen (Golan, 14.10) ----------
  // Opened from the central hub: every door in the game goes back to the hub's game list (Golan 16.10, all games)
  const toHub = () => !!(LRN && LRN.fromHub && LRN.hubUrl);
  function goHub() { hushAll(); countToken++; if (hg) hg.stop(); location.href = LRN.hubUrl.split("#")[0] + "#games"; }
  function backToStart() {
    if (toHub()) return goHub();
    resetToStart();
  }
  function resetToStart() {
    hushAll(); if (hg) hg.stop();
    state.q = null; state.celebrate = null; state.resolved = true; state.mode = "intro"; state.flashAt = 0;
    countToken++; $("count").innerHTML = ""; startLine.setEnabled(false);
    for (const g of gates) { g.sign.position.set(0, 3.05, 0); g.sign.scaling.set(1, 1, 1); }
    ["hud", "end", "carPick", "settings"].forEach((id) => ($(id).hidden = true));
    $("start").hidden = false;
  }
  ["doorGame", "doorCar", "doorEnd"].forEach((id) => $(id).addEventListener("click", backToStart));   // door + gear on every screen, the pause screen too (Golan 16.10)   // the door always leaves to the island's game list, from every screen (Golan 28.10); opened on its own: the start screen
  // a tap outside the "change letters?" question closes it (Golan 16.10: outside a popup = back one step)
  $("end").addEventListener("pointerdown", (e) => { if (!$("swapAsk").hidden && !e.target.closest("#swapAsk") && !e.target.closest("button")) { $("swapAsk").hidden = true; if (endUi) endUi.fit(); } });

  // test hook for automated checks
  window.__race = { state, settings, askQuestion, setLane, drawSign, get gates() { return gates; }, drag, makeQuestion, endRound };
})();
</script>
</body>
