<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FirstLearning</title>
<link rel="stylesheet" href="games/shared/fonts/fonts.css">
<style>
/* The central entry page (Golan 16.10): "מי משחק?" once, then the game list, then the game.
   Same daylight look as the games: sky, the 9 shared balloons, the child's companion. */
  :root { --sky: #bfe6ff; --ink: #1d2a3a; --card: #ffffffee; --accent: #ff8a3d; --muted: #5b6b7f; color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  /* Screens standard (screens/screens-standard.md): sizes in --u (a 1280x720 board, 720x1280 standing) with
     finger floors (--tap-s, --tap), distances from the edges in --edge-*, both orientations; set by games/shared/screen.js. */
  html, body { margin: 0; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; background: var(--sky); color: var(--ink);
    font-family: "Noto Sans Hebrew", system-ui, sans-serif; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    background: linear-gradient(#8fd0ff 0%, #bfe6ff 55%, #e6f6ff 100%); }
  :root { --btn: max(calc(64 * var(--u, 1px)), var(--tap-s, 54px)); --e-t: var(--edge-t, max(12px, env(safe-area-inset-top)));
    --e-l: var(--edge-l, max(16px, env(safe-area-inset-left))); --e-r: var(--edge-r, max(16px, env(safe-area-inset-right)));
    --e-b: var(--edge-b, max(12px, env(safe-area-inset-bottom))); --g: max(calc(12 * var(--u, 1px)), var(--gap, 8px)); }
  .round-btn { width: var(--btn); height: var(--btn); border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; padding: 0; }
  /* door, and the gear right under it, on every screen (Golan 16.10), always inside the safe area (no notch) */
  .door-btn, .gear-btn { position: fixed; top: var(--e-t); left: var(--e-l); z-index: 10000; background: var(--card);
    box-shadow: 0 4px 16px #0002; }
  .gear-btn { top: calc(var(--e-t) + var(--btn) + var(--g)); }
  .door-btn svg { width: 60%; height: 60%; } .gear-btn svg { width: 56%; height: 56%; color: #5b6470; }
  .round-btn:active { transform: scale(.94); }
  /* the game list: keeps clear of the door/gear column on both sides; scrolls if it ever can't fit */
  #games { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: safe center;
    gap: calc(34 * var(--u, 1px)); overflow-y: auto; overscroll-behavior: contain;
    padding: var(--e-t) calc(var(--e-r) + var(--btn) + var(--g)) var(--e-b) calc(var(--e-l) + var(--btn) + var(--g)); }
  #games.on { display: flex; }
  .who { display: flex; align-items: center; gap: calc(10 * var(--u, 1px)); background: var(--card); border-radius: 999px; flex: none;
    padding: calc(4 * var(--u, 1px)) calc(22 * var(--u, 1px)) calc(4 * var(--u, 1px)) calc(8 * var(--u, 1px)); box-shadow: 0 4px 16px #0002; }
  .who h1 { margin: 0; font-size: max(calc(32 * var(--u, 1px)), 22px); font-weight: 800; white-space: nowrap; }
  .who .comp svg { width: max(calc(64 * var(--u, 1px)), 44px); height: auto; display: block; }
  /* speaker at the end of every title line: Hila reads the title (Golan 16.10); a missing clip stays silent */
  .spk { border: 0; background: none; cursor: pointer; line-height: 1; padding: 0; border-radius: 50%; flex: none;
    display: inline-grid; place-items: center; min-width: var(--tap-s, 44px); min-height: var(--tap-s, 44px); }
  .spk:active { transform: scale(.9); }
  /* the finger-size touch area reaches past the line without making the line taller */
  .spk { margin-block: calc((1.3em - var(--tap-s, 44px)) / 2); }
  .who .spk { font-size: max(calc(32 * var(--u, 1px)), 24px); }
  .game .spk { font-size: max(calc(24 * var(--u, 1px)), 20px); }
  /* in a card the extra touch area goes up only, so it never reaches below the card (home bar zone) */
  .game .spk { margin-block: calc(1.3em - var(--tap-s, 44px)) 0; }
  /* the speaker at the end of the line (Golan 16.10): in RTL the card's left edge; the name keeps the rest, centred */
  .game .name { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: calc(4 * var(--u, 1px)); width: 100%; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, min(calc(300 * var(--u, 1px)), var(--cw, 9999px)))); gap: var(--g); width: 100%; justify-content: center; flex: none; }
  .game { position: relative; border: 0; border-radius: calc(26 * var(--u, 1px)); background: #fff; box-shadow: 0 6px 0 #0001, 0 6px 20px #0002;
    padding: calc(10 * var(--u, 1px)) calc(10 * var(--u, 1px)) calc(8 * var(--u, 1px)); cursor: pointer; font: inherit; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: calc(4 * var(--u, 1px)); transition: transform .15s; min-width: 0; }
  /* hover / keyboard focus: a thin frame in the card's own colour, the card stays in place (Golan 16.10) */
  @media (hover: hover) { .game:hover { outline: max(calc(3 * var(--u, 1px)), 2px) solid var(--ac, #4dabf7); outline-offset: 0; } }
  .game:focus-visible { outline: max(calc(3 * var(--u, 1px)), 2px) solid var(--ac, #4dabf7); outline-offset: 0; }
  .game:active { transform: scale(.96); }
  .game .pic { width: 100%; aspect-ratio: 16 / 9; border-radius: calc(18 * var(--u, 1px)); display: grid; place-items: center; overflow: hidden; }
  .game .pic svg { width: 100%; height: 100%; display: block; }
  .game b { font-size: max(calc(24 * var(--u, 1px)), 16px); font-weight: 800; line-height: 1.2; }
  /* nikud only at 28px or more, with line height 1.7-1.9 (literacy ruling 16.10); smaller, the plain text */
  .nq { line-height: 1.75 !important; }
  .game.go { transform: scale(1.12); z-index: 2; transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
  /* standing: 2 columns x 3 rows; the title sits beside the door at the top, the cards start under the gear */
  html[data-screen~="portrait"] #games { justify-content: flex-start; gap: var(--g);
    padding: var(--e-t) var(--e-r) var(--e-b) var(--e-l); }
  html[data-screen~="portrait"] .who { align-self: flex-start; margin-inline-end: calc(var(--btn) + var(--g)); min-height: var(--btn); max-width: calc(100% - var(--btn) - var(--g)); }
  html[data-screen~="portrait"] .who h1 { font-size: max(calc(40 * var(--u, 1px)), 20px); }
  html[data-screen~="portrait"] .grid { grid-template-columns: repeat(var(--cols, 2), minmax(0, min(calc(330 * var(--u, 1px)), var(--cw, 9999px)))); margin-top: var(--btn); }
  html[data-screen~="portrait"] .game .pic { aspect-ratio: 16 / 8.5; }
  html[data-screen~="portrait"] .game b { font-size: max(calc(30 * var(--u, 1px)), 16px); }
  .set-ov { position: fixed; inset: 0; z-index: 10001; background: rgba(20, 40, 70, .55); display: grid; place-items: center;
    padding: var(--e-t) calc(var(--e-r) + var(--btn) + var(--g)) var(--e-b) calc(var(--e-l) + var(--btn) + var(--g)); }
  .set-box { position: relative; background: #fff; border-radius: 28px; padding: 28px 24px; width: min(100%, max(calc(520 * var(--u, 1px)), 460px)); height: 100%; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px #0004; }
  /* the same window as inside the games (Golan 19.10): always the same size, a fixed head (X + title), a scrolling body that opens at the top */
  .set-head { position: relative; flex: 0 0 auto; margin-bottom: 12px; }   /* a gap under the title (Golan 19.10) */
  .set-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-inline: 3px; }   /* room for the child row's outline */
  .set-box h2 { margin: 0 0 10px; text-align: center; font-size: 26px; }
  .set-box h3 { margin: 14px 0 8px; font-size: 20px; }
  /* X at the top right of every settings panel (Golan 16.10); closes like a tap outside */
  .set-x { position: absolute; top: -22px; right: -18px; width: max(var(--tap-s, 44px), 44px); height: max(var(--tap-s, 44px), 44px); border-radius: 50%; border: 2px solid #d5dde6; background: #fff; color: var(--ink); padding: 0; cursor: pointer; display: grid; place-items: center; z-index: 1; box-shadow: 0 2px 8px #0002; }
  .set-x svg { width: 55%; height: 55%; }
  .set-box h2 { padding-inline: calc(max(var(--tap-s, 44px), 44px) + 4px); }
  .set-ex { color: var(--muted); font-size: 15px; margin: 8px 0 0; }
  /* standing: the settings box goes under the door and gear, full width */
  html[data-screen~="portrait"] .set-ov { padding: var(--e-t) var(--e-r) var(--e-b) var(--e-l); }   /* standing: full height, like the games (Golan 19.10) */
  .set-kid { flex-wrap: wrap; } .set-kid .n { min-width: 6em; }
  .set-kid { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 16px; background: #f5f9ff; margin-bottom: 6px; }
  .set-kid.cur { outline: 2px solid #9cc8f5; }
  .set-kid .c svg { display: block; } .set-kid .n { flex: 1; font-size: 20px; font-weight: 700; }
  .set-kid button, .set-row button { border: 0; border-radius: 999px; background: #fff; box-shadow: 0 1px 4px #0002; padding: 6px 12px; font-weight: 700; font-size: 16px; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
  .set-kid .dl { color: #c92a2a; }
  .set-gate { display: inline-flex; align-items: center; gap: 8px; }
  .set-gate .q { font-size: 20px; font-weight: 800; white-space: nowrap; }
  .set-gate input { width: 3.2em; font: inherit; font-size: 20px; font-weight: 700; text-align: center; padding: 4px 6px; border: 2px solid #9cc8f5; border-radius: 12px; }
  .set-gate.ok input { animation: gateOk .55s; border-color: #2b8a3e; }   /* right answer: the box flashes green, then edit opens (Golan 20.10) */
  @keyframes gateOk { 0%, 100% { background: #fff; } 30%, 70% { background: #8ce99a; } }
  .set-gate.no input { border-color: #e03131; animation: gateNo .35s; }
  @keyframes gateNo { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  /* parent summary (from "תגיד לי") and the letter check round, in the hub's settings (Golan 20.10) */
  /* every topic in its own frame; an open topic grows and turns light blue, like the child row (Golan 20.10) */
  .set-body section:not(:first-child) { border: 1px solid #dfe6ee; border-radius: 16px; padding: 10px 12px; margin-bottom: 8px; }
  .set-body section:has(.fl-cap[aria-expanded=true]) { background: #f5f9ff; border-color: #9cc8f5; box-shadow: inset 0 0 0 1px #9cc8f5; }
  .set-sum .score { font-size: 22px; font-weight: 800; text-align: center; margin: 8px 0 2px; }
  .set-sum .sub { font-size: 16px; color: var(--muted); text-align: center; margin: 0 0 8px; }
  .set-sum .grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; direction: rtl; }
  .set-sum .grid span { width: 46px; height: 46px; border-radius: 12px; border: 2px solid #d5dde6; background: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
  .set-sum .grid span.ok { background: #e3f7ec; border-color: #2bb673; } .set-sum .grid span.later { background: #fff4dc; border-color: #ffb020; }
  .set-sum .grid span.final { border-style: dashed; }
  .set-sum .leg { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 16px; color: var(--muted); margin: 4px 0 10px; }
  .set-sum .leg i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 2px solid; vertical-align: -2px; margin-inline-end: 4px; }
  .set-sum .note { font-size: 16px; line-height: 1.5; color: var(--muted); background: #f3f8fd; border-radius: 14px; padding: 8px 12px; }
  .set-chk .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; }   /* title and button in one line (Golan 20.10) */
  .set-chk h3 { margin: 4px 0; font-size: 20px; }
  .set-chk button { border: 0; border-radius: 999px; background: #ff922b; color: #fff; box-shadow: 0 1px 4px #0002; padding: 10px 20px; font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; min-height: 48px; }
  .set-form, .set-confirm { background: #f5f9ff; border-radius: 16px; padding: 10px; margin-bottom: 6px; text-align: center; }
  .set-form .prev svg { display: block; margin: 0 auto; }
  .set-in { font-size: 22px; font-family: inherit; text-align: center; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; width: min(260px, 100%); }
  .set-row { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .set-row .on { outline: 3px solid #2b8a3e; }
  .set-row .col { width: 32px; height: 32px; padding: 0; border: 3px solid #fff; }
  .set-row .itm { padding: 2px; border-radius: 12px; } .set-row .itm:disabled { opacity: .3; }
  .set-row .ok { background: #2bb673; color: #fff; padding: 8px 22px; } .set-row .ok:disabled { opacity: .4; }
  .set-confirm p { font-size: 20px; margin: 4px 0; } .set-confirm small { color: var(--muted); font-size: 15px; }
  .set-row .keep { background: #2bb673; color: #fff; padding: 8px 18px; }
  .set-row .hold { position: relative; overflow: hidden; background: #e03131; color: #fff; padding: 8px 18px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .hold .fill { position: absolute; inset: 0; background: #0004; transform: scaleX(0); transform-origin: right; pointer-events: none; }
  .set-box .fl-grid { margin: 0 auto; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1d2a3a; color: #fff;
    padding: 10px 20px; border-radius: 14px; font-size: 18px; z-index: 9000; display: none; }
</style>
</head>

<script>
(() => {

  const LRN = window.FL && FL.learner;
  const $ = (id) => document.getElementById(id);

  // ---------- the six games (path from this page; "?hub=1" tells the game the child was already chosen here) ----------
  const GAMES = [
    // Golan 21.10: three additions to the letter-recognition station, 9 cards in 3x3 with the song first
    { id: "song", ac: "#5c7cfa", name: "שִׁיר הָאָלֶף-בֵּית", path: "games/abc-song/index.html", bg: "#2a2f6b", pic: "song", noSystem: true },
    { id: "race", ac: "#4dabf7", name: "מֵרוֹץ הַשְּׁעָרִים", path: "voice/race-gates-voice/index.html", bg: "#d8f1ff", pic: "car" },
    { id: "detective", ac: "#22b8cf", name: "הַבַּלָּשׁ בָּעֲנָנִים", path: "games/letter-recognition/detective/index.html", bg: "#e4f6ff", pic: "detective" },
    { id: "waking", ac: "#9775fa", name: "הָאוֹת שֶׁמִּתְעוֹרֶרֶת", path: "games/waking-letter/index.html", bg: "#efe9ff", pic: "waking" },
    { id: "tellme", ac: "#ff922b", name: "מְשַׂחֲקִים בְּיַחַד", path: "games/tell-me/index.html", bg: "#fff1df", pic: "tellme" },

  const L = (x, y, ch, size, fill = "#1d2a3a") => `<text x="${x}" y="${y}" font-size="${size}" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="${fill}" font-family="Noto Sans Hebrew, sans-serif">${ch}</text>`;
  const PICS = {
    memory: `<svg viewBox="0 0 160 100"><defs><linearGradient id="hcN" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1b2a6b"/><stop offset="1" stop-color="#3b2f86"/></linearGradient></defs>
  <g transform="translate(8 14)"><rect width="34" height="34" rx="5" fill="url(#hcN)"/><circle cx="22" cy="12" r="6" fill="#FFF0A8"/><circle cx="25" cy="10" r="5" fill="#25307a"/><circle cx="9" cy="24" r="1.2" fill="#FFF6C8"/><circle cx="14" cy="8" r="1" fill="#FFF6C8"/></g>
  <g transform="translate(8 54)"><rect width="34" height="34" rx="5" fill="url(#hcN)"/><circle cx="22" cy="12" r="6" fill="#FFF0A8"/><circle cx="25" cy="10" r="5" fill="#25307a"/><circle cx="10" cy="26" r="1.2" fill="#FFF6C8"/></g>
  <g transform="translate(118 54)"><rect width="34" height="34" rx="5" fill="url(#hcN)"/><circle cx="22" cy="12" r="6" fill="#FFF0A8"/><circle cx="25" cy="10" r="5" fill="#25307a"/><circle cx="9" cy="25" r="1.2" fill="#FFF6C8"/></g>
  <g transform="translate(50 20) rotate(-8 20 22)"><rect width="40" height="44" rx="6" fill="#FFF3C9" stroke="#ff8fb3" stroke-width="2.5"/><text x="20" y="25" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="#1d2a3a" font-family="Noto Sans Hebrew, sans-serif">ב</text><circle cx="13" cy="36" r="1.6" fill="#1d2a3a"/><circle cx="27" cy="36" r="1.6" fill="#1d2a3a"/></g>
  <g transform="translate(82 20) rotate(8 20 22)"><rect width="40" height="44" rx="6" fill="#FFF3C9" stroke="#ff8fb3" stroke-width="2.5"/><text x="20" y="25" font-size="30" font-weight="800" text-anchor="middle" dominant-baseline="central" fill="#1d2a3a" font-family="Noto Sans Hebrew, sans-serif">ב</text><circle cx="13" cy="36" r="1.6" fill="#1d2a3a"/><circle cx="27" cy="36" r="1.6" fill="#1d2a3a"/></g>

  // Golan 21.10: bottom row, right to left: "משחקים ביחד" (always, in every station), the song, the letter circle
  const BOTTOM = ["tellme", "song", "circle"];
  function placeCards(grid, cols) {
    const cards = [...grid.children], n = cards.length, rows = Math.ceil(n / cols), first = (rows - 1) * cols, inLast = n - first;
    // a short last row (standing phone, 2 columns): the song and the circle go in the row above it
    const spots = inLast >= 3 ? { tellme: first, song: first + Math.floor((inLast - 1) / 2), circle: n - 1 } : { tellme: first, song: first - cols, circle: first - 1 };
    const fixed = BOTTOM.filter((id) => cards.some((c) => c.dataset.id === id));
    const taken = new Set(fixed.map((id) => spots[id]));
    let k = 0;
    for (const c of cards) {
